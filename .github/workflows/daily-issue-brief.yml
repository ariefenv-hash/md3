# 每日简报/驾驶舱定时任务 —— 北京时间每日 01:00（UTC 17:00）自动执行：
#   1. 夜间 vitest 测试门禁（全量套件）
#   2. 驾驶舱原地更新（#80 瘦身改造 v8.35：「每日简报」议题恒为 1 条
#      <!-- cockpit --> 机器评论，指纹 diff + 静默轮 + 24h 滚动日志；
#      不再追加评论、不再贴全量盘点，明细按需 gh issue list 现查）
# 手动触发：Actions 页 workflow_dispatch，或 gh workflow run daily-issue-brief.yml
name: daily-issue-brief

on:
  schedule:
    - cron: '0 17 * * *'   # UTC 17:00 = Asia/Shanghai 次日 01:00（中国无夏令时，恒定）
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-issue-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 夜间测试门禁
        run: |
          set +e
          npx vitest run > /tmp/vitest.log 2>&1
          echo $? > /tmp/vitest.exit
          tail -n 40 /tmp/vitest.log > /tmp/vitest.tail
          exit 0   # 门禁结果进驾驶舱，不让工作流本身红

      - name: 驾驶舱原地更新（#80：唯一 cockpit 评论 · 指纹 diff · 静默轮）
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Shanghai
        run: bash .github/cockpit.sh /tmp/vitest.exit /tmp/vitest.tail --create-issue
