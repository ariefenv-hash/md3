# GitHub Pages 自动部署工作流（legacy 分支模式兼容版）
# 触发条件：push 到 main 分支（或手动在 Actions 页运行）
# 流程：npm ci → vite build → 将 dist/ 强推到 gh-pages 分支
#       Pages（Deploy from branch 模式）检测到 gh-pages 更新后自动上线
# 说明：不依赖 Pages API / Actions 部署模式，仅需 GITHUB_TOKEN 的 contents:write
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 内置 GITHUB_TOKEN 需要写权限才能推送 gh-pages 分支
permissions:
  contents: write

# v10.38 #235 修复项④裁决：cancel-in-progress 改 false —— 实证全周 33 次 cancelled 并行互杀
# 且「被取消的 run 不告警、最后一次 push 若再 flake 则整段静默零部署」（11-02~05 四天 Pages
# 零上线的推手之一）；改排队语义后：并发 push 依序完跑，旧提交先部署、新提交最后部署、
# 终态收敛最新提交；门禁全绿时部署链路零取消面。代价比是高峰期部署队列变长（可接受）。
concurrency:
  group: pages-legacy
  cancel-in-progress: false

jobs:
  # v7.6：测试门禁 —— vitest 全绿才允许构建部署（防坏提交直上生产，v7.1 教训）
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npx vitest run

      # v8.97 #149 纪律①：「注释 = 代码」数值声明机器核对（新增失配即拦截，豁免表见 scripts/comment-claims-allowlist.json）
      - name: Check comment claims (#149)
        run: node scripts/check-comment-claims.mjs

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # v8.97 #139①③：dist 产物完整性自校验（应用目录平行 / 引用闭合 / precache 双向自洽，
      # #138 复发防线第二道：不信任构建过程，只信任产物）
      - name: Verify dist integrity (#139)
        run: node scripts/verify-dist.mjs

      # v8.97 #139②：dist 档全应用浏览器冒烟（注册表全量 iframe 应用逐个启动 + precache 逐 URL HTTP 自校验；
      # #258 修正 id 正则缺连字符后 code-editor/midi-player 纳入，用例数以脚本实际解析输出为准）
      # —— #138 活例：14 个 e2e 只跑源码档，16 文件缺失、15 应用线上失效而测试全绿；
      # 本步让「源码有、dist 没有」在部署前必然暴露
      - name: Setup Playwright Chromium (#139)
        run: npx playwright install chromium --with-deps

      - name: E2E dist smoke all apps (#139)
        run: node scripts/e2e-dist-smoke.mjs --port 8088

      # v10.59 #256（#246 建议③）：截图指纹 diff 视觉巡检 —— 基线被覆盖类回归的告警层。
      # 告警分档非硬阻断（#235 教训 / #246 边界①）：默认恒 exit 0，只打印分档报告；
      # 漂移清单人工核对后 --update 重录。复用上一步 Playwright 安装与 build 产物，
      # 不新建 CI 工作流（#246 边界②）。
      - name: Shot diff visual patrol (#256)
        run: node scripts/shot-baseline.mjs --port 8096

      - name: Deploy dist/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"

  # v10.38 #235 修复项③：门禁失败主动告警 —— 历史教训：门禁红后 build-and-deploy 静默
  # skipped，11-02~11-05 连续四天 Pages 零上线无人发现；本 job 在 push 触发的 run
  # 失败时自动回帖 #18（取消不告警：cancel-in-progress 已改 false，取消面趋零，
  # 避免 cron 轮闲噪声；重试由下一次 push 自然覆盖）
  gate-alert:
    needs: [test, build-and-deploy]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report gate failure to #18
        uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.build-and-deploy.result }}
        with:
          script: |
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const body = [
              '## 🔴 CI 门禁失败告警（#235 修复项③自动帖）',
              '',
              `- run: [#${context.runNumber}](${repoUrl}/actions/runs/${context.runId})`,
              `- head: ${context.sha.slice(0, 8)} @ ${context.payload.ref}`,
              `- test: **${process.env.TEST_RESULT}** / build-and-deploy: **${process.env.DEPLOY_RESULT}**`,
              '',
              '部署链路已停摆，请执行侧按 #235 排期处置；',
              '「本地绿 CI 红」时先比对 node 版本（CI=20）与 teardown 定时器族（#232/#235 同族排查）。',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 18,
              body,
            });
