# 议题巡查（纯监视：vitest 门禁 + 驾驶舱原地更新，不做开发）
# v7.97 调频 90 分钟 → 每 6 小时：议题池低流动（实测快照多为时间戳复读），
# 且客户端定时任务已每 3 小时唤醒会话开发；patrol 退居守望位，
# 取 :30 偏移（UTC 0:30/6:30/12:30/18:30）避开客户端 :00 触发窗与每日简报。
# v8.35 #80 瘦身改造：与每日简报共用唯一 <!-- cockpit --> 驾驶舱评论
# （.github/cockpit.sh 统一写入），指纹 diff + 静默轮，不再独立写快照评论。
name: issue-patrol

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 测试门禁
        run: |
          set +e
          npx vitest run > /tmp/vitest.log 2>&1
          echo $? > /tmp/vitest.exit
          tail -n 30 /tmp/vitest.log > /tmp/vitest.tail
          exit 0   # 门禁结果进驾驶舱，不让工作流本身红

      - name: 驾驶舱原地更新（#80：与每日简报共用唯一 cockpit 评论）
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Shanghai
        run: bash .github/cockpit.sh /tmp/vitest.exit /tmp/vitest.tail
