<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>时钟 · 9.3 Gastown</title>
  <link rel="icon" href="data:,">
  <!-- 宿主冻结闸 / 无障碍增强：与仓库其它 iframe 应用同款 -->
  <script src="../freeze-shim.js"></script>
  <script src="../_shared/a11y.js"></script>
  <link rel="stylesheet" href="../../css/md3-theme.css">
  <link rel="stylesheet" href="../_shared/md3-tokens.css">
  <!-- 9.3 真字体：Google Sans Flex（OFL 实拉子集，#330 返工——Roboto Flex 退役） -->
  <link rel="stylesheet" href="../../assets/fonts/google-sans-flex.css">
  <style>
  /* ==================== 9.3 Gastown 主壳（按源码从零重写 · v11.53） ====================
   * 规格单源：docs/reference/deskclock/gastown93/{README.md, layouts-resolved.txt,
   *   gastown-values.tsv, styles93 全量 bag（scripts/desc93-arsc.py 重放）}
   * 字体链（font-family XML 实证）：GMS 可下载字体 Google Sans Flex
   *   （fallback Google Sans Text / Google Sans；APK 无字体二进制，
   *   assets/fonts/clock.ttf 仅 6 字形测试占位）。
   * font-variation-settings 矩阵（style bag 逐字）：
   *   主钟/闹钟卡/秒表/计时倒计时 = 'wght' 450,'ROND' 100,'wdth' 80（TextAppearance.Time.DisplayLarge
   *     继承链 = TimeBaseLarge(ls -0.04) → GoogleMaterial3.DisplayLarge.Emphasized.Variable
   *     → 家族层 variable-display-large-emphasized = opsz 57）
   *   城市钟 = 'wght' 500,'ROND' 100,'wdth' 100（CityDigitalClockTextStyle）
   *   计时暂停 = 'wght' 250,'ROND' 100,'wdth' 80（GastownTimerCountdownTextPausedStyle）
   *   计时键盘/设置 200sp = 'wght' 500,'ROND' 100,'wdth' 70 + tnum（TimerSetupTimeBase）
   * tnum（fontFeatureSettings）来自 TextAppearance.TextClock / TimerSetupTimeBase。
   */
  :root {
    --g93-font: 'GoogleSansFlex', 'Google Sans Text', 'Google Sans', 'RobotoFlex', Roboto,
      'Noto Sans SC', system-ui, sans-serif;
    --g93-fab: 80px; --g93-fab-r: 24px; --g93-fab-icon: 28px;
    --g93-card-r: 24px;
    --g93-alarm-time: 36px;
    --g93-main-clock: 56px;
    --g93-analog: 240px;
    --g93-city-name: 24px; --g93-city-clock: 57px;
    --g93-ring-size: 340px; --g93-ring-track: 12px; --g93-ring-r: 6px; --g93-ring-gap: 12px;
    --g93-timer-text: 80px; --g93-timer-setup: 200px;
    --g93-preset: 80px;
    --g93-rail: 80px;
    --g93-nav-h: 88px;
    --g93-axes-time: 'wght' 450, 'ROND' 100, 'wdth' 80, 'opsz' 57;
    --g93-axes-city: 'wght' 500, 'ROND' 100, 'wdth' 100, 'opsz' 57;
    --g93-axes-paused: 'wght' 250, 'ROND' 100, 'wdth' 80, 'opsz' 57;
    --g93-axes-multi: 'wght' 500, 'ROND' 100, 'wdth' 80, 'opsz' 57;
    --g93-axes-setup: 'wght' 500, 'ROND' 100, 'wdth' 70, 'opsz' 144;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--g93-font);
    background: var(--md-surface, #FCF8FA);
    color: var(--md-on-surface, #1C1B1F);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #g93App { display: flex; flex-direction: column; height: 100%; }

  /* ---------- 大时间排版（font-variation-settings 矩阵，style bag 逐字） ---------- */
  .g93-time {
    font-variation-settings: var(--g93-axes-time);
    font-feature-settings: 'tnum' 1;
    letter-spacing: -0.04em;
    line-height: 1.14;
  }
  .g93-time.is-city { font-variation-settings: var(--g93-axes-city); letter-spacing: 0; }
  .g93-time.is-paused { font-variation-settings: var(--g93-axes-paused); }
  .g93-time.is-multi { font-variation-settings: var(--g93-axes-multi); }
  .g93-setup-digits {
    font-variation-settings: var(--g93-axes-setup);
    font-feature-settings: 'tnum' 1;
    letter-spacing: -0.04em;
  }
  .g93-lap { font-feature-settings: 'tnum' 1; }

  /* ---------- 顶栏（Toolbar title marginStart 24dp / AppBar elevation 8） ---------- */
  .g93-topbar {
    flex: 0 0 auto; display: flex; align-items: center;
    height: 56px; padding: 0 0 0 24px;
    font-size: 22px; font-variation-settings: 'wght' 400, 'ROND' 100, 'wdth' 100;
  }

  /* ---------- 页容器 ---------- */
  .g93-pages { flex: 1 1 auto; position: relative; min-height: 0; }
  .g93-page {
    position: absolute; inset: 0; display: none; overflow-y: auto;
    padding: 0 16px 120px;
  }
  .g93-page.is-active { display: block; }

  /* ---------- 底栏（gastown_nav_bar：active indicator 56×32 药丸） ---------- */
  .gastown-nav {
    flex: 0 0 auto; position: relative; display: flex; align-items: stretch;
    height: var(--g93-nav-h); background: var(--md-surface-container, #F3EDF7);
    margin: 0 8px 8px; border-radius: 24px;
  }
  .nav-item {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; background: none; border: 0; cursor: pointer; padding: 0; font-family: inherit;
    color: var(--md-on-surface-variant, #49454F); position: relative;
  }
  .nav-item .nav-icon-wrapper { position: relative; width: 24px; height: 24px; }
  .nav-item .nav-svg { width: 24px; height: 24px; display: block; }
  .nav-item .p-sel { display: none; }
  .nav-item.active .p-sel { display: block; }
  .nav-item.active .p-un { display: none; }
  .nav-item.active { color: var(--md-on-surface, #1C1B1F); }
  .nav-item.active::before {
    content: ''; position: absolute; left: 50%; transform: translateX(-50%);
    width: 56px; height: 32px; border-radius: 16px; top: calc(50% - 30px);
    background: var(--md-secondary-container, #E8DEF8);
  }
  .nav-item .g93-nav-label { font-size: 12px; line-height: 16px; position: relative; }
  /* AVD 播放期：隐藏静态双态，交由 .gastown-avd-overlay 承载（gastown-nav.mjs 接线） */
  .gastown-avd-overlay { position: absolute; inset: 0; display: none; }
  .gastown-avd-overlay svg { width: 100%; height: 100%; display: block; }
  .nav-item.avd-playing .gastown-avd-overlay { display: block; }
  .nav-item.avd-playing .nav-svg { visibility: hidden; }
  .g93-nav-item-active-note { display: none; }

  /* ---------- FAB（GastownFabStyle：80×80/r24/tertiary-container/icon 28） ---------- */
  #g93Fab {
    position: absolute; right: 16px; bottom: calc(var(--g93-nav-h) + 24px);
    width: var(--g93-fab); height: var(--g93-fab); border-radius: var(--g93-fab-r);
    background: var(--md-tertiary-container, #FFD8E4); color: var(--md-on-tertiary-container, #31111D);
    border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: none; z-index: 5;
  }
  #g93Fab svg { width: var(--g93-fab-icon); height: var(--g93-fab-icon); }
  #g93Fab[hidden] { display: none; }

  /* ---------- 闹钟卡（GastownAlarmMaterialCardViewStyle：24dp/elevation 0/padding 20） ---------- */
  .g93-alarm-card {
    background: var(--md-surface-container-low, #F7F2FA); border-radius: var(--g93-card-r);
    padding: 20px; margin: 8px 0;
  }
  .g93-alarm-head {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    min-height: 48px; font-size: 14px; color: var(--md-on-surface-variant, #49454F);
  }
  .g93-alarm-label { opacity: 0.84; } /* label α0.84（布局逐字） */
  .g93-alarm-upcoming::before { content: '·'; margin-right: 8px; }
  .g93-alarm-head .g93-alarm-days:empty, .g93-alarm-head .g93-alarm-label:empty { display: none; }
  .g93-alarm-head .g93-icon-btn { margin-left: auto; }
  .g93-alarm-mainrow { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .g93-alarm-time { font-size: var(--g93-alarm-time); } /* 36sp TextTime */
  .g93-alarm-time.is-paused { color: var(--md-on-surface-variant, #49454F); }

  /* ---------- 主时钟帧（gastown_main_clock_frame：56sp + 日期 + 下次闹钟） ---------- */
  .g93-main-clock-frame { text-align: center; padding: 24px 0 8px; }
  .g93-main-clock { font-size: var(--g93-main-clock); }
  .g93-main-date { margin-top: 4px; font-size: 14px; color: var(--md-on-surface-variant, #49454F); }
  .g93-main-nextalarm { margin-top: 8px; font-size: 14px; color: var(--md-on-surface-variant, #49454F); }

  /* ---------- 城市卡（gastown_world_clock_item：24sp 名 + 16sp 时差 + 57sp 右列） ---------- */
  .g93-city-card {
    background: var(--md-surface-container-low, #F7F2FA); border-radius: var(--g93-card-r);
    padding: 16px 20px 4px; margin: 8px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .g93-city-name { font-size: var(--g93-city-name); font-variation-settings: 'wght' 500, 'ROND' 100, 'wdth' 100; }
  .g93-city-offset { margin-top: 4px; font-size: 16px; color: var(--md-on-surface-variant, #49454F); }
  .g93-city-right { display: flex; align-items: center; gap: 8px; }
  .g93-city-clock { font-size: var(--g93-city-clock); }

  /* ---------- 计时器：设置态（200sp 三列 + 单位 16sp + 键盘 + 预设 5/10/30/45） ---------- */
  #timerSetup { max-width: 480px; margin: 0 auto; }
  #timerDisplay { display: flex; justify-content: center; align-items: flex-end; gap: 8px; margin-top: 8px; }
  .g93-timer-col { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .g93-timer-col .v {
    font-size: clamp(72px, 26vw, var(--g93-timer-setup)); /* AutoSizing 200sp 收敛 */
    line-height: 1;
  }
  .g93-timer-col .u { font-size: 16px; color: var(--md-on-surface-variant, #49454F); margin-top: 8px; }
  #timerKeypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .g93-key {
    height: 64px; border: 0; border-radius: 20px; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 28px; color: var(--md-on-surface, #1C1B1F);
    font-variation-settings: 'wght' 400, 'ROND' 100, 'wdth' 100;
  }
  .g93-key:active { background: var(--md-surface-container-highest, #E6E0E9); }
  #timerPresets { display: flex; gap: 12px; overflow-x: auto; margin-top: 16px; padding-bottom: 4px; }
  .g93-preset {
    flex: 0 0 auto; width: var(--g93-preset); height: var(--g93-preset);
    border-radius: 50%; border: 0; cursor: pointer;
    background: var(--md-surface-container-high, #ECE6F0); color: var(--md-on-surface, #1C1B1F);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: inherit; font-size: 25px;
  }
  .g93-preset .u { font-size: 11px; color: var(--md-outline, #79747E); margin-top: 2px; }
  #timerStart {
    width: 100%; height: 56px; margin-top: 16px; border: 0; border-radius: 28px; cursor: pointer;
    background: var(--md-primary, #6750A4); color: var(--md-on-primary, #FFFFFF);
    font-family: inherit; font-size: 16px; font-variation-settings: 'wght' 500, 'ROND' 100, 'wdth' 100;
  }
  #timerStart:disabled { opacity: 0.38; }

  /* ---------- 计时器：运行卡（环形 340/12/6/12 + 80sp + 圆钮组 512r） ---------- */
  #timerCards { display: flex; flex-direction: column; gap: 8px; }
  .g93-timer-card {
    background: var(--md-surface-container-low, #F7F2FA); border-radius: var(--g93-card-r);
    padding: 20px; display: flex; flex-direction: column; align-items: center;
  }
  .g93-ring-wrap { position: relative; width: var(--g93-ring-size); height: var(--g93-ring-size); max-width: 76vw; }
  .g93-ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .g93-ring circle { fill: none; stroke-width: var(--g93-ring-track); }
  .g93-ring .track { stroke: var(--md-outline-variant, #CAC4D0); }
  .g93-ring .indicator { stroke: var(--md-primary, #6750A4); stroke-linecap: round; transition: stroke-dasharray 300ms linear; }
  .g93-ring .indicator.expired { stroke: var(--md-error, #B3261E); }
  .g93-ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .g93-timer-text { font-size: clamp(48px, 17vw, var(--g93-timer-text)); }
  .g93-timer-label { margin-top: 8px; font-size: 16px; color: var(--md-on-surface-variant, #49454F); }
  .g93-timer-state { font-size: 16px; font-variation-settings: 'wght' 500, 'ROND' 100, 'wdth' 100; }
  .g93-timer-actions { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  .g93-timer-btn, .g93-icon-round {
    width: 48px; height: 48px; border-radius: var(--g93-timer-btn-r, 512px); border: 0; cursor: pointer;
    background: var(--md-surface-container-highest, #E6E0E9);
    color: var(--md-on-surface, #1C1B1F);
    font-family: inherit; font-size: 16px; padding: 0;
    font-variation-settings: 'wght' 500, 'ROND' 100, 'wdth' 100;
  }
  .g93-timer-btn { width: auto; padding: 0 16px; }

  /* ---------- 秒表（时间顶部 + 中心圈速 106dp + 底部钮组：主钮 80 tertiary） ---------- */
  #swPage .g93-sw-time { text-align: center; margin-top: 16px; font-size: clamp(56px, 16vw, 96px); }
  .g93-sw-center {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    min-height: 106px; margin-top: 8px;
  }
  .g93-sw-center .g93-icon-round { background: transparent; font-size: 20px; }
  .g93-sw-center .g93-icon-round:disabled { opacity: 0.38; }
  #lapCurrent { display: flex; align-items: baseline; gap: 12px; font-size: 16px; color: var(--md-on-surface-variant, #49454F); }
  #lapCurrent .g93-lap-time { font-size: 24px; color: var(--md-on-surface, #1C1B1F); }
  .g93-sw-buttons { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 16px; }
  .g93-sw-buttons .g93-icon-round { background: var(--md-surface-container-highest, #E6E0E9); }
  #swMain {
    width: 80px; height: 80px; border-radius: 28px; border: 0; cursor: pointer;
    background: var(--md-tertiary-container, #FFD8E4); color: var(--md-on-tertiary-container, #31111D);
    font-family: inherit; font-size: 16px;
    font-variation-settings: 'wght' 500, 'ROND' 100, 'wdth' 100;
  }
  #lapListWrap { margin: 16px 0 0; }
  #lapList { list-style: none; margin: 0; padding: 0; }
  .g93-lap-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 8px; font-size: 16px; border-bottom: 1px solid var(--md-outline-variant, #CAC4D0);
  }
  .g93-lap-row.best { color: var(--md-tertiary, #7D5260); }
  .g93-lap-row.worst { color: var(--md-error, #B3261E); }

  /* ---------- 就寝页（时间表卡 + 近期活动卡） ---------- */
  .g93-bed-card {
    background: var(--md-surface-container-low, #F7F2FA); border-radius: var(--g93-card-r);
    padding: 20px; margin: 8px 0;
  }
  .g93-bed-title { font-size: 16px; font-variation-settings: 'wght' 500, 'ROND' 100, 'wdth' 100; }
  .g93-bed-row { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; min-height: 48px; }
  .g93-bed-row .when { font-size: 14px; color: var(--md-on-surface-variant, #49454F); }
  .g93-bed-row .val { font-size: 32px; }
  .g93-bed-duration { margin-top: 8px; font-size: 14px; color: var(--md-on-surface-variant, #49454F); }
  .g93-bed-activity { margin-top: 8px; font-size: 14px; color: var(--md-on-surface-variant, #49454F); padding: 12px 0; }

  /* ---------- 空态 / 图标钮 / 弹层 ---------- */
  .g93-empty { text-align: center; color: var(--md-on-surface-variant, #49454F); padding: 32px 0; font-size: 14px; }
  #alarmEmpty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; font-size: 28px; padding: 48px 0; color: var(--md-on-surface-variant, #49454F);
  }
  #alarmEmpty[hidden] { display: none; }
  .g93-icon-btn {
    background: none; border: 0; cursor: pointer; color: var(--md-on-surface-variant, #49454F);
    width: 40px; height: 40px; border-radius: 50%; font-size: 16px;
  }
  .g93-icon-btn:hover { background: var(--md-surface-container-highest, #E6E0E9); }
  #sheetMask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 40;
    display: flex; align-items: flex-end; justify-content: center;
  }
  #sheetMask[hidden] { display: none; }
  #sheetPanel {
    background: var(--md-surface-container, #F3EDF7); border-radius: 28px 28px 0 0;
    width: 100%; max-width: 480px; padding: 20px 24px 24px; max-height: 82%;
    overflow-y: auto; color: var(--md-on-surface, #1C1B1F);
  }
  #sheetTitle { margin: 0 0 12px; font-size: 20px; font-variation-settings: 'wght' 500, 'ROND' 100, 'wdth' 100; }
  .g93-sheet-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 52px; font-size: 15px;
  }
  .g93-sheet-row input, .g93-sheet-row select {
    font-family: inherit; font-size: 15px; color: var(--md-on-surface, #1C1B1F);
    background: var(--md-surface-container-highest, #E6E0E9); border: 0; border-radius: 8px;
    padding: 10px 12px; text-align: right;
  }
  .g93-sheet-blocktitle { margin: 12px 0 4px; font-size: 13px; color: var(--md-on-surface-variant, #49454F); }
  .g93-days { display: flex; gap: 4px; flex-wrap: wrap; }
  .g93-day {
    width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--md-surface-container-highest, #E6E0E9); color: var(--md-on-surface-variant, #49454F);
    font-family: inherit; font-size: 13px;
  }
  .g93-day.on { background: var(--md-primary, #6750A4); color: var(--md-on-primary, #FFFFFF); }
  .g93-sheet-danger {
    margin-top: 16px; width: 100%; height: 48px; border: 0; border-radius: 24px; cursor: pointer;
    background: transparent; color: var(--md-error, #B3261E);
    font-family: inherit; font-size: 15px;
  }
  .g93-sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .g93-sheet-actions button {
    height: 44px; padding: 0 20px; border: 0; border-radius: 22px; cursor: pointer;
    background: transparent; color: var(--md-primary, #6750A4); font-family: inherit; font-size: 15px;
  }
  .g93-sheet-actions button.primary {
    background: var(--md-primary, #6750A4); color: var(--md-on-primary, #FFFFFF);
    font-variation-settings: 'wght' 500, 'ROND' 100, 'wdth' 100;
  }

  /* ---------- 开关：引擎单一真源（css/md3-theme.css + js/m3-controls.js） ----------
   * v11.53 修复「开关小球乱飞」根因一：本应用曾自写 .md3-switch 局部几何
   * （top:8px/left:8px/16px 球 + checked left:28px）与引擎坐标系
   * （left:-2px/top:50% + JS 弹簧 transform translate）叠加，同一只球被两套
   * 坐标系各写一半 → 位置互搏乱飞。局部几何删除，全局引擎单一真源接管；
   * 星斑状态层（m3-state-layer）同由全局 CSS 提供。 */

  /* ---------- 顶栏溢出菜单（Toolbar overflow：menu_item_* zh 逐字） ----------
   * 9.3 主壳 AppBarLayout>Toolbar 带 overflow 菜单（menu_item_help 设置等
   * zh-strings.tsv 逐字），v11.53 半成品缺失 = “设置图标飞到哪里去了”实锚。 */
  #g93MenuBtn { margin-left: auto; margin-right: 8px; font-size: 18px; letter-spacing: 2px; }
  #g93Menu {
    position: absolute; right: 8px; top: 56px; min-width: 180px;
    background: var(--md-surface-container, #F3EDF7); border-radius: 12px;
    padding: 8px 0; z-index: 30;
    box-shadow: 0 6px 24px rgba(0,0,0,0.28);
  }
  #g93Menu[hidden] { display: none; }
  #g93Menu button {
    display: block; width: 100%; text-align: left; padding: 0 20px; height: 44px;
    line-height: 44px; background: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 15px; color: var(--md-on-surface, #1C1B1F);
  }
  #g93Menu button:hover { background: var(--md-surface-container-highest, #E6E0E9); }

  /* ---------- 四档响应式真布局变体（gastown 布局 config 证据） ---------- */
  @media (min-height: 600px) { .g93-page { padding-bottom: 140px; } }
  @media (min-height: 800px) {
    .g93-main-clock-frame { padding-top: 40px; }
    .g93-timer-text { font-size: clamp(64px, 20vw, var(--g93-timer-text)); }
  }
