<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2300875A'/%3E%3Ccircle cx='50' cy='50' r='30' fill='white'/%3E%3C/svg%3E" />
    <!-- PWA：可安装到手机桌面 + 离线缓存 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#00875A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="安卓16极客" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>安卓16极客</title>
    <meta name="description" content="网页版安卓16极客桌面模拟器：31 个应用、锁屏、动态壁纸、弹簧并行动画，免安装，打开即玩。" />
    <!-- 分享到聊天软件时显示的卡片信息（网址与缩略图，换域名时同步修改） -->
    <meta property="og:title" content="安卓16极客" />
    <meta property="og:description" content="网页版安卓16极客桌面：31 个应用、锁屏、动态壁纸、弹簧并行动画，免安装，打开即玩。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ariefenv-hash.github.io/md3/" />
    <meta property="og:image" content="https://ariefenv-hash.github.io/md3/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://ariefenv-hash.github.io/md3/icons/icon-512.png" />
    <style>
      /* ==================== 根壳布局（原 React 壳的 tailwind 工具类等价实现） ==================== */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      .shell {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
        user-select: none;
        position: relative;
      }
      .shell iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      /* ==================== 启动画面（iframe 就绪前的加载态） ==================== */
      .splash {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      .splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-icon {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: linear-gradient(160deg, #00a06c, #00684a);
        box-shadow: 0 10px 34px rgba(0, 160, 108, 0.35);
        position: relative;
      }
      .splash-icon::after {
        content: '';
        position: absolute;
        inset: 0;
        margin: auto;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #fff;
      }
      .splash-name {
        color: rgba(255, 255, 255, 0.92);
        font-size: 15px;
        letter-spacing: 0.08em;
        font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      }
      /* ==================== Uiverse 缝合：LAUNCHING 火箭开机加载（源：uiverse.io/dexter-st/popular-puma-86，MIT）
         改造：类名加 uiv-launch- 前缀隔离；红色霓虹 → 品牌绿系（与 .splash-icon 同源）；
         字号/间距收窄适配移动端；reduced-motion 降速 ==================== */
      .uiv-launch-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 104px;
        height: 104px;
        font-family: -apple-system, 'Inter', 'PingFang SC', sans-serif;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        border-radius: 50%;
        background-color: rgba(0, 166, 120, 0.07);
        box-shadow: 0 0 60px -10px rgba(120, 255, 200, 0.35);
        user-select: none;
      }
      .uiv-launch-trail {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background-color: transparent;
        animation: uiv-launch-rotate 2s linear infinite;
        z-index: 0;
      }
      @keyframes uiv-launch-rotate {
        0% {
          transform: rotate(90deg);
          box-shadow:
            0 10px 20px 0 rgba(210, 255, 235, 0.9) inset,
            0 20px 30px 0 rgba(210, 255, 235, 0.35) inset,
            0 60px 60px 0 rgba(0, 166, 120, 0.08) inset;
        }
        50% {
          transform: rotate(270deg);
          box-shadow:
            0 10px 20px 0 rgba(210, 255, 235, 0.9) inset,
            0 20px 10px 0 rgba(90, 220, 170, 0.6) inset,
            0 40px 60px 0 rgba(0, 166, 120, 0.15) inset;
        }
        100% {
          transform: rotate(450deg);
          box-shadow:
            0 10px 20px 0 rgba(210, 255, 235, 0.9) inset,
            0 20px 30px 0 rgba(210, 255, 235, 0.35) inset,
            0 60px 60px 0 rgba(0, 166, 120, 0.08) inset;
        }
      }
      .uiv-launch-letter {
        display: inline-block;
        opacity: 0.4;
        transform: translateY(0);
        animation: uiv-launch-letter-anim 2s infinite;
        z-index: 1;
        border-radius: 50ch;
        border: none;
        filter: blur(2px);
        margin: 0.14em;
      }
      .uiv-launch-letter:nth-child(1) { animation-delay: 0s; }
      .uiv-launch-letter:nth-child(2) { animation-delay: 0.1s; }
      .uiv-launch-letter:nth-child(3) { animation-delay: 0.2s; }
      .uiv-launch-letter:nth-child(4) { animation-delay: 0.3s; }
      .uiv-launch-letter:nth-child(5) { animation-delay: 0.4s; }
      .uiv-launch-letter:nth-child(6) { animation-delay: 0.5s; }
      .uiv-launch-letter:nth-child(7) { animation-delay: 0.6s; }
      .uiv-launch-letter:nth-child(8) { animation-delay: 0.7s; }
      .uiv-launch-letter:nth-child(9) { animation-delay: 0.8s; }
      @keyframes uiv-launch-letter-anim {
        0%, 100% {
          opacity: 0;
          transform: translateY(0);
          filter: blur(2px);
        }
        20% {
          opacity: 1;
          transform: scale(1.2) translateY(-1px);
          filter: blur(0px);
          text-shadow:
            0px 0px 2px #eafff5,
            0px 0px 8px rgba(0, 200, 140, 0.8);
        }
        40% {
          opacity: 0.7;
          transform: translateY(0);
          filter: blur(2px);
        }
      }
      .uiv-launch-star {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #fff;
        transform: translate(20px, 92px);
        animation: uiv-launch-star-anim 2s infinite;
        box-shadow: 0 0 8px 0 #fff;
        filter: blur(4px);
        opacity: 0.2;
      }
      .uiv-launch-star:nth-of-type(2) { transform: translate(58px, 48px); scale: 1.05; animation-delay: 0.2s; }
      .uiv-launch-star:nth-of-type(3) { transform: translate(-28px, 58px); scale: 1.4; animation-delay: 0.4s; }
      .uiv-launch-star:nth-of-type(4) { transform: translate(-52px, -72px); scale: 0.95; animation-delay: 0.7s; }
      .uiv-launch-star:nth-of-type(5) { transform: translate(34px, -68px); scale: 1.3; animation-delay: 0.35s; }
      .uiv-launch-star:nth-of-type(6) { transform: translate(84px, -38px); scale: 1; animation-delay: 0.9s; }
      .uiv-launch-star:nth-of-type(7) { transform: translate(-94px, 28px); scale: 1; animation-delay: 0.95s; }
      @keyframes uiv-launch-star-anim {
        0%, 100% { opacity: 0.2; filter: blur(4px); }
        50% { opacity: 0.32; filter: blur(1px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash { transition: opacity 0.01s linear, visibility 0.01s linear; }
        .uiv-launch-trail, .uiv-launch-letter, .uiv-launch-star { animation-duration: 4s; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <iframe
        id="sim-iframe"
        allow="autoplay; fullscreen; microphone; geolocation; camera; display-capture"
        title="安卓16极客模拟器"
      ></iframe>
      <!-- 启动画面：iframe 内容就绪前给一个干净的黑底加载态，就绪后淡出 -->
      <div class="splash" id="splash" aria-hidden="true">
        <div class="splash-icon"></div>
        <div class="splash-name">安卓16极客</div>
        <!-- Uiverse 缝合：LAUNCHING 火箭逐字母启动动画（uiverse.io/dexter-st/popular-puma-86，MIT） -->
        <div class="uiv-launch-wrap">
          <span class="uiv-launch-letter">L</span>
          <span class="uiv-launch-letter">A</span>
          <span class="uiv-launch-letter">U</span>
          <span class="uiv-launch-letter">N</span>
          <span class="uiv-launch-letter">C</span>
          <span class="uiv-launch-letter">H</span>
          <span class="uiv-launch-letter">I</span>
          <span class="uiv-launch-letter">N</span>
          <span class="uiv-launch-letter">G</span>
          <div class="uiv-launch-trail"></div>
          <div class="uiv-launch-star"></div>
          <div class="uiv-launch-star"></div>
          <div class="uiv-launch-star"></div>
          <div class="uiv-launch-star"></div>
          <div class="uiv-launch-star"></div>
          <div class="uiv-launch-star"></div>
          <div class="uiv-launch-star"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        // 将根页面 URL 参数透传给模拟器 iframe（如 ?nolock=1 跳过锁屏、?swtest=1 强制注册 SW）
        // 相对路径：域名根路径与 GitHub Pages 项目子路径（/<repo>/）部署下均成立
        var frame = document.getElementById('sim-iframe');
        frame.src = 'ios-desktop/index.html' + window.location.search;

        var splash = document.getElementById('splash');
        function hideSplash() { splash.classList.add('splash-hide'); }
        // iframe 就绪淡出；兜底：若 onLoad 因缓存等边缘情况未触发，最多 3 秒后也隐藏，绝不卡住
        frame.addEventListener('load', hideSplash);
        window.setTimeout(hideSplash, 3000);

        // PWA Service Worker 注册
        // 自动化测试环境（navigator.webdriver）默认跳过，避免缓存干扰回归；?swtest=1 可强制注册供测试
        if ('serviceWorker' in navigator) {
          var allowSW = !navigator.webdriver || window.location.search.indexOf('swtest') !== -1;
          if (allowSW) {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('./sw.js').catch(function () {
                // 注册失败（如非 HTTPS 环境）不影响应用正常运行
              });

              // v7.6：新版本就绪提示 —— 常驻胶囊（根壳层，跨 iframe 零耦合）。
              // SW 进入 waiting（已有 controller 且新 SW installed）时浮现；
              // 点击 → 通知 waiting SW skipWaiting → controllerchange 后整页刷新。
              var updatePill = null;
              function showUpdatePill() {
                if (updatePill) return;
                updatePill = document.createElement('div');
                updatePill.setAttribute('role', 'button');
                updatePill.textContent = '系统已更新 · 轻点重启';
                updatePill.style.cssText =
                  'position:fixed;top:calc(env(safe-area-inset-top, 0px) + 10px);left:50%;transform:translateX(-50%);' +
                  'z-index:2147483000;display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;' +
                  'background:rgba(20,22,26,.92);color:#fff;font:600 13px/1.4 -apple-system,Roboto,sans-serif;' +
                  'box-shadow:0 6px 22px rgba(0,0,0,.35);cursor:pointer;user-select:none;' +
                  'opacity:0;transition:opacity .3s ease;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);';
                updatePill.addEventListener('click', function () {
                  try {
                    navigator.serviceWorker.getRegistration().then(function (reg) {
                      if (reg && reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
                    });
                  } catch (e) {}
                });
                document.body.appendChild(updatePill);
                requestAnimationFrame(function () { updatePill.style.opacity = '1'; });
              }
              navigator.serviceWorker.addEventListener('message', function (e) {
                if (e.data && e.data.type === 'SW_UPDATE_READY') showUpdatePill();
              });
              navigator.serviceWorker.ready.then(function (reg) {
                function onInstalling(sw) {
                  if (!sw) return;
                  sw.addEventListener('statechange', function () {
                    // 已有旧 SW 在控制页面时，新 SW 安装完成 = 有更新待应用
                    if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdatePill();
                  });
                  if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdatePill();
                }
                if (reg.installing) onInstalling(reg.installing);
                reg.addEventListener('updatefound', function () { onInstalling(reg.installing); });
              }).catch(function () {});
              navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (updatePill) location.reload();
              });
            });
          }
        }
      })();
    </script>
  </body>
</html>
