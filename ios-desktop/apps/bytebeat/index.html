<!DOCTYPE html>
<html lang="zh-CN" data-theme-mode="dark">
<head><script src="../freeze-shim.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ByteBeat · 公式即音乐</title>
    <link rel="stylesheet" href="../_shared/md3-tokens.css">
    <link rel="stylesheet" href="../_shared/idle-slider.css">
    <script src="../_shared/audio-core.js"></script>
    <script src="../../js/bytebeat-core.js"></script>
<style>
        /* ==================== v8.42 #30 ByteBeat ====================
           公式即音乐：白名单沙箱编译 + 离屏 AudioBuffer + 双可视化。
           极客终端气质（等宽字体）× md3 令牌驱动；按压动效接磁贴
           果冻手感（tile-bounce 先例 cubic-bezier 回弹）。 */
        :root {
            --bb-stage: var(--md-surface);
            --bb-text: var(--md-on-surface);
            --bb-dim: var(--md-on-surface-variant);
            --bb-chip: var(--md-secondary-container);
            --bb-chip-text: var(--md-on-secondary-container);
            --bb-accent: var(--md-primary);
            --bb-err: var(--md-error, #f2b8b5);
            --bb-line: var(--md-outline-variant, rgba(255,255,255,.12));
            --bb-mono: var(--md-font-num, ui-monospace, Menlo, Consolas, 'Roboto Mono', monospace);
            /* v9.52 #181 五批：下沉面板/滑条轨道令牌化（裸黑 rgba 四处清零，
               scrim 语义派生 —— 语义即「按 scrim 强度压暗」，主题自适应） */
            --bb-well: color-mix(in srgb, var(--md-scrim, #000) 24%, transparent);
            --bb-track: color-mix(in srgb, var(--md-on-surface) 9%, transparent);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body { margin: 0; overflow: hidden; background: var(--bb-stage); color: var(--bb-text);
               font-family: var(--md-font, var(--md-text-font, system-ui, sans-serif)); }
        .bb-app { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 12px 14px; gap: 9px; }
        /* ---------- 顶栏 ---------- */
        .bb-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
        .bb-title { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .4px; }
        .bb-sub { margin: 0; font-size: 11px; color: var(--bb-dim); }
        .bb-badge { font-family: var(--bb-mono); font-size: 10px; color: var(--bb-accent);
                    border: 1px solid var(--bb-line); border-radius: var(--md-r-full, 999px); padding: 3px 9px; white-space: nowrap; }
        /* ---------- 公式输入 ---------- */
        .bb-formula { flex: 0 0 auto; width: 100%; min-height: 64px; max-height: 108px; resize: none;
                      background: var(--bb-well); color: var(--bb-text); border: 1px solid var(--bb-line);
                      border-radius: var(--md-r-lg, 12px); padding: 9px 11px; font-family: var(--bb-mono);
                      font-size: 12.5px; line-height: 1.55; outline: none; }
        .bb-formula:focus { border-color: var(--bb-accent); }
        .bb-err { font-size: 11.5px; color: var(--bb-err); font-family: var(--bb-mono);
                  padding: 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* ---------- 控制排 ---------- */
        .bb-controls { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
        .bb-play { border: none; border-radius: var(--md-r-full, 999px); padding: 9px 18px; font-size: 13px; font-weight: 700;
                   color: var(--md-on-primary, #062e6f); background: var(--bb-play-bg, var(--bb-accent)); cursor: pointer;
                   font-family: var(--md-font, inherit); transition: transform 130ms var(--md-easing-spring-legacy, cubic-bezier(.34,1.56,.64,1)), background var(--md-duration-short, 160ms); }
        /* primary 实心按钮：state 层用 color-mix 混入主色（radio .rd-play 同律，防整块换色漂移） */
        .bb-play:hover:not(:disabled) { background: color-mix(in srgb, var(--bb-play-bg, var(--bb-accent)) 88%, var(--md-state-hover, transparent)); }
        .bb-play:active { transform: scale(.92); background: color-mix(in srgb, var(--bb-play-bg, var(--bb-accent)) 84%, var(--md-state-pressed, transparent)); }
        .bb-play.stop { --bb-play-bg: var(--md-tertiary, #efb8c8); }
        .bb-chip { border: 1px solid var(--bb-line); background: transparent; color: var(--bb-dim);
                   font-size: 11px; padding: 6px 11px; border-radius: var(--md-r-full, 999px); cursor: pointer; font-family: var(--md-font, inherit);
                   transition: transform 130ms var(--md-easing-spring-legacy, cubic-bezier(.34,1.56,.64,1)); }
        .bb-chip:hover { background: var(--md-state-hover, transparent); }
        .bb-chip:active { transform: scale(.9); background: var(--md-state-pressed, transparent); }
        .bb-chip.on { background: var(--bb-chip); color: var(--bb-chip-text); border-color: transparent; font-weight: 700; }
        .bb-select { background: var(--bb-well); color: var(--bb-text); border: 1px solid var(--bb-line);
                     border-radius: var(--md-r-full, 999px); font-size: 11px; padding: 6px 9px; font-family: var(--bb-mono); outline: none; }
        .bb-vol { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--bb-dim); }
        /* v9.52 #181 五批：音量滑条升格 .mdslider 怠速柄（细竖条怠速 / hover 胶囊展开，ocr/calculator 同款） */
/* v11.05 #227 滑块单源化：几何/轨道/拇指/focus/disabled 视觉规范已收编
           _shared/idle-slider.css（单一组件源，audit D 门禁禁止本地滑块伪元素）；
           此处仅保留布局与应用主题令牌映射 */
        .mdslider { width: 96px; --md-primary: var(--bb-accent); --md-surface-container-highest: var(--bb-track); }
        /* ---------- 双可视化 ---------- */
        .bb-canvas-row { flex: 1 1 auto; min-height: 0; display: flex; gap: 9px; }
        .bb-panel { animation: bb-panel-in var(--md-duration-fast-spatial,350ms) var(--md-easing-emphasized-decelerate, cubic-bezier(0.05,0.7,0.1,1)) both; position: relative; flex: 1; min-width: 0; border: 1px solid var(--bb-line);
                    border-radius: var(--md-r-lg, 12px); background: var(--bb-well); overflow: hidden; }
        .bb-panel-label { position: absolute; top: 5px; left: 9px; font-size: 9.5px; color: var(--bb-dim);
                          letter-spacing: 1px; z-index: 1; }
        .bb-panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        /* ---------- 公式库 ---------- */
        .bb-lib { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px; }
        .bb-lib-head { display: flex; justify-content: space-between; font-size: 10px; color: var(--bb-dim); letter-spacing: 1px; }
        .bb-chips { display: flex; gap: 6px; flex-wrap: wrap; max-height: 58px; overflow-y: auto; }
        .bb-favchip { display: inline-flex; align-items: center; gap: 5px; }
        .bb-favx { border: none; background: transparent; color: var(--bb-dim); font-size: 12px;
                   cursor: pointer; padding: 0 1px; line-height: 1; font-family: inherit; }
        /* ---------- 底栏 ---------- */
        .bb-foot { display: flex; justify-content: space-between; gap: 8px; font-family: var(--bb-mono);
                   font-size: 10px; color: var(--bb-dim); }
        .bb-share { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--bb-accent); }
        /* ---------- toast ---------- */
        .bb-toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(8px);
                    background: var(--md-inverse-surface, #e6e1e5); color: var(--md-inverse-on-surface, #313033);
                    font-size: 12px; border-radius: var(--md-r-full, 999px); padding: 8px 16px; opacity: 0; pointer-events: none;
                    transition: opacity 160ms var(--md-easing-emphasized-accelerate, cubic-bezier(0.3,0,0.8,0.15)), transform 160ms var(--md-easing-spring-legacy, cubic-bezier(.34,1.56,.64,1)); }
        .bb-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ==================== v9.52 #181 五批：响应式与平板分栏 ====================
           手机态（默认 + ≤400px 紧凑）布局零变化；平板 ≥760px 双栏：
           左列主操作（顶栏/公式/错误/控制排/双可视化/底栏），右列【经典库+收藏】常驻面板
           跨全部行（R63 contacts 右详情面板同形态，grid-row: 1 / -1）。 */
        @media (max-width: 400px) {
            .bb-app { padding: 10px 11px; gap: 8px; }
            .bb-canvas-row { flex-direction: column; } /* 窄屏双图纵向堆叠，波形/频谱各半高 */
            .bb-title { font-size: 17px; }
        }
        @media (min-width: 760px) {
            .bb-app { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto auto auto auto 1fr auto;
                      gap: 10px 14px; }
            .bb-head { grid-column: 1; grid-row: 1; }
            .bb-formula { grid-column: 1; grid-row: 2; }
            .bb-err { grid-column: 1; grid-row: 3; align-self: start; }
            .bb-controls { grid-column: 1; grid-row: 4; }
            .bb-canvas-row { grid-column: 1; grid-row: 5; }
            .bb-foot { grid-column: 1; grid-row: 6; }
            .bb-lib { grid-column: 2; grid-row: 1 / -1; max-height: 100%; overflow-y: auto;
                      padding: 2px 4px 2px 0; }
            .bb-chips { max-height: none; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        }
/* v11.05 #245 批 2 基础档：面板入场（曲线取自运动令牌） */
@keyframes bb-panel-in { from { opacity: 0; transform: translateY(6px); } }
.bb-panel + .bb-panel { animation-delay: 60ms; }
</style>
</head>
<body>
<div class="bb-app" id="bbApp">
    <header class="bb-head">
        <div>
            <h1 class="bb-title">ByteBeat</h1>
            <p class="bb-sub">公式即音乐 · 沙箱白名单编译（仅 t 与 Math）</p>
        </div>
        <span class="bb-badge">离屏渲染 · 8k~48k</span>
    </header>

    <textarea id="bbFormula" class="bb-formula" spellcheck="false" autocomplete="off"
              placeholder="输入关于 t 的表达式，例如 ((t &gt;&gt; 10) &amp; 42) * t"></textarea>
    <div id="bbErr" class="bb-err" hidden></div>

    <div class="bb-controls">
        <button id="bbPlay" class="bb-play">▶ 播放</button>
        <button class="bb-chip on" id="bbModeByte" data-mode="byte">byte</button>
        <button class="bb-chip" id="bbModeFloat" data-mode="float">float</button>
        <select id="bbSR" class="bb-select" aria-label="采样率">
            <option value="8000">8 kHz</option>
            <option value="11025">11 kHz</option>
            <option value="22050" selected>22 kHz</option>
            <option value="32000">32 kHz</option>
            <option value="48000">48 kHz</option>
        </select>
        <label class="bb-vol">音量 <input id="bbVol" class="mdslider" type="range" min="0" max="100" value="80" style="--p:80%"></label>
        <button id="bbFav" class="bb-chip">☆ 收藏</button>
        <button id="bbCopy" class="bb-chip">⧉ 复制链接</button>
        <button id="bbSaveVfs" class="bb-chip">⤓ 存曲库</button>
    </div>

    <div class="bb-canvas-row">
        <div class="bb-panel"><span class="bb-panel-label">WAVEFORM 波形</span><canvas id="bbWave"></canvas></div>
        <div class="bb-panel"><span class="bb-panel-label">SPECTRUM 频谱</span><canvas id="bbSpec"></canvas></div>
    </div>

    <div class="bb-lib">
        <div class="bb-lib-head"><span>经典公式 · 点击加载</span><span id="bbCount"></span></div>
        <div class="bb-chips" id="bbLib"></div>
        <div class="bb-lib-head"><span>我的收藏</span></div>
        <div class="bb-chips" id="bbFavs"></div>
    </div>

    <footer class="bb-foot">
        <span id="bbShare" class="bb-share">分享码待生成</span>
        <span id="bbStatus" class="bb-status">就绪</span>
    </footer>
    <div id="bbToast" class="bb-toast"></div>
</div>
<script>
(function () {
    'use strict';
    var core = window.__bytebeatCore;
    var errEl = document.getElementById('bbErr');
    if (!core) {
        errEl.hidden = false; // 缺载守卫：绝不白屏
        errEl.textContent = '核心模块缺载（bytebeat-core）——请刷新重试';
        return;
    }

    // ---------- 元素 ----------
    var ta = document.getElementById('bbFormula');
    var playBtn = document.getElementById('bbPlay');
    var modeByte = document.getElementById('bbModeByte');
    var modeFloat = document.getElementById('bbModeFloat');
    var srSel = document.getElementById('bbSR');
    var volInput = document.getElementById('bbVol');
    var favBtn = document.getElementById('bbFav');
    var copyBtn = document.getElementById('bbCopy');
    var saveVfsBtn = document.getElementById('bbSaveVfs'); // v9.15 #176 一期：公式存曲库
    var waveCv = document.getElementById('bbWave');
    var specCv = document.getElementById('bbSpec');
    var libEl = document.getElementById('bbLib');
    var favsEl = document.getElementById('bbFavs');
    var countEl = document.getElementById('bbCount');
    var shareEl = document.getElementById('bbShare');
    var statusEl = document.getElementById('bbStatus');
    var toastEl = document.getElementById('bbToast');

    // ---------- 状态与存储（损坏 JSON 静默降级） ----------
    var LS_STATE = 'bytebeat_state_v1';
    var LS_FAVS = 'bytebeat_favs_v1';
    var state = { mode: 'byte', sr: 22050, vol: 80 };
    var favs = [];

    function readJSON(key, fallback) {
        try {
            var raw = localStorage.getItem(key);
            if (!raw) return fallback;
            var v = JSON.parse(raw);
            return v == null ? fallback : v;
        } catch (err) { return fallback; }
    }
    function writeJSON(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch (err) { /* 静默降级 */ }
    }

    // ---------- 音频引擎（AudioContext 懒单例 + 分块无缝排程） ----------
    var audio = { ctx: null, gain: null, core: null, playing: false, tOffset: 0, nextTime: 0, timer: null, sources: [] };
    var curFn = null;

    function ensureCtx() {
        if (!audio.ctx) {
            // #176 二期：懒创建/解锁/音量路由统一 _shared/audio-core.js（Md3Audio）；
            // masterGain 承接原自建 gain 节点，首播时序（含 state.vol 初值）与原实现一致。
            audio.core = Md3Audio.create({ masterGain: true, initialVolume: state.vol / 100 });
            audio.ctx = audio.core.get();
            if (!audio.ctx) return null;
            audio.gain = audio.core.master;
        }
        return audio.core.unlock();
    }

    function stopSources() {
        for (var i = 0; i < audio.sources.length; i++) {
            try { audio.sources[i].stop(); } catch (err) { /* 已结束 */ }
            try { audio.sources[i].disconnect(); } catch (err) { /* 已断开 */ }
        }
        audio.sources = [];
    }

    function schedule() {
        if (!audio.playing || !curFn) return;
        var sr = state.sr;
        while (audio.nextTime < audio.ctx.currentTime + 3.2) {
            // 离屏生成 Float32（主线程纯计算），播放线程只读 AudioBuffer —— #30 零卡顿锚
            var data = core.renderChunk(curFn, audio.tOffset, sr, core.CHUNK_SECONDS, state.mode);
            var buf = audio.ctx.createBuffer(1, data.length, sr);
            buf.getChannelData(0).set(data);
            var src = audio.ctx.createBufferSource();
            src.buffer = buf;
            src.connect(audio.gain);
            src.start(audio.nextTime);
            audio.sources.push(src);
            drawWave(data);
            drawSpectrum(data);
            audio.tOffset += data.length;
            audio.nextTime += data.length / sr;
        }
        status('t=' + audio.tOffset + ' · ' + sr + ' Hz · ' + state.mode + ' · 播放中');
    }

    function play() {
        if (!compileCurrent()) return;
        ensureCtx();
        stopSources();
        if (audio.timer) clearInterval(audio.timer);
        audio.playing = true;
        audio.tOffset = 0;
        audio.nextTime = audio.ctx.currentTime + 0.08;
        schedule();
        audio.timer = setInterval(schedule, 400);
        playBtn.textContent = '■ 停止';
        playBtn.classList.add('stop');
    }

    function stop() {
        audio.playing = false;
        if (audio.timer) { clearInterval(audio.timer); audio.timer = null; }
        stopSources();
        playBtn.textContent = '▶ 播放';
        playBtn.classList.remove('stop');
        status('已停止 · t=' + audio.tOffset);
    }

    // ---------- 编译与错误显示 ----------
    function compileCurrent() {
        var r = core.compileFormula(ta.value);
        if (!r.ok) {
            errEl.hidden = false;
            errEl.textContent = r.error;
            return null;
        }
        errEl.hidden = true;
        errEl.textContent = '';
        curFn = r.fn;
        return r.fn;
    }

    // ---------- 双可视化（离屏数据驱动，canvas 只画数组） ----------
    var waveCtx = waveCv.getContext('2d');
    var specCtx = specCv.getContext('2d');
    var ACCENT = getComputedStyle(document.documentElement).getPropertyValue('--bb-accent').trim() || '#7cc4ff';

    function sizeCanvases() {
        waveCv.width = waveCv.offsetWidth || 300;
        waveCv.height = waveCv.offsetHeight || 120;
        specCv.width = specCv.offsetWidth || 300;
        specCv.height = specCv.offsetHeight || 120;
    }

    function drawWave(data) {
        var W = waveCv.width, H = waveCv.height;
        waveCtx.clearRect(0, 0, W, H);
        waveCtx.strokeStyle = ACCENT;
        waveCtx.lineWidth = 1;
        var mid = H / 2;
        waveCtx.globalAlpha = 0.25;
        waveCtx.beginPath();
        waveCtx.moveTo(0, mid);
        waveCtx.lineTo(W, mid);
        waveCtx.stroke();
        waveCtx.globalAlpha = 1;
        waveCtx.beginPath();
        var step = Math.max(1, Math.floor(data.length / W));
        for (var x = 0; x < W; x++) {
            var lo = 1, hi = -1;
            var base = x * step;
            if (base >= data.length) break;
            for (var i = base; i < Math.min(base + step, data.length); i++) {
                var v = data[i];
                if (v < lo) lo = v;
                if (v > hi) hi = v;
            }
            if (lo > hi) { lo = 0; hi = 0; }
            waveCtx.moveTo(x + 0.5, mid - hi * (mid - 4));
            waveCtx.lineTo(x + 0.5, mid - lo * (mid - 4) + 0.8);
        }
        waveCtx.stroke();
    }

    function drawSpectrum(data) {
        var W = specCv.width, H = specCv.height;
        specCtx.clearRect(0, 0, W, H);
        var n = Math.min(core.FFT_SIZE, data.length);
        var win = core.hannWindow(data.slice(0, n));
        var mags = core.fftMagnitudes(win);
        if (!mags) return;
        var bins = Math.min(mags.length, 512);
        var bw = W / bins;
        specCtx.fillStyle = ACCENT;
        specCtx.globalAlpha = 0.85;
        var peak = 1e-6;
        for (var i = 0; i < bins; i++) if (mags[i] > peak) peak = mags[i];
        for (i = 0; i < bins; i++) {
            var hval = Math.pow(mags[i] / peak, 0.5) * (H - 6); // sqrt 压缩动态
            specCtx.fillRect(i * bw, H - hval, Math.max(1, bw - 1), hval);
        }
        specCtx.globalAlpha = 1;
    }

    // ---------- 状态栏 / toast ----------
    function status(msg) { statusEl.textContent = msg; }
    var toastTimer = null;
    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
    }

    // ---------- v9.52 #181 五批：SDK 通知与剪贴板（__system 优先，独立运行降级零炸） ----------
    var sysAvail = function () { return !!(window.__system && window.__system.notify); };
    function sysNotify(title, body) {
        if (!sysAvail()) return;
        try { window.__system.notify({ title: title, body: body }); } catch (err) { /* 静默 */ }
    }

    // ---------- v9.15 #176 一期：VFS 数据沉淀（fire-and-forget，不阻塞播放链路） ----------
    // #176 实证：bytebeat 原仅 localStorage（bytebeat_favs_v1），创作产物会话即弃。
    // 议题点名「bytebeat 存公式 .txt 即可」——公式是纯文本，成本极低。
    var fsAvail = function () { return !!(window.__system && window.__system.fs); };
    function fsPut(path, text) {
        if (!fsAvail()) return;
        try { window.__system.fs.write(path, text).catch(function () {}); } catch (err) { /* 静默 */ }
    }
    function syncFavsVfs() {
        // 收藏镜像（#178 自查第 1 条：用户数据优先 VFS，localStorage 仅会话快照）
        fsPut('/music/bytebeat/favorites.json',
            JSON.stringify({ format: 'bytebeat-favs', version: 1, favs: favs }, null, 1));
    }

    // ---------- 分享码（URL hash 自动同步） ----------
    var shareTimer = null;
    function updateShare() {
        if (shareTimer) clearTimeout(shareTimer);
        shareTimer = setTimeout(function () {
            var code = core.encodeShare({ formula: ta.value, mode: state.mode, sr: state.sr });
            if (!code) return;
            shareEl.textContent = '#' + code;
            try { history.replaceState(null, '', '#' + code); } catch (err) { /* 沙箱环境静默 */ }
        }, 350);
    }

    // ---------- 收藏 ----------
    function renderFavs() {
        favsEl.textContent = '';
        if (!favs.length) {
            var empty = document.createElement('span');
            empty.style.fontSize = '11px';
            empty.style.color = 'var(--bb-dim)';
            empty.textContent = '暂无收藏 —— 点击「☆ 收藏」保存当前公式';
            favsEl.appendChild(empty);
            return;
        }
        favs.forEach(function (f, idx) {
            var chip = document.createElement('span');
            chip.className = 'bb-chip bb-favchip';
            var label = document.createElement('b');
            label.textContent = f.name;
            label.style.marginRight = '4px';
            chip.appendChild(label);
            var srcSpan = document.createElement('span');
            srcSpan.textContent = f.formula.length > 22 ? f.formula.slice(0, 22) + '…' : f.formula;
            chip.appendChild(srcSpan);
            chip.addEventListener('click', function () {
                ta.value = f.formula;
                setMode(f.mode);
                if (core.SR_RATES.indexOf(+f.sr) >= 0) { state.sr = +f.sr; srSel.value = String(f.sr); }
                compileCurrent();
                preview();
                updateShare();
                saveStateDebounced();
            });
            var x = document.createElement('button');
            x.className = 'bb-favx';
            x.textContent = '×';
            x.setAttribute('aria-label', '删除收藏 ' + f.name);
            x.addEventListener('click', function (ev) {
                ev.stopPropagation();
                favs.splice(idx, 1);
                writeJSON(LS_FAVS, favs);
                syncFavsVfs(); // v9.15 #176：删除同步镜像
                renderFavs();
                toast('已删除收藏');
            });
            chip.appendChild(x);
            favsEl.appendChild(chip);
        });
    }

    // ---------- 经典公式库（DOM API 构建，零 innerHTML） ----------
    core.FORMULAS.forEach(function (f) {
        var chip = document.createElement('button');
        chip.className = 'bb-chip';
        chip.setAttribute('data-formula-name', f.name);
        chip.textContent = f.name;
        chip.addEventListener('click', function () {
            ta.value = f.src;
            compileCurrent();
            preview();
            updateShare();
            saveStateDebounced();
        });
        libEl.appendChild(chip);
    });
    countEl.textContent = core.FORMULAS.length + ' 条';

    // ---------- 预览（未播放时输入即出图） ----------
    var previewTimer = null;
    function preview() {
        if (audio.playing) return;
        if (previewTimer) clearTimeout(previewTimer);
        previewTimer = setTimeout(function () {
            if (!compileCurrent()) return;
            var data = core.renderChunk(curFn, 0, state.sr, 0.3, state.mode);
            drawWave(data);
            drawSpectrum(data);
            status('预览 · ' + state.sr + ' Hz · ' + state.mode);
        }, 220);
    }

    // ---------- 模式/采样率/音量 ----------
    function setMode(m) {
        state.mode = m === 'float' ? 'float' : 'byte';
        modeByte.classList.toggle('on', state.mode === 'byte');
        modeFloat.classList.toggle('on', state.mode === 'float');
    }
    function onParamChange() {
        if (audio.playing) { play(); } // 参数变化重排（t 归零重奏）
        else preview();
        updateShare();
        saveStateDebounced();
    }

    var saveTimer = null;
    function saveStateDebounced() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
            writeJSON(LS_STATE, { formula: ta.value, mode: state.mode, sr: state.sr, vol: state.vol });
        }, 350);
    }

    // ---------- 事件挂接 ----------
    playBtn.addEventListener('click', function () { audio.playing ? stop() : play(); });
    modeByte.addEventListener('click', function () { setMode('byte'); onParamChange(); });
    modeFloat.addEventListener('click', function () { setMode('float'); onParamChange(); });
    srSel.addEventListener('change', function () {
        var v = +srSel.value;
        if (core.SR_RATES.indexOf(v) >= 0) state.sr = v;
        onParamChange();
    });
    volInput.addEventListener('input', function () {
        state.vol = +volInput.value;
        volInput.style.setProperty('--p', state.vol + '%'); // v9.52 #181：mdslider 怠速柄 --p 同步
        if (audio.core) audio.core.setVolume(state.vol / 100);
        saveStateDebounced();
    });
    favBtn.addEventListener('click', function () {
        var f = ta.value.trim();
        if (!f) { toast('公式为空，无法收藏'); return; }
        for (var i = 0; i < favs.length; i++) {
            if (favs[i].formula === f) { toast('已在收藏中'); return; }
        }
        var name = '自定 ' + String(favs.length + 1);
        favs.push({ name: name, formula: f, mode: state.mode, sr: state.sr });
        writeJSON(LS_FAVS, favs);
        syncFavsVfs(); // v9.15 #176：收藏变更即镜像 VFS
        renderFavs();
        toast('已收藏 ' + name);
        sysNotify('ByteBeat', '已收藏 ' + name); // v9.52 #181：SDK 通知（降级静默）
    });

    // v9.15 #176：存曲库（当前公式 → /music/bytebeat/formula_<ts>.txt，与 favorites.json 同目录）
    saveVfsBtn.addEventListener('click', function () {
        var f = ta.value.trim();
        if (!f) { toast('公式为空，先写一条公式'); return; }
        if (!fsAvail()) { toast('VFS 不可用（独立运行无系统桥）'); return; }
        var name = 'formula_' + Date.now().toString(36) + '.txt';
        fsPut('/music/bytebeat/' + name, f);
        toast('已存入曲库：/music/bytebeat/' + name);
        sysNotify('ByteBeat', '已存入曲库：/music/bytebeat/' + name); // v9.52 #181
    });
    copyBtn.addEventListener('click', function () {
        var text = location.href;
        var done = function () { toast('链接已复制'); };
        // v9.52 #181：__system.clipboard.write 优先（宿主剪贴板语义）→ navigator.clipboard → execCommand 兜底
        if (window.__system && window.__system.clipboard && window.__system.clipboard.write) {
            try { Promise.resolve(window.__system.clipboard.write(text)).then(done, function () { fallbackCopy(text); done(); }); } catch (err) { fallbackCopy(text); done(); }
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
        } else { fallbackCopy(text); done(); }
    });
    function fallbackCopy(text) {
        try {
            var tmp = document.createElement('textarea');
            tmp.value = text;
            tmp.style.position = 'fixed';
            tmp.style.opacity = '0';
            document.body.appendChild(tmp);
            tmp.select();
            document.execCommand('copy');
            document.body.removeChild(tmp);
        } catch (err) { /* 剪贴板不可用静默 */ }
    }
    ta.addEventListener('input', function () {
        // 播放中热替换：合法即换引擎函数（下一块生效），非法保持旧公式并报错
        if (audio.playing) {
            var r = core.compileFormula(ta.value);
            if (r.ok) { curFn = r.fn; errEl.hidden = true; }
            else { errEl.hidden = false; errEl.textContent = r.error; }
            updateShare();
            saveStateDebounced();
        } else {
            preview();
            updateShare();
            saveStateDebounced();
        }
    });
    window.addEventListener('resize', function () {
        sizeCanvases();
        preview();
    });

    // ---------- 深链：终端 beat 命令 → bytebeat/play（打开即奏） ----------
    window.addEventListener('message', function (e) {
        try {
            var d = e.data;
            if (!d || d.type !== 'BUS_DELIVER' || d.event !== 'bytebeat/play') return;
            var f = String((d.payload || {}).formula || '').trim();
            if (!f) return;
            ta.value = f;
            compileCurrent();
            play();
            updateShare();
            saveStateDebounced();
            toast('来自终端的公式已开奏');
            sysNotify('ByteBeat', '来自终端的公式已开奏'); // v9.52 #181
        } catch (err) { /* 深链异常不影响应用本体 */ }
    });

    // ---------- v9.52 #181 五批：chips 整排按压联动（pressRipple 轻量版：距离衰减 scale） ----------
    function pressRipple(row, ev) {
        var chips = row.querySelectorAll('.bb-chip');
        for (var i = 0; i < chips.length; i++) {
            var r = chips[i].getBoundingClientRect();
            var d = Math.hypot(ev.clientX - (r.left + r.width / 2), ev.clientY - (r.top + r.height / 2));
            var k = Math.max(0.9, 1 - d / 900); // 近者深按远者微动，圆角按胶囊基准 999 不形变（R62 坑②）
            chips[i].style.transform = 'scale(' + k.toFixed(3) + ')';
        }
    }
    function releaseRipple(row) {
        var chips = row.querySelectorAll('.bb-chip');
        for (var i = 0; i < chips.length; i++) chips[i].style.transform = '';
    }
    [libEl, favsEl].forEach(function (row) {
        row.addEventListener('pointerdown', function (e) { pressRipple(row, e); });
        row.addEventListener('pointerup', function () { releaseRipple(row); });
        row.addEventListener('pointerleave', function () { releaseRipple(row); });
        row.addEventListener('pointercancel', function () { releaseRipple(row); });
    });

    // ---------- 初始化：URL 分享码 > 本地状态 > 默认公式 ----------
    function init() {
        sizeCanvases();
        var shared = null;
        try { shared = core.decodeShare(location.hash); } catch (err) { shared = null; }
        if (shared) {
            ta.value = shared.formula;
            setMode(shared.mode);
            state.sr = shared.sr;
            srSel.value = String(shared.sr);
            status('已从分享链接恢复');
        } else {
            var saved = readJSON(LS_STATE, null);
            if (saved && typeof saved.formula === 'string' && saved.formula.trim()) {
                ta.value = saved.formula;
                setMode(saved.mode === 'float' ? 'float' : 'byte');
                if (core.SR_RATES.indexOf(+saved.sr) >= 0) { state.sr = +saved.sr; srSel.value = String(saved.sr); }
                if (saved.vol >= 0 && saved.vol <= 100) { state.vol = +saved.vol; volInput.value = String(saved.vol); }
            } else {
                ta.value = core.FORMULAS[0].src;
                status('默认公式 · 从经典库开始');
            }
        }
        volInput.style.setProperty('--p', state.vol + '%'); // v9.52 #181：怠速柄初始 --p 回填（reload 持久化）
        favs = readJSON(LS_FAVS, []);
        if (!Array.isArray(favs)) favs = [];
        renderFavs();
        updateShare();
        compileCurrent();
        preview();
    }
    init();
})();
</script>
    <script src="../_shared/idle-slider.js"></script>
</body>
</html>
