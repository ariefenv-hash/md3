<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="../freeze-shim.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pixel MD3 智能专业相机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/fonts/material-symbols.css">
<link rel="stylesheet" href="../_shared/md3-tokens.css">

<style>
  /* v7.26 MD3 统一：相机为功能性暗色应用（真机相机不随系统切浅色），
     但色相跟随 Material You —— 表面色直接从 --md-h 派生（不消费可翻转角色），
     预览覆盖层白/黄/红均为相机功能色，保持常量。 */
  :root {
    --md-h: 215;
    --primary: hsl(var(--md-h) 85% 65%);
    --on-primary: #000000;
    --surface: hsl(var(--md-h) 18% 8%);
    --surface-glass: color-mix(in srgb, hsl(var(--md-h) 18% 8%) 74%, transparent);
    --surface-variant: hsl(var(--md-h) 14% 18%);
    --on-surface: hsl(var(--md-h) 10% 94%);
    --on-surface-variant: hsl(var(--md-h) 12% 72%);
    --accent: hsl(var(--md-h), 90%, 65%);
    --error: #ff5449;
    --yellow: #fbbc04;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--surface);
    color: var(--on-surface);
    font-family: var(--md-font);
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  /* 取景器容器 */
  .viewfinder-wrapper {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
    z-index: 1;
  }

  .viewfinder {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: width 0.3s cubic-bezier(0.2, 0, 0, 1), height 0.3s cubic-bezier(0.2, 0, 0, 1), border-radius 0.3s;
  }

  /* 各种画幅比例 */
  .viewfinder.ratio-full { width: 100%; height: 100%; border-radius: 0; }
  .viewfinder.ratio-4-3 { width: 100%; aspect-ratio: 3/4; max-height: calc(100vh - 160px); border-radius: 24px; }
  .viewfinder.ratio-16-9 { width: 100%; aspect-ratio: 9/16; max-height: 100%; border-radius: 0; }
  .viewfinder.ratio-1-1 { width: 92%; aspect-ratio: 1/1; border-radius: 28px; }

  video#cameraVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(1);
    transition: transform 0.3s ease, filter 0.3s ease;
  }
  video#cameraVideo.mirrored {
    transform: scaleX(-1);
  }

  /* 滤镜定义 */
  .filter-normal { filter: none; }
  .filter-monet { filter: contrast(1.08) saturate(1.25) hue-rotate(10deg) brightness(1.03); }
  .filter-vintage { filter: sepia(0.35) contrast(1.15) brightness(0.95) saturate(1.1); }
  .filter-vivid { filter: saturate(1.6) contrast(1.12); }
  .filter-noir { filter: grayscale(1) contrast(1.3) brightness(0.9); }
  .filter-cool { filter: contrast(1.05) saturate(1.15) hue-rotate(-20deg) brightness(1.02); }

  /* 取景器九宫格参考线 */
  .grid-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .grid-overlay.active { opacity: 0.35; }
  .grid-overlay > div {
    border-right: 1px solid #fff;
    border-bottom: 1px solid #fff;
  }
  .grid-overlay > div:nth-child(3n) { border-right: none; }
  .grid-overlay > div:nth-child(n+7) { border-bottom: none; }

  /* 对焦框 */
  .focus-ring {
    position: absolute;
    width: 72px;
    height: 72px;
    border: 2px solid var(--yellow);
    border-radius: 12px;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(1.4);
    opacity: 0;
    transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.22s ease;
    box-shadow: 0 0 10px rgba(251, 188, 4, 0.4);
    z-index: 10;
  }
  .focus-ring.active {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* 倒计时遮罩 */
  .timer-countdown-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 96px;
    font-weight: 700;
    color: #fff;
    z-index: 25;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .timer-countdown-overlay.active {
    opacity: 1;
  }
  .timer-number-pop {
    animation: timerPulse 0.9s ease-out;
  }
  @keyframes timerPulse {
    0% { transform: scale(0.4); opacity: 0; }
    40% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 0.9; }
  }

  /* 快门白屏闪烁 */
  .shutter-flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 30;
    transition: opacity 0.08s ease;
  }
  .shutter-flash.flashing {
    opacity: 1;
    transition: none;
  }

  /* 顶部快捷设置胶囊栏 */
  .top-bar {
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px 8px;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0) 100%);
  }

  .top-pill {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .icon-action-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 20px;
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.18s, transform 0.15s;
  }
  .icon-action-btn:active {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(0.92);
  }
  .icon-action-btn.active {
    color: var(--yellow);
  }
  .icon-action-btn .badge-text {
    font-size: 10px;
    font-weight: 700;
    font-family: 'Roboto Mono', monospace;
  }

  /* 录像时间指示条 */
  .recording-indicator {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(230, 20, 20, 0.85);
    color: #fff;
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    box-shadow: 0 2px 12px rgba(255, 0, 0, 0.4);
    animation: recPulse 1.5s infinite ease-in-out;
  }
  .recording-indicator.active {
    display: flex;
  }
  .rec-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes recPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  /* v7.47：底部泊坞 —— 模式条与快门控制组合并为一个流式子块，
     贴住屏幕底部；模式条不再被 space-between 推到取景器正中 */
  .bottom-dock {
    position: relative;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  }

  /* 模式选择滑块 (MD3 Tab Chips) */
  .mode-selector {
    position: relative;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .mode-selector::-webkit-scrollbar { display: none; }

  .mode-chip {
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.6);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.2s, background 0.2s, transform 0.2s;
  }
  .mode-chip.active {
    color: #fff;
    background: rgba(255, 255, 255, 0.2);
    font-weight: 700;
    transform: scale(1.06);
  }

  /* 底部快门控制区 (MD3 Expressive Controls) */
  .bottom-controls {
    position: relative;
    z-index: 20;
    padding: 12px 24px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(0deg, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0) 100%);
  }

  /* 相册缩略图预览 */
  .gallery-preview {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.5);
    overflow: hidden;
    background: rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  .gallery-preview:active {
    transform: scale(0.92);
  }
  .gallery-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .gallery-preview .empty-icon {
    font-size: 22px;
    color: rgba(255, 255, 255, 0.7);
  }

  /* 核心快门按钮 */
  .shutter-btn-wrapper {
    position: relative;
    width: 82px;
    height: 82px;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .shutter-outer-ring {
    position: absolute;
    inset: 0;
    border: 4px solid #ffffff;
    border-radius: 50%;
    transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.2s;
  }
  .shutter-inner-fill {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #ffffff;
    transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), border-radius 0.2s, background-color 0.2s;
    box-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
  }
  .shutter-btn-wrapper:active .shutter-outer-ring {
    transform: scale(0.92);
  }
  .shutter-btn-wrapper:active .shutter-inner-fill {
    transform: scale(0.88);
  }

  /* 录像模式快门 */
  .mode-video-active .shutter-inner-fill {
    background: var(--error);
    box-shadow: 0 0 16px rgba(255, 84, 73, 0.5);
  }
  .mode-video-active.is-recording .shutter-inner-fill {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--error);
  }
  .mode-video-active.is-recording .shutter-outer-ring {
    border-color: var(--error);
    animation: ringPulse 1.2s infinite ease-in-out;
  }
  @keyframes ringPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* 翻转前后置镜头按钮 */
  .switch-cam-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: #fff;
    font-size: 24px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
  }
  .switch-cam-btn:active {
    transform: rotate(180deg) scale(0.9);
    background: rgba(255, 255, 255, 0.3);
  }

  /* 滤镜选择面板 (BottomSheet / Drawer) */
  .filter-drawer {
    position: absolute;
    bottom: 150px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 10px 14px;
    display: flex;
    gap: 12px;
    z-index: 25;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    max-width: 90vw;
    overflow-x: auto;
  }
  .filter-drawer.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .filter-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .filter-thumb {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: var(--surface-variant);
    overflow: hidden;
    display: grid;
    place-items: center;
    font-size: 16px;
    transition: border-color 0.2s, transform 0.2s;
  }
  .filter-item.active .filter-thumb {
    border-color: var(--primary);
    transform: scale(1.1);
  }
  .filter-name {
    font-size: 10px;
    font-weight: 600;
    color: var(--on-surface-variant);
  }
  .filter-item.active .filter-name {
    color: var(--on-surface);
  }

  /* 全屏媒体预览 Modal */
  .media-modal {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.95);
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .media-modal.open {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }
  .media-modal-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: rgba(0, 0, 0, 0.6);
    z-index: 2;
  }
  .media-modal-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .media-modal-body img,
  .media-modal-body video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .media-modal-bottom {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 16px 20px 32px;
    background: rgba(0, 0, 0, 0.6);
    z-index: 2;
  }
  .modal-btn {
    background: none;
    border: none;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-btn span.material-symbols-rounded {
    font-size: 24px;
  }

  /* 提示 Toast */
  .camera-toast {
    position: absolute;
    top: 76px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 50;
    backdrop-filter: blur(12px);
  }
  .camera-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
    <style id="icon-standard-style">
  /* [icon-standard] Material Symbols 统一基准 — 与 Google Fonts 官方基线一致。
   样式表离线/加载失败时，图标不再继承正文字号（防忽大忽小），线上线下行为一致。
   同时本地声明字体家族：Google 样式表失败但字体文件有缓存时图标仍可渲染。 */
  .material-symbols-rounded, .material-symbols-outlined, .material-icons,
  .material-icons-rounded, .material-icons-outlined {
    font-weight: normal;
    font-style: normal;
    font-size: 24px;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-smoothing: antialiased;
  }
  .material-symbols-rounded { font-family: 'Material Symbols Rounded', sans-serif; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined', sans-serif; }
  .material-icons { font-family: 'Material Icons', sans-serif; }
  .material-icons-rounded { font-family: 'Material Icons Rounded', sans-serif; }
  .material-icons-outlined { font-family: 'Material Icons Outlined', sans-serif; }
/* 顶栏/底部控制图标按钮统一 22px（原 20px 写在按钮上，线上会被 Google 基线 24px 覆盖，现固定 22px 与全局一致） */
  .icon-action-btn .material-symbols-rounded { font-size: 22px; }
  </style>
</head>
<body>

  <!-- 取景器容器 -->
  <div class="viewfinder-wrapper">
    <div class="viewfinder ratio-4-3" id="viewfinder">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <canvas id="captureCanvas" style="display:none;"></canvas>

      <!-- 构图九宫格 -->
      <div class="grid-overlay" id="gridOverlay">
        <div></div><div></div><div></div>
        <div></div><div></div><div></div>
        <div></div><div></div><div></div>
      </div>

      <!-- 对焦框 -->
      <div class="focus-ring" id="focusRing"></div>

      <!-- 倒计时遮罩 -->
      <div class="timer-countdown-overlay" id="timerOverlay">
        <span id="timerNumber">3</span>
      </div>

      <!-- 快门白光闪烁 -->
      <div class="shutter-flash" id="shutterFlash"></div>
    </div>
  </div>

  <!-- 顶部工具栏 -->
  <div class="top-bar">
    <div class="top-pill">
      <!-- 闪光灯切换 -->
      <button class="icon-action-btn" id="flashBtn" title="闪光灯">
        <span class="material-symbols-rounded">flash_auto</span>
      </button>

      <!-- 比例切换 -->
      <button class="icon-action-btn" id="ratioBtn" title="画幅比例">
        <span class="badge-text" id="ratioText">4:3</span>
      </button>

      <!-- 网格线 -->
      <button class="icon-action-btn" id="gridBtn" title="构图参考线">
        <span class="material-symbols-rounded">grid_3x3</span>
      </button>

      <!-- 滤镜面板开关 -->
      <button class="icon-action-btn" id="filterToggleBtn" title="滤镜">
        <span class="material-symbols-rounded">palette</span>
      </button>

      <!-- 倒计时开关 -->
      <button class="icon-action-btn" id="timerBtn" title="定时拍摄">
        <span class="material-symbols-rounded">timer_3</span>
      </button>
    </div>

    <!-- 录像计时指示 -->
    <div class="recording-indicator" id="recIndicator">
      <div class="rec-dot"></div>
      <span id="recTimerText">00:00</span>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="camera-toast" id="cameraToast">已保存到相册</div>

  <!-- 滤镜选择抽屉 -->
  <div class="filter-drawer" id="filterDrawer">
    <div class="filter-item active" data-filter="normal">
      <div class="filter-thumb"><svg viewBox="0 0 24 24" style="width:18px;height:18px;display:block;margin:0 auto;fill:#fff"><path d="M20 4C10.5 5 5.8 9.7 5.2 16.8c-.1 1.3 0 2.5.2 3.2h2.1c.1-1.8.5-3.4 1.3-4.8C10.5 17.5 14 18.4 16.8 15.7 20 12.6 20 7.5 20 4z"/></svg></div>
      <div class="filter-name">原图</div>
    </div>
    <div class="filter-item" data-filter="monet">
      <div class="filter-thumb" style="background:linear-gradient(135deg,#ffeedd,#ffccaa)"><svg viewBox="0 0 24 24" style="width:18px;height:18px;display:block;margin:0 auto;fill:#fff"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg></div>
      <div class="filter-name">莫奈暖阳</div>
    </div>
    <div class="filter-item" data-filter="vivid">
      <div class="filter-thumb" style="background:linear-gradient(135deg,#00c6ff,#0072ff)"><svg viewBox="0 0 24 24" style="width:18px;height:18px;display:block;margin:0 auto;fill:#fff"><g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M3.5 16.5a8.5 8.5 0 0 1 17 0"/><path d="M7.3 16.5a4.7 4.7 0 0 1 9.4 0"/></g><rect x="2" y="16" width="20" height="2.6" rx="1.3" fill="#fff"/></svg></div>
      <div class="filter-name">鲜艳</div>
    </div>
    <div class="filter-item" data-filter="vintage">
      <div class="filter-thumb" style="background:linear-gradient(135deg,#d4a373,#ccd5ae)"><svg viewBox="0 0 24 24" style="width:18px;height:18px;display:block;margin:0 auto;fill:#fff"><path d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg></div>
      <div class="filter-name">复古胶片</div>

    <div class="filter-item" data-filter="noir">
      <div class="filter-thumb" style="background:#222;color:#fff"><svg viewBox="0 0 24 24" style="width:18px;height:18px;display:block;margin:0 auto;fill:#fff"><path d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg></div>
      <div class="filter-name">经典黑白</div>
    </div>
    <div class="filter-item" data-filter="cool">
      <div class="filter-thumb" style="background:linear-gradient(135deg,#2193b0,#6dd5ed)"><svg viewBox="0 0 24 24" style="width:18px;height:18px;display:block;margin:0 auto;fill:#fff"><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M3.34 7l17.32 10M20.66 7 3.34 17"/></g></svg></div>
      <div class="filter-name">赛博冷调</div>
    </div>
  </div>

  <!-- v7.47：底部泊坞（模式条 + 快门控制组）—— 旧结构里 mode-selector 是 body
       flex(space-between) 的独立子块，任何视口高度下都被推到屏幕正中悬浮在取景器上
       （issue #6 img2）。并入底部组后 space-between 只在 [顶栏 | 底部泊坞] 两点分布。 -->
  <div class="bottom-dock">
  <!-- 模式切换栏 -->
  <div class="mode-selector" id="modeSelector">
    <div class="mode-chip" data-mode="night">夜景</div>
    <div class="mode-chip active" data-mode="photo">照片</div>
    <div class="mode-chip" data-mode="portrait">人像</div>
    <div class="mode-chip" data-mode="video">视频</div>
    <div class="mode-chip" data-mode="pro">专业</div>
  </div>

  <!-- 底部快门控制区 -->
  <div class="bottom-controls" id="bottomControls">
    <!-- 相册缩略图 -->
    <div class="gallery-preview" id="galleryBtn" title="查看相册">
      <span class="material-symbols-rounded empty-icon" id="galleryEmptyIcon">photo_library</span>
      <img id="galleryThumbImg" style="display:none;" alt="最新照片" />
    </div>

    <!-- 快门按钮 -->
    <div class="shutter-btn-wrapper" id="shutterBtn" title="快门">
      <div class="shutter-outer-ring"></div>
      <div class="shutter-inner-fill"></div>
    </div>

    <!-- 镜头翻转 -->
    <button class="switch-cam-btn" id="switchCamBtn" title="翻转镜头">
      <span class="material-symbols-rounded">flip_camera_ios</span>
    </button>
  </div>
  </div><!-- /bottom-dock -->

  <!-- 全屏相册查看 Modal -->
  <div class="media-modal" id="mediaModal">
    <div class="media-modal-top">
      <button class="icon-action-btn" id="closeModalBtn">
        <span class="material-symbols-rounded">arrow_back</span>
      </button>
      <span id="modalMediaTime" style="font-size:14px;font-weight:600;">照片预览</span>
      <button class="icon-action-btn" id="deleteMediaBtn" style="color:var(--error);">
        <span class="material-symbols-rounded">delete</span>
      </button>
    </div>
    <div class="media-modal-body" id="mediaModalBody">
      <img id="modalPreviewImg" style="display:none;" />
      <video id="modalPreviewVideo" controls playsinline style="display:none;"></video>
    </div>
    <div class="media-modal-bottom">
      <button class="modal-btn" id="downloadMediaBtn">
        <span class="material-symbols-rounded">download</span>
        <span>保存</span>
      </button>
      <button class="modal-btn" id="shareMediaBtn">
        <span class="material-symbols-rounded">share</span>
        <span>分享</span>
      </button>
    </div>
  </div>

  <script>
    // ==================== Web Audio 快门音效系统 ====================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playShutterSound() {
      try {
        initAudio();
        const t = audioCtx.currentTime;
        // 机械快门声模拟
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(120, t + 0.08);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
      } catch (e) {}
    }

    function playBeep(freq = 600, dur = 0.08) {
      try {
        initAudio();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur);
      } catch (e) {}
    }

    // ==================== 相机主状态 ====================
    const state = {
      stream: null,
      facingMode: 'environment', // 'user' or 'environment'
      currentRatio: '4-3', // '4-3', '16-9', '1-1', 'full'
      currentFilter: 'normal',
      isGridOn: false,
      flashMode: 'auto', // 'off', 'on', 'auto'
      timerMode: 0, // 0, 3, 10
      currentMode: 'photo', // 'photo', 'video', 'portrait', 'night', 'pro'
      isRecording: false,
      mediaRecorder: null,
      recordedChunks: [],
      recStartTime: 0,
      recTimerInterval: null,
      galleryItems: JSON.parse(localStorage.getItem('pixel_camera_gallery') || '[]'),
      currentViewingItem: null,
    };

    const videoEl = document.getElementById('cameraVideo');
    const viewfinderEl = document.getElementById('viewfinder');
    const focusRing = document.getElementById('focusRing');
    const shutterFlash = document.getElementById('shutterFlash');
    const toastEl = document.getElementById('cameraToast');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    // ==================== 系统权限前置（桌面统一权限对话框，见 js/permissions.js） ====================
    // 首次启动相机前弹出 MD3 权限询问；拒绝后可在 设置 › 应用权限管理 改判。
    // 轮询等待桌面注入的 __system SDK（iframe load 后即注入）；独立打开时默认放行。
    function requestSystemPermission(name) {
      return new Promise((resolve) => {
        let settled = false;
        const done = (v) => { if (!settled) { settled = true; resolve(!!v); } };
        let tries = 20;
        (function attempt() {
          if (settled) return;
          if (window.__system && window.__system.requestPermission) {
            window.__system.requestPermission(name).then(done).catch(() => done(true));
          } else if (tries-- > 0) {
            setTimeout(attempt, 100);
          } else {
            done(true); // 独立打开 / 旧版桌面：无权限服务则默认放行
          }
        })();
      });
    }

    // ==================== 启动真实 WebRTC 摄像头 ====================
    async function startCamera() {
      // 统一权限：首次调用弹出 MD3 权限对话框（设置 › 应用权限管理 可改判）
      const camGranted = await requestSystemPermission('camera');
      if (!camGranted) {
        showToast('未授予相机权限，可在 设置 › 应用权限管理 中开启');
        return;
      }

      if (state.stream) {
        state.stream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          facingMode: { ideal: state.facingMode },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: state.currentMode === 'video'
      };

      try {
        state.stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoEl.srcObject = state.stream;
        videoEl.classList.toggle('mirrored', state.facingMode === 'user');
        videoEl.play().catch(() => {});
      } catch (err) {
        console.warn('Direct camera access constraint fallback:', err);
        try {
          // 宽泛降级请求
          state.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          videoEl.srcObject = state.stream;
          videoEl.classList.toggle('mirrored', state.facingMode === 'user');
          videoEl.play().catch(() => {});
        } catch (fallbackErr) {
          console.error('Camera fallback failed:', fallbackErr);
          showToast('无法启动摄像头，请授予相机权限');
        }
      }
    }

    // ==================== 对焦点击手势 ====================
    viewfinderEl.addEventListener('pointerdown', (e) => {
      const rect = viewfinderEl.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      focusRing.style.left = `${x}px`;
      focusRing.style.top = `${y}px`;
      focusRing.classList.remove('active');
      void focusRing.offsetWidth; // 触发 reflow
      focusRing.classList.add('active');

      playBeep(900, 0.04);
      setTimeout(() => focusRing.classList.remove('active'), 1200);
    });

    // ==================== 闪光灯切换 ====================
    const flashBtn = document.getElementById('flashBtn');
    const flashIcons = { auto: 'flash_auto', on: 'flash_on', off: 'flash_off' };
    flashBtn.addEventListener('click', () => {
      const modes = ['auto', 'on', 'off'];
      const nextIdx = (modes.indexOf(state.flashMode) + 1) % modes.length;
      state.flashMode = modes[nextIdx];
      flashBtn.innerHTML = `<span class="material-symbols-rounded">${flashIcons[state.flashMode]}</span>`;
      flashBtn.classList.toggle('active', state.flashMode !== 'off');
      showToast(`闪光灯: ${state.flashMode === 'auto' ? '自动' : (state.flashMode === 'on' ? '开启' : '关闭')}`);
    });

    // ==================== 画幅比例切换 ====================
    const ratioBtn = document.getElementById('ratioBtn');
    const ratioText = document.getElementById('ratioText');
    const ratios = ['4-3', '16-9', '1-1', 'full'];
    const ratioLabels = { '4-3': '4:3', '16-9': '16:9', '1-1': '1:1', 'full': '全屏' };

    ratioBtn.addEventListener('click', () => {
      const nextIdx = (ratios.indexOf(state.currentRatio) + 1) % ratios.length;
      state.currentRatio = ratios[nextIdx];
      viewfinderEl.className = `viewfinder ratio-${state.currentRatio}`;
      ratioText.textContent = ratioLabels[state.currentRatio];
      showToast(`画幅比例: ${ratioLabels[state.currentRatio]}`);
    });

    // ==================== 网格参考线 ====================
    const gridBtn = document.getElementById('gridBtn');
    const gridOverlay = document.getElementById('gridOverlay');
    gridBtn.addEventListener('click', () => {
      state.isGridOn = !state.isGridOn;
      gridOverlay.classList.toggle('active', state.isGridOn);
      gridBtn.classList.toggle('active', state.isGridOn);
      showToast(`构图参考线: ${state.isGridOn ? '开启' : '关闭'}`);
    });

    // ==================== 滤镜切换 ====================
    const filterToggleBtn = document.getElementById('filterToggleBtn');
    const filterDrawer = document.getElementById('filterDrawer');
    filterToggleBtn.addEventListener('click', () => {
      filterDrawer.classList.toggle('open');
      filterToggleBtn.classList.toggle('active', filterDrawer.classList.contains('open'));
    });

    document.querySelectorAll('.filter-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.filter-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        state.currentFilter = item.dataset.filter;
        videoEl.className = `filter-${state.currentFilter}` + (state.facingMode === 'user' ? ' mirrored' : '');
        showToast(`滤镜: ${item.querySelector('.filter-name').textContent}`);
      });
    });

    // ==================== 定时器切换 ====================
    const timerBtn = document.getElementById('timerBtn');
    const timers = [0, 3, 10];
    const timerIcons = { 0: 'timer_off', 3: 'timer_3', 10: 'timer_10' };
    timerBtn.addEventListener('click', () => {
      const nextIdx = (timers.indexOf(state.timerMode) + 1) % timers.length;
      state.timerMode = timers[nextIdx];
      timerBtn.innerHTML = `<span class="material-symbols-rounded">${timerIcons[state.timerMode]}</span>`;
      timerBtn.classList.toggle('active', state.timerMode > 0);
      showToast(`定时拍摄: ${state.timerMode === 0 ? '关闭' : state.timerMode + ' 秒'}`);
    });

    // ==================== 镜头翻转 ====================
    const switchCamBtn = document.getElementById('switchCamBtn');
    switchCamBtn.addEventListener('click', () => {
      state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
      if (navigator.vibrate) navigator.vibrate(30);
    });

    // ==================== 模式选择 ====================
    const modeChips = document.querySelectorAll('.mode-chip');
    const bottomControls = document.getElementById('bottomControls');
    modeChips.forEach(chip => {
      chip.addEventListener('click', () => {
        modeChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state.currentMode = chip.dataset.mode;
        bottomControls.classList.toggle('mode-video-active', state.currentMode === 'video');
        if (state.currentMode === 'video') {
          startCamera(); // 重启以携带音频
        }
      });
    });

    // ==================== 拍照核心逻辑 ====================
    async function takePhoto() {
      playShutterSound();
      if (navigator.vibrate) navigator.vibrate([20, 40, 20]);

      // 闪光灯视觉效果
      shutterFlash.classList.add('flashing');
      setTimeout(() => shutterFlash.classList.remove('flashing'), 100);

      const canvas = document.getElementById('captureCanvas');
      const vW = videoEl.videoWidth || 1280;
      const vH = videoEl.videoHeight || 720;
      canvas.width = vW;
      canvas.height = vH;

      const ctx = canvas.getContext('2d');
      if (state.facingMode === 'user') {
        ctx.translate(vW, 0);
        ctx.scale(-1, 1);
      }

      // 应用 CSS 滤镜到 Canvas
      if (state.currentFilter === 'monet') ctx.filter = 'contrast(1.08) saturate(1.25) hue-rotate(10deg) brightness(1.03)';
      else if (state.currentFilter === 'vintage') ctx.filter = 'sepia(0.35) contrast(1.15) brightness(0.95) saturate(1.1)';
      else if (state.currentFilter === 'vivid') ctx.filter = 'saturate(1.6) contrast(1.12)';
      else if (state.currentFilter === 'noir') ctx.filter = 'grayscale(1) contrast(1.3) brightness(0.9)';
      else if (state.currentFilter === 'cool') ctx.filter = 'contrast(1.05) saturate(1.15) hue-rotate(-20deg) brightness(1.02)';
      else ctx.filter = 'none';

      ctx.drawImage(videoEl, 0, 0, vW, vH);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

      const item = {
        id: 'photo_' + Date.now(),
        type: 'image',
        dataUrl,
        time: new Date().toLocaleString(),
        filter: state.currentFilter
      };

      saveToGallery(item);
      showToast('照片已保存');
    }

    // ==================== 录像核心逻辑 ====================
    function startRecording() {
      if (!state.stream) return;
      state.recordedChunks = [];

      try {
        state.mediaRecorder = new MediaRecorder(state.stream, { mimeType: 'video/webm' });
      } catch (e) {
        state.mediaRecorder = new MediaRecorder(state.stream);
      }

      state.mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) state.recordedChunks.push(e.data);
      };

      state.mediaRecorder.onstop = () => {
        const blob = new Blob(state.recordedChunks, { type: 'video/webm' });
        const videoUrl = URL.createObjectURL(blob);
        const item = {
          id: 'video_' + Date.now(),
          type: 'video',
          blobUrl: videoUrl,
          time: new Date().toLocaleString()
        };
        saveToGallery(item);
        showToast('视频已保存');
      };

      state.mediaRecorder.start(100);
      state.isRecording = true;
      state.recStartTime = Date.now();
      bottomControls.classList.add('is-recording');
      document.getElementById('recIndicator').classList.add('active');

      state.recTimerInterval = setInterval(() => {
        const diff = Math.floor((Date.now() - state.recStartTime) / 1000);
        const m = String(Math.floor(diff / 60)).padStart(2, '0');
        const s = String(diff % 60).padStart(2, '0');
        document.getElementById('recTimerText').textContent = `${m}:${s}`;
      }, 500);

      playBeep(880, 0.1);
      if (navigator.vibrate) navigator.vibrate(50);
    }

    function stopRecording() {
      if (state.mediaRecorder && state.isRecording) {
        state.mediaRecorder.stop();
        state.isRecording = false;
        clearInterval(state.recTimerInterval);
        bottomControls.classList.remove('is-recording');
        document.getElementById('recIndicator').classList.remove('active');
        document.getElementById('recTimerText').textContent = '00:00';
        playBeep(440, 0.1);
        if (navigator.vibrate) navigator.vibrate([30, 30]);
      }
    }

    // ==================== 快门主入口 (支持倒计时) ====================
    const shutterBtn = document.getElementById('shutterBtn');
    const timerOverlay = document.getElementById('timerOverlay');
    const timerNumber = document.getElementById('timerNumber');

    shutterBtn.addEventListener('click', () => {
      if (state.currentMode === 'video') {
        if (state.isRecording) stopRecording();
        else startRecording();
        return;
      }

      if (state.timerMode > 0) {
        let count = state.timerMode;
        timerOverlay.classList.add('active');
        timerNumber.textContent = count;
        timerNumber.className = 'timer-number-pop';
        playBeep(700, 0.06);

        const timerId = setInterval(() => {
          count--;
          if (count > 0) {
            timerNumber.textContent = count;
            timerNumber.className = '';
            void timerNumber.offsetWidth;
            timerNumber.className = 'timer-number-pop';
            playBeep(700, 0.06);
          } else {
            clearInterval(timerId);
            timerOverlay.classList.remove('active');
            takePhoto();
          }
        }, 1000);
      } else {
        takePhoto();
      }
    });

    // ==================== 相册与持久化 ====================
    const galleryBtn = document.getElementById('galleryBtn');
    const galleryThumbImg = document.getElementById('galleryThumbImg');
    const galleryEmptyIcon = document.getElementById('galleryEmptyIcon');

    function updateGalleryThumb() {
      if (state.galleryItems.length > 0) {
        const latest = state.galleryItems[0];
        galleryThumbImg.src = latest.type === 'image' ? latest.dataUrl : (latest.blobUrl || '');
        galleryThumbImg.style.display = 'block';
        galleryEmptyIcon.style.display = 'none';
      } else {
        galleryThumbImg.style.display = 'none';
        galleryEmptyIcon.style.display = 'block';
      }
    }

    function saveToGallery(item) {
      state.galleryItems.unshift(item);
      if (state.galleryItems.length > 30) state.galleryItems.pop();
      try {
        // 存储非 Blob 大对象
        const serializable = state.galleryItems.filter(i => i.type === 'image');
        localStorage.setItem('pixel_camera_gallery', JSON.stringify(serializable.slice(0, 10)));
      } catch (e) {}
      updateGalleryThumb();

      // 应用总线：新照片同步到相册应用（camera → photo 联动，见桌面 js/app-bus.js）
      // 相册在后台时桌面代发通知横幅；未启动则在下次打开时补投
      if (item.type === 'image' && window.__system) {
        try {
          window.__system.emit('photo/captured', {
            id: item.id,
            type: 'image',
            src: item.dataUrl,
            name: 'IMG_' + item.id + '.jpg',
            time: item.time,
            noti: { title: '照片已同步到相册', desc: '相机拍摄 · ' + item.time }
          }, 'photo');
        } catch (e) {}
      }
    }

    // ==================== 相册全屏查看 Modal ====================
    const mediaModal = document.getElementById('mediaModal');
    const modalPreviewImg = document.getElementById('modalPreviewImg');
    const modalPreviewVideo = document.getElementById('modalPreviewVideo');
    const modalMediaTime = document.getElementById('modalMediaTime');

    galleryBtn.addEventListener('click', () => {
      if (state.galleryItems.length === 0) {
        showToast('相册为空，先拍张照吧！');
        return;
      }
      openMediaModal(state.galleryItems[0]);
    });

    function openMediaModal(item) {
      state.currentViewingItem = item;
      modalMediaTime.textContent = item.time;

      if (item.type === 'image') {
        modalPreviewImg.src = item.dataUrl;
        modalPreviewImg.style.display = 'block';
        modalPreviewVideo.style.display = 'none';
      } else {
        modalPreviewVideo.src = item.blobUrl;
        modalPreviewVideo.style.display = 'block';
        modalPreviewImg.style.display = 'none';
      }

      mediaModal.classList.add('open');
    }

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      mediaModal.classList.remove('open');
      modalPreviewVideo.pause();
    });

    document.getElementById('deleteMediaBtn').addEventListener('click', () => {
      if (!state.currentViewingItem) return;
      state.galleryItems = state.galleryItems.filter(i => i.id !== state.currentViewingItem.id);
      mediaModal.classList.remove('open');
      modalPreviewVideo.pause();
      updateGalleryThumb();
      showToast('已删除');
    });

    document.getElementById('downloadMediaBtn').addEventListener('click', () => {
      if (!state.currentViewingItem) return;
      const item = state.currentViewingItem;
      const a = document.createElement('a');
      a.href = item.type === 'image' ? item.dataUrl : item.blobUrl;
      a.download = `pixel_${item.type}_${Date.now()}.${item.type === 'image' ? 'jpg' : 'webm'}`;
      a.click();
      showToast('开始下载');
    });

    document.getElementById('shareMediaBtn').addEventListener('click', async () => {
      if (!state.currentViewingItem) return;
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Pixel MD3 相机拍摄',
            text: `拍摄于 ${state.currentViewingItem.time}`,
          });
        } catch (e) {}
      } else {
        showToast('已复制分享链接');
      }
    });

    // ==================== 响应桌面主题色广播 ====================
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'set-theme-hue') {
        document.documentElement.style.setProperty('--md-h', e.data.hue);
      }
    });

    // 初始化运行
    updateGalleryThumb();
    startCamera();
  </script>
</body>
</html>
