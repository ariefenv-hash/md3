<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国际象棋 Chess - 完整规则 · AI 对手 · 棋谱</title>
  <link rel="stylesheet" href="../_shared/md3-tokens.css">
  <!-- v9.94（#132）：国际象棋 —— 完整规则（易位/过路兵/升变/将死/逼和/三次重复/五十步）+ AI 三档（minimax α-β 深度 1/2/3）+ SAN 棋谱。
       纯逻辑核 js/chess-core.js（perft 金标 20/400/8902/197281 验证）；页面只做接线。
       准入六条对齐（#179）：① 全 --md-* 令牌（棋盘格用主题容器色派生，无裸色）② @media 断点 ③ 平板棋盘/棋谱分栏
       ④ VFS /documents/chess/ 棋谱存档 + sysNotify 终局通知 ⑤ 工具栏整排按压联动（tile-bounce 范式）。
       归属：超越项（AOSP 无棋类应用；规则引擎自研零依赖零网络离线可用）。 -->
  <script src="../../js/chess-core.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 12px; font-family: var(--md-text-font);
      background: var(--md-surface); color: var(--md-on-surface);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    }
    /* 工具栏：整排按压联动（#179 准入⑤ tile-bounce 范式 —— 相邻按钮随按压联动缩放） */
    .ch-toolbar { display: flex; gap: 6px; width: 100%; max-width: 400px; margin-bottom: 10px; }
    .ch-btn {
      flex: 1; border: 1px solid var(--md-outline-variant); background: var(--md-surface-container);
      color: var(--md-on-surface); border-radius: var(--md-r-full); padding: 8px 4px; font-size: 12px; cursor: pointer;
      transition: transform .15s cubic-bezier(.2,.8,.2,1), border-radius .15s, background .15s;
    }
    .ch-btn.ch-on { background: var(--md-primary-container); color: var(--md-on-primary-container); border-color: transparent; }
    /* 整排联动：按压项微缩，相邻项按邻接联动缩放+圆角融合 */
    .ch-toolbar:has(.ch-btn:active) .ch-btn { transform: scale(.94); border-radius: 14px; }
    .ch-toolbar:has(.ch-btn:active) .ch-btn:active { transform: scale(.88); border-radius: 10px; background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
    .ch-toolbar:has(.ch-btn:active) .ch-btn + .ch-btn { transform: scale(.97); border-radius: 18px; }
    /* 状态条 */
    .ch-status {
      width: 100%; max-width: 400px; text-align: center; font-size: 13px; padding: 8px 12px;
      border-radius: var(--md-r-sm); background: var(--md-surface-container); margin-bottom: 10px;
      color: var(--md-on-surface-variant);
    }
    .ch-status.ch-alert { background: var(--md-error-container); color: var(--md-on-error-container); }
    .ch-status.ch-win { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    /* 分栏容器：手机纵向（棋盘上棋谱下），平板横向分栏（准入③） */
    .ch-main { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
    /* 棋盘：8x8，格色为主题容器色派生（无裸色——准入①，浅格 surface-bright/深格 secondary-container） */
    .ch-board {
      display: grid; grid-template-columns: repeat(8, 1fr);
      /* #216：显式 8 行等轨——旧实现 8 行全为隐式轨道，行高靠内容撑（空行塌陷=Edge 下无棋子行偏窄），
         且隐式行分配依赖引擎 align-content 语义跨引擎不稳；1fr 显式轨空行与有子行同轨同尺寸零内容依赖 */
      grid-template-rows: repeat(8, 1fr);
      width: min(100%, 340px);
      aspect-ratio: 1; border-radius: var(--md-r-sm); overflow: hidden;
      border: 1px solid var(--md-outline-variant); user-select: none;
    }
    /* #241 键盘可达：行容器 display:contents —— grid 布局行列轨道分配不变，
       格子仍是棋盘直接网格项（ARIA grid 语义要求 row→gridcell 层级） */
    .ch-row { display: contents; }
    .ch-cell { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .ch-cell:focus-visible { outline: 3px solid var(--md-primary); outline-offset: -3px; }
    .ch-light { background: var(--md-surface-bright); }
    .ch-dark  { background: var(--md-secondary-container); }
    .ch-piece { font-size: clamp(20px, 7.6vw, 34px); line-height: 1; pointer-events: none; font-family: 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Roboto', sans-serif; } /* v11.27 #313 V2 批：棋子 unicode 字形锚定，不随 body 衬线契约漂移（threes 30 行同款豁免面） */
    .ch-w .ch-piece { color: var(--md-on-primary); text-shadow: 0 0 2px var(--md-outline); }
    .ch-b .ch-piece { color: var(--md-on-surface); }
    .ch-sel { outline: 3px solid var(--md-primary); outline-offset: -3px; }
    .ch-dot::after {
      content: ''; position: absolute; width: 26%; height: 26%; border-radius: 50%;
      background: var(--md-primary); opacity: .55;
    }
    .ch-cap::after { content: ''; position: absolute; inset: 6%; border-radius: 50%; border: 3px solid var(--md-error); opacity: .6; }
    .ch-last { outline: 2px solid var(--md-tertiary); outline-offset: -2px; }
    /* 棋谱面板 */
    .ch-panel {
      width: 100%; max-width: 400px; background: var(--md-surface-container);
      border-radius: 16px; padding: 10px 12px;
    }
    .ch-panel h3 { margin: 0 0 6px; font-size: 13px; color: var(--md-on-surface-variant); font-weight: 500; }
    .ch-moves { display: grid; grid-template-columns: 28px 1fr 1fr; gap: 2px 6px; font-size: 12px; max-height: 180px; overflow-y: auto; }
    .ch-no { color: var(--md-outline); }
    .ch-san { font-family: monospace; font-size: 12px; color: var(--md-on-surface); }
    /* #314 V7 空状态：着法史空态占位（真 UX；grid 跨列铺满三栏） */
    .ch-moves-empty { grid-column: 1 / -1; color: var(--md-on-surface-variant); font-size: 12px; padding: 4px 2px; }
    /* 升变四选择底部弹层（v11.27 #237②）——MD3 bottom sheet，全 --md-* 令牌无裸色 */
    .ch-sheet-mask {
      position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center;
      background: color-mix(in srgb, var(--md-scrim) 42%, transparent);
    }
    .ch-sheet-mask[hidden] { display: none; }
    .ch-sheet {
      width: 100%; max-width: 400px; padding: 14px 16px 20px;
      background: var(--md-surface-container-high); color: var(--md-on-surface);
      border-top: 1px solid var(--md-outline-variant);
      border-radius: 28px 28px 0 0; animation: ch-sheet-in .22s var(--md-easing-emphasized, cubic-bezier(.2,0,0,1));
    }
    @keyframes ch-sheet-in { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
    .ch-sheet-title { text-align: center; font-size: 13px; color: var(--md-on-surface-variant); margin-bottom: 12px; }
    .ch-promo-row { display: flex; gap: 10px; }
    .ch-promo-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0;
      border: 1px solid var(--md-outline-variant); background: var(--md-surface-container);
      color: var(--md-on-surface); border-radius: 16px; font: inherit; cursor: pointer;
      transition: transform .15s cubic-bezier(.2,.8,.2,1), border-radius .15s, background .15s;
    }
    .ch-promo-btn:active {
      transform: scale(.92); border-radius: 20px;
      background: var(--md-secondary-container); color: var(--md-on-secondary-container);
    }
    .ch-promo-glyph { font-size: 28px; line-height: 1; }
    .ch-promo-name { font-size: 12px; color: var(--md-on-surface-variant); }
    /* 平板分栏（准入③）：≥600px 棋盘左 + 棋谱右，对齐 tp-wide 范式 */
    @media (min-width: 600px) {
      body { padding: 20px; }
      .ch-main.ch-wide { flex-direction: row; align-items: flex-start; justify-content: center; gap: 20px; }
      .ch-board { width: min(52vh, 420px); }
      .ch-panel { max-width: 260px; flex: none; }
      .ch-toolbar, .ch-status { max-width: min(52vh, 420px); }
      .ch-moves { max-height: 420px; }
    }
    /* #261 批 2：≥760 第二断点增强（准入②真布局差异 —— 600 分栏基础上升 grid 双栏 + 棋盘加宽，
       grid-template-columns 为实质布局差异属性，#230 验收用例 3 口径；600~759 区间手机分栏形态零变化） */
    @media (min-width: 760px) {
      body { padding: 24px 28px; }
      .ch-main.ch-wide { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; justify-items: center; }
      .ch-board { width: min(56vh, 480px); }
      .ch-panel { max-width: 320px; width: 100%; }
      .ch-moves { max-height: 520px; }
    }
    /* #261 批 2 I 面：状态层令牌破零（terminal .tm-chip:hover 示范态同款 color-mix，
       :not(:disabled) 门控对齐 #18 §2.1 状态层口径） */
    .ch-btn:hover:not(:disabled),
    .ch-promo-btn:hover { background: color-mix(in srgb, var(--md-state-hover) 100%, var(--md-surface-container)); }
    .ch-btn:active, .ch-promo-btn:active { background: color-mix(in srgb, var(--md-state-pressed) 100%, var(--md-surface-container)); }
  </style>
</head>
<body>
  <div class="ch-toolbar" id="chToolbar">
    <button class="ch-btn" id="chNew">新局</button>
    <button class="ch-btn" id="chUndo">悔棋</button>
    <button class="ch-btn" id="chMode">模式：双人</button>
    <button class="ch-btn" id="chLevel">AI 中</button>
  </div>
  <div class="ch-status" id="chStatus">白方先行 — 点击棋子开始</div>
  <div class="ch-main ch-wide" id="chMain">
    <div class="ch-board" id="chBoard" role="grid" aria-label="国际象棋棋盘"></div>
    <div class="ch-panel">
      <h3>棋谱（SAN）</h3>
      <div class="ch-moves" id="chMoves"></div>
    </div>
  </div>
  <div class="ch-sheet-mask" id="chPromo" hidden>
    <div class="ch-sheet" role="dialog" aria-modal="true" aria-label="选择升变棋子">
      <div class="ch-sheet-title">兵到底线 —— 选择升变棋子</div>
      <div class="ch-promo-row" id="chPromoRow"></div>
    </div>
  </div>
  <script>
    (function () {
      'use strict';
      var C = window.__chessCore;
      var game = C.createGame();
      var mode = 'pvp';            // pvp | ai（ai = 玩家执白）
      var level = 2;               // AI 深度 1/2/3
      var sel = -1;                // 当前选中格
      var lastMove = null;         // [from, to]
      var busy = false;            // AI 思考中锁输入
      var LEVEL_NAME = { 1: 'AI 易', 2: 'AI 中', 3: 'AI 难' };
      // v11.27 #237 —— AI 回合代际令牌：任何「新局 / 切模式 / 悔棋 / 重开」都 gameSeq++，
      // 在途 setTimeout 回调发现代际不符即自我作废（旧实现只靠 busy 布尔，回调内不复核
      // mode/turn/代际 → 新局被幽灵走子、pvp 被替黑方走子、ai 死局三连竞态）。
      var gameSeq = 0;
      var aiTimer = null;          // 在途 AI 定时器句柄（新局可即时撤销，不等 320ms 空窗）
      var pendingPromo = null;     // {from,to} 升变待选（弹层打开期间阻塞棋盘输入）

      var boardEl = document.getElementById('chBoard');
      var statusEl = document.getElementById('chStatus');
      var movesEl = document.getElementById('chMoves');

      // ---------- 棋盘 DOM（#241 键盘可达重构：role=grid + 行容器 display:contents +
      // gridcell + 游走 tabindex；v852 纪律：每次全量重建前 removeChild 清理） ----------
      var cells = [];
      var kbdIdx = 0; // 键盘焦点格锚（游走 tabindex：仅锚格入 Tab 序，方向键步进）
      function buildBoard() {
        while (boardEl.firstChild) boardEl.removeChild(boardEl.firstChild);
        cells.length = 0;
        for (var r = 0; r < 8; r++) {
          var row = document.createElement('div');
          row.className = 'ch-row';
          row.setAttribute('role', 'row');
          for (var f = 0; f < 8; f++) {
            var i = r * 8 + f;
            var d = document.createElement('div');
            d.className = 'ch-cell ' + ((f + r) % 2 === 0 ? 'ch-light' : 'ch-dark');
            d.setAttribute('role', 'gridcell');
            d.setAttribute('aria-selected', 'false');
            (function (idx) { d.addEventListener('click', function () { kbdIdx = idx; onCell(idx); }); })(i); // v10.51 合流增量：点过的格成为键盘步进起点
            row.appendChild(d);
            cells.push(d);
          }
          boardEl.appendChild(row);
        }
      }
      buildBoard();
      var GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }; // 黑形字面+着色（白方描边区分，跨平台字形一致）

      var legalCache = [];
      function statusText(st) {
        if (st === 'checkmate') return (game.turn === 'w' ? '黑方' : '白方') + '将死获胜！';
        if (st === 'stalemate') return '逼和（Stalemate）—— 和棋';
        if (st === 'threefold') return '三次重复局面 —— 和棋';
        if (st === 'fifty-move') return '五十步无进展 —— 和棋';
        if (st === 'insufficient') return '子力不足 —— 和棋';
        if (st === 'check') return (game.turn === 'w' ? '白方' : '黑方') + '被将军！';
        return (game.turn === 'w' ? '白方' : '黑方') + '行棋';
      }
      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = 'ch-status' + (cls ? ' ' + cls : '');
      }

      function render() {
        var hadKbdFocus = !!(document.activeElement && document.activeElement.classList &&
          document.activeElement.classList.contains('ch-cell'));
        buildBoard();
        for (var i = 0; i < 64; i++) {
          var d = cells[i];
          var p = game.board[i];
          if (p) {
            var s = document.createElement('span');
            s.className = 'ch-piece';
            s.textContent = GLYPH[p.t];
            s.setAttribute('aria-hidden', 'true'); // v10.51 合流增量：可访问名由 aria-label 提供，字形不重复朗读
            d.classList.add(p.c === 'w' ? 'ch-w' : 'ch-b');
            d.appendChild(s);
          }
          // v10.51 合流增量：局况后缀（读屏用户不点也能听出可走/可吃/上一步）
          var isLegal = sel >= 0 && legalCache.some(function (m) { return m.to === i; });
          var label = C.cellA11yLabel(i, p);
          if (i === sel) label += '，已选中';
          if (isLegal) label += game.board[i] || isEpTarget(i) ? '，可吃' : '，可走';
          else if (lastMove && (i === lastMove[0] || i === lastMove[1])) label += '，上一步';
          d.setAttribute('aria-label', label);
          d.tabIndex = (i === kbdIdx) ? 0 : -1;
          if (i === sel) { d.classList.add('ch-sel'); d.setAttribute('aria-selected', 'true'); }
          if (lastMove && (i === lastMove[0] || i === lastMove[1])) d.classList.add('ch-last');
          if (isLegal) {
            d.classList.add(game.board[i] || isEpTarget(i) ? 'ch-cap' : 'ch-dot');
          }
        }
        renderMoves();
        // #241：重建后焦点回归（走子/AI 响应重渲染不断键盘链）
        if (hadKbdFocus) cells[kbdIdx].focus();
      }
      // #241 键盘可达：方向键游走焦点（步进纯函数在核，钳制不回绕）
      // + Enter/Space = 点击选格/走子（与点击同链路，升变弹层照常接管）
      boardEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          onCell(kbdIdx);
          return;
        }
        var step = C.focusStep(kbdIdx, e.key);
        if (step !== kbdIdx) {
          e.preventDefault();
          kbdIdx = step;
          for (var i = 0; i < 64; i++) cells[i].tabIndex = (i === kbdIdx) ? 0 : -1;
          cells[kbdIdx].focus();
        }
      });
      function isEpTarget(i) { return game.epTarget === i && sel >= 0 && game.board[sel] && game.board[sel].t === 'p'; }

      function onCell(idx) {
        if (busy || pendingPromo) return;
        var st = C.gameStatus(game);
        if (st !== 'playing' && st !== 'check') return;
        if (mode === 'ai' && game.turn === 'b') return; // AI 模式黑方由 AI 走
        var p = game.board[idx];
        if (sel >= 0) {
          var m = legalCache.filter(function (x) { return x.to === idx; });
          if (m.length) {
            // v11.27 #237：升变不再写死 'q' —— 四选择弹层（核 makeMove 早已支持 r/b/n）
            if (m.some(function (x) { return !!x.promo; })) {
              pendingPromo = { from: sel, to: idx };
              openPromoSheet();
              return;
            }
            var res = C.makeMove(game, sel, idx, null);
            if (res.ok) {
              sel = -1; legalCache = [];
              lastMove = [res.move.from, res.move.to];
              afterMove(res.status);
              return;
            }
          }
        }
        if (p && p.c === game.turn) {
          sel = idx;
          legalCache = C.legalMoves(game, idx);
        } else { sel = -1; legalCache = []; }
        render();
      }

      function afterMove(st) {
        render();
        if (st === 'check') setStatus(statusText(st), 'ch-alert');
        else if (st === 'playing') setStatus(statusText(st), '');
        else { setStatus(statusText(st), 'ch-win'); endGame(st); return; }
        scheduleAi();
      }

      // ---------- AI 回合调度（v11.27 #237 唯一入口：代际令牌 + 即时撤销 + 死局自愈） ----------
      // 旧实现的三个竞态全部源于「回调内不复核」：st=AI 思考中，用户点新局/切双人 →
      // 320ms 后回调照旧在**新局**上替白方走子（幽灵 Nc3）、或 pvp 替黑方走子；
      // 而新局轮到黑方时 onCell 入口拦截 + AI 又只在白走子后才触发 → 人机永久死局。
      // 现在：① 任何状态重置都 gameSeq++ 并 clearTimeout（不靠 busy 布尔）；
      //       ② 回调入口三重校验 seq/game 引用/mode-turn，任一不符即静默退出；
      //       ③ 调度函数可重入（newGame/切模式/悔棋/人机接续都调它），死局天然自愈。
      function cancelAi() {
        if (aiTimer !== null) { clearTimeout(aiTimer); aiTimer = null; }
        busy = false;
      }
      function scheduleAi() {
        cancelAi();
        if (mode !== 'ai' || game.turn !== 'b') return;
        var st = C.gameStatus(game);
        if (st !== 'playing' && st !== 'check') return;
        var seq = gameSeq, ref = game;
        busy = true;
        setStatus('AI 思考中…', '');
        aiTimer = setTimeout(function () {
          aiTimer = null;
          if (seq !== gameSeq || ref !== game) return;       // 代际失效：本回合已作废
          if (mode !== 'ai' || game.turn !== 'b') { busy = false; return; }
          // 难度档叶层随机扰动（#237④）：同分候选随机取一，对局不再可镜像复现；
          // 400ms 时限（迭代加深）= 主线程冻结有上界，超预算自动回退上一层深度。
          var bm = C.bestMove(game, level, { rng: Math.random, jitter: 24, timeBudgetMs: 400 });
          if (seq !== gameSeq || ref !== game) return;       // 思考期间又被重置（长思考防护）
          if (bm) {
            var res = C.makeMove(game, bm.from, bm.to, bm.promotion || null);
            if (res.ok) lastMove = [bm.from, bm.to];
          }
          busy = false;
          var st2 = C.gameStatus(game);
          render();
          if (st2 === 'playing') setStatus(statusText(st2), '');
          else if (st2 === 'check') setStatus(statusText(st2), 'ch-alert');
          else { setStatus(statusText(st2), 'ch-win'); endGame(st2); }
        }, 320);
      }

      // ---------- 升变四选择弹层（v11.27 #237② · MD3 底部弹层，全 --md-* 令牌） ----------
      var PROMO_GLYPH = { q: '♛', r: '♜', b: '♝', n: '♞' };
      var PROMO_NAME = { q: '后', r: '车', b: '象', n: '马' };
      function openPromoSheet() {
        var mask = document.getElementById('chPromo');
        var row = document.getElementById('chPromoRow');
        while (row.firstChild) row.removeChild(row.firstChild);
        ['q', 'r', 'b', 'n'].forEach(function (t) {
          var b = document.createElement('button');
          b.className = 'ch-promo-btn';
          b.type = 'button';
          b.dataset.piece = t;
          b.innerHTML = '<span class="ch-promo-glyph">' + PROMO_GLYPH[t] + '</span><span class="ch-promo-name">' + PROMO_NAME[t] + '</span>';
          b.addEventListener('click', function () { pickPromotion(t); });
          row.appendChild(b);
        });
        mask.hidden = false;
        var first = row.querySelector('button');
        if (first) first.focus();
      }
      function closePromoSheet() {
        var mask = document.getElementById('chPromo');
        if (mask) mask.hidden = true;
        pendingPromo = null;
      }

      // ---------- #261 批 2 D 面：升变选择行整排按压联动（pressRipple：中心 0.9 压扁 + 邻项按距离
      // 衰减让位 + 圆角形变融合，tile-bounce.js Bounceable 数学同构轻量版，word 三键行/stt 语言行同款；
      // 工具行 CSS :has 整排挤压既有超越项保留，不同容器零冲突） ----------
      (function () {
        var promoRow = document.getElementById('chPromoRow');
        if (!promoRow) return;
        function pressReset() {
          promoRow.querySelectorAll('.ch-promo-btn').forEach(function (k) { k.style.transform = ''; k.style.borderRadius = ''; });
        }
        promoRow.addEventListener('pointerdown', function (e) {
          var btns = Array.prototype.slice.call(promoRow.querySelectorAll('.ch-promo-btn'));
          var idx = btns.indexOf(e.target.closest('.ch-promo-btn'));
          if (idx < 0) return;
          btns.forEach(function (k, j) {
            var d = Math.abs(j - idx);
            var f = d === 0 ? 1 : Math.max(0, 1 - d * 0.45);
            var sc = d === 0 ? 0.9 : 1 - 0.04 * f;
            var shift = d === 0 ? 0 : (j < idx ? 1 : -1) * 2 * f;
            k.style.transform = 'translateX(' + shift + 'px) scale(' + sc + ')';
            if (d === 0) k.style.borderRadius = '10px';
          });
        });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
          promoRow.addEventListener(ev, pressReset);
        });
      })();
      function pickPromotion(t) {
        if (!pendingPromo) return;
        var from = pendingPromo.from, to = pendingPromo.to;
        closePromoSheet();
        var res = C.makeMove(game, from, to, t);
        sel = -1; legalCache = [];
        if (res.ok) {
          lastMove = [res.move.from, res.move.to];
          afterMove(res.status);
        } else { render(); }
      }

      // v10.51 合流增量：升变弹层 Esc 取消本次走子（建议2 chess 面；焦点在弹层按钮，冒泡到 mask）
      document.getElementById('chPromo').addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closePromoSheet(); render(); }
      });

      // ---------- 终局：VFS 棋谱存档 + 系统通知（准入④，fire-and-forget 静默） ----------
      function endGame(st) {
        var record = {
          format: 'md3-chess-game', v: 1,
          at: Date.now(), mode: mode, level: mode === 'ai' ? level : null,
          result: st, san: game.sanHistory.slice(),
        };
        try {
          var p = window.__system.fs.write('/documents/chess/game_' + Date.now() + '.json',
            JSON.stringify(record), { mime: 'application/json' });
          if (p && p.catch) p.catch(function () { /* 静默：不阻塞终局展示 */ });
        } catch (e) { /* SDK 未就绪静默 */ }
        try {
          if (window.__system && typeof window.__system.notify === 'function') {
            window.__system.notify('国际象棋', '对局结束：' + statusText(st) + '，棋谱已存档');
          }
        } catch (e) { /* 静默 */ }
      }

      function renderMoves() {
        while (movesEl.firstChild) movesEl.removeChild(movesEl.firstChild);
        if (!game.sanHistory.length) { // #314 V7 空状态：着法史空态占位（真 UX，非注释凑数）
          var empty = document.createElement('div');
          empty.className = 'ch-moves-empty';
          empty.textContent = '暂无着法，走子后自动记录';
          movesEl.appendChild(empty);
          return;
        }
        for (var i = 0; i < game.sanHistory.length; i += 2) {
          var no = document.createElement('span'); no.className = 'ch-no'; no.textContent = (i / 2 + 1) + '.';
          var w = document.createElement('span'); w.className = 'ch-san'; w.textContent = game.sanHistory[i] || '';
          var b = document.createElement('span'); b.className = 'ch-san'; b.textContent = game.sanHistory[i + 1] || '';
          movesEl.appendChild(no); movesEl.appendChild(w); movesEl.appendChild(b);
        }
        movesEl.scrollTop = movesEl.scrollHeight;
      }

      // ---------- 工具栏 ----------
      document.getElementById('chNew').addEventListener('click', function () {
        gameSeq++; cancelAi(); closePromoSheet();       // 代际作废：在途 AI 回合作废（不再幽灵走子）
        game = C.createGame(); sel = -1; lastMove = null; legalCache = [];
        setStatus('白方先行 — 点击棋子开始', ''); render();
      });
      document.getElementById('chUndo').addEventListener('click', function () {
        if (pendingPromo) { closePromoSheet(); render(); return; }
        gameSeq++; cancelAi();
        C.undoMove(game);
        if (mode === 'ai' && game.turn === 'b') C.undoMove(game); // AI 模式悔一整回合
        sel = -1; lastMove = null; legalCache = [];
        var st = C.gameStatus(game);
        setStatus(statusText(st), st === 'check' ? 'ch-alert' : '');
        render();
        scheduleAi();                                   // 悔棋后若轮到 AI（人机首着被悔）自动续走
      });
      document.getElementById('chMode').addEventListener('click', function (e) {
        gameSeq++; cancelAi(); closePromoSheet();        // 切模式同样作废在途 AI 回合
        mode = mode === 'pvp' ? 'ai' : 'pvp';
        e.currentTarget.textContent = mode === 'pvp' ? '模式：双人' : '模式：人机（执白）';
        e.currentTarget.classList.toggle('ch-on', mode === 'ai');
        sel = -1; legalCache = [];
        setStatus(statusText(C.gameStatus(game)), '');
        render();
        scheduleAi();                                    // 轮到黑方则立即接续，不再依赖白走子触发
      });
      document.getElementById('chLevel').addEventListener('click', function (e) {
        if (mode !== 'ai') { setStatus('切换到人机模式后可选难度', ''); return; }
        level = level >= 3 ? 1 : level + 1;
        e.currentTarget.textContent = LEVEL_NAME[level];
      });

      // ---------- 无头观测钩子（__sttTest 先例：IIFE 内部态外部驱动，e2e 用） ----------
      window.__chessTest = {
        state: function () {
          return {
            turn: game.turn, status: C.gameStatus(game), san: game.sanHistory.slice(),
            mode: mode, level: level, busy: busy, seq: gameSeq,
            promoOpen: !!(pendingPromo), aiPending: aiTimer !== null,
          };
        },
        move: function (from, to) { onCell(C.parseSquare(from)); onCell(C.parseSquare(to)); return C.gameStatus(game); },
        setMode: function (m, lv) {
          mode = m; if (lv) level = lv;
          gameSeq++; cancelAi();
          document.getElementById('chMode').textContent = mode === 'pvp' ? '模式：双人' : '模式：人机（执白）';
          scheduleAi();
        },
        pickPromotion: function (t) { pickPromotion(t); },
        a11y: function () {  // v10.51 合流增量：无头观测（__sttTest 先例）
          return {
            grid: boardEl.getAttribute('role'),
            rows: boardEl.querySelectorAll('[role="row"]').length,
            gridcells: boardEl.querySelectorAll('[role="gridcell"]').length,
            roving: kbdIdx,
            tabbables: cells.filter(function (c) { return c.tabIndex === 0; }).length,
            a1Label: cells[56] ? cells[56].getAttribute('aria-label') : null,
          };
        },
        newGame: function () { document.getElementById('chNew').click(); },
        // 无头化局面装载（仅供 e2e：升变/子力不足等需特定局面的用例，正常运行不调用）
        loadFen: function (fen) {
          var b = new Array(64).fill(null);
          fen.split(' ')[0].split('/').forEach(function (row, r) {
            var f = 0;
            for (var i = 0; i < row.length; i++) {
              var ch = row[i];
              if (/\d/.test(ch)) { f += parseInt(ch, 10); continue; }
              b[r * 8 + f] = { c: ch === ch.toUpperCase() ? 'w' : 'b', t: ch.toLowerCase() };
              f++;
            }
          });
          gameSeq++; cancelAi(); closePromoSheet();
          game = C.createGame(); game.board = b; game.turn = fen.split(' ')[1] || 'w';
          game.sanHistory = []; game.snapHistory = [];
          sel = -1; lastMove = null; legalCache = [];
          setStatus(statusText(C.gameStatus(game)), '');
          render();
          return C.gameStatus(game);
        },
      };

      render();
    })();
  </script>
</body>
</html>
