<!DOCTYPE html> <html lang="zh-CN" data-theme-mode="dark"> <head><script src="../freeze-shim.js"></script> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"> <title>代码编辑器</title> <link rel="stylesheet" href="../_shared/md3-tokens.css"> <script src="../../js/code-editor-core.js"></script> <style>:root{--ce-bg:var(--md-surface);--ce-panel:rgba(0,0,0,.22);--ce-text:var(--md-on-surface);--ce-dim:var(--md-on-surface-variant);--ce-accent:var(--md-primary);--ce-on-accent:var(--md-on-primary, #062e6f);--ce-line:var(--md-outline-variant, rgba(255,255,255,.12));--ce-chip:var(--md-secondary-container);--ce-chip-text:var(--md-on-secondary-container);--ce-err:var(--md-error, #f2b8b5);--ce-ok:var(--md-tertiary, #efb8c8);--ce-mono:'Roboto Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body,html{height:100%}body{margin:0;overflow:hidden;background:var(--ce-bg);color:var(--ce-text);font-family:var(--md-font, var(--md-text-font, system-ui, sans-serif))}.ce-app{position:absolute;inset:0;display:flex;flex-direction:column}.ce-head{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;flex:0 0 auto}.ce-title{margin:0;font-size:17px;font-weight:700;letter-spacing:.3px;white-space:nowrap}.ce-file{flex:1;min-width:0;font-family:var(--ce-mono);font-size:11.5px;color:var(--ce-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}.ce-dirtydot{width:7px;height:7px;border-radius:50%;background:var(--ce-ok);flex:0 0 auto;opacity:0;transition:opacity 160ms}.ce-dirtydot.on{opacity:1}.ce-btn{border:1px solid var(--ce-line);background:0 0;color:var(--ce-dim);font-size:11px;padding:5px 11px;border-radius:999px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:transform 130ms cubic-bezier(.34,1.56,.64,1),color 160ms,border-color 160ms}.ce-btn:active{transform:scale(.92)}.ce-btn.primary{background:var(--ce-accent);color:var(--ce-on-accent);border-color:transparent;font-weight:700}.ce-btn.on{color:var(--ce-ok);border-color:var(--ce-ok)}.ce-body{flex:1 1 auto;min-height:0;display:flex;gap:8px;padding:0 10px}.ce-side{flex:0 0 200px;min-width:0;display:flex;flex-direction:column;gap:6px;border:1px solid var(--ce-line);border-radius:12px;background:var(--ce-panel);padding:8px;overflow:auto}.ce-side-head{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:0 0 auto}.ce-side-label{font-size:9.5px;color:var(--ce-dim);letter-spacing:1.2px}.ce-side-refresh{border:none;background:0 0;color:var(--ce-dim);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:6px;line-height:1}.ce-side-refresh:active{transform:scale(.88)}.ce-tree{display:flex;flex-direction:column;gap:1px}.ce-node{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:8px;font-family:var(--ce-mono);font-size:11.5px;color:var(--ce-text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:26px}.ce-node:hover{background:rgba(255,255,255,.05)}.ce-node.active{background:var(--ce-chip);color:var(--ce-chip-text)}.ce-node .ico{flex:0 0 auto;font-size:11px;width:14px;text-align:center}.ce-node.dir .ico{color:var(--ce-accent)}.ce-node.file .ico{color:var(--ce-dim)}.ce-node .nm{overflow:hidden;text-overflow:ellipsis}.ce-node .sz{margin-left:auto;font-size:9px;color:var(--ce-dim);flex:0 0 auto}.ce-tree-empty{font-size:10.5px;color:var(--ce-dim);padding:8px 7px;line-height:1.6}.ce-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;border:1px solid var(--ce-line);border-radius:12px;background:var(--ce-panel);overflow:hidden}.ce-host{flex:1 1 auto;min-height:0;overflow:hidden;position:relative}.ce-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ce-dim);font-size:12.5px;padding:20px;text-align:center;line-height:1.7;z-index:5;pointer-events:none}.ce-empty.hide{display:none}.ce-empty b{font-size:15px;color:var(--ce-text)}.ce-empty .kbd{font-family:var(--ce-mono);font-size:10.5px;border:1px solid var(--ce-line);border-radius:6px;padding:2px 7px}.ce-host .cm-editor{height:100%}.ce-host .cm-scroller{overflow:auto}.ce-status{display:flex;align-items:center;gap:12px;padding:6px 14px 8px;flex:0 0 auto;font-family:var(--ce-mono);font-size:10px;color:var(--ce-dim);overflow:hidden}.ce-status .sp{flex:1}.ce-status .cell{white-space:nowrap}.ce-status .save-ok{color:var(--ce-ok)}.ce-status .save-warn{color:var(--ce-err)}.ce-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}.ce-modal.show{display:flex}.ce-sheet{background:var(--md-surface-container,#211f26);border:1px solid var(--ce-line);border-radius:20px;padding:18px 18px 16px;width:min(360px,92vw);display:flex;flex-direction:column;gap:10px}.ce-sheet h2{margin:0;font-size:15px;font-weight:700}.ce-sheet .hint{font-size:11px;color:var(--ce-dim);line-height:1.6;margin:0}.ce-sheet input{background:rgba(0,0,0,.24);border:1px solid var(--ce-line);color:var(--ce-text);border-radius:10px;padding:9px 12px;font-family:var(--ce-mono);font-size:12.5px;outline:0;width:100%}.ce-sheet input:focus{border-color:var(--ce-accent)}.ce-sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}.ce-err{font-size:11px;color:var(--ce-err);min-height:1.2em;font-family:var(--ce-mono)}.ce-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:var(--ce-chip);color:var(--ce-chip-text);font-size:12px;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity 180ms,transform 180ms;max-width:82vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:50}.ce-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media (max-width:560px){.ce-side{display:none}}</style> </head> <body> <div class="ce-app"> <div class="ce-head"> <h1 class="ce-title">代码编辑器</h1> <div class="ce-file"><span class="ce-dirtydot" id="ceDirtyDot"></span><span id="ceFileName">未打开文件</span></div> <button class="ce-btn" id="ceLangChip" data-test="ce-lang" title="按扩展名自动识别">纯文本</button> <button class="ce-btn" id="ceWrapBtn" data-test="ce-wrap" title="自动换行开关">换行</button> <button class="ce-btn" id="ceFontBtn" data-test="ce-font" title="字号">14px</button> <button class="ce-btn" id="ceNewBtn" data-test="ce-new">新建</button> <button class="ce-btn" id="ceSaveAsBtn" data-test="ce-saveas">另存</button> <button class="ce-btn primary" id="ceSaveBtn" data-test="ce-save">保存</button> </div> <div class="ce-body"> <div class="ce-side" id="ceSide"> <div class="ce-side-head"> <span class="ce-side-label">VFS 文件树</span> <button class="ce-side-refresh" id="ceRefreshBtn" data-test="ce-refresh" title="刷新">⟳</button> </div> <div class="ce-tree" id="ceTree"></div> </div> <div class="ce-main"> <div class="ce-host" id="ceHost"></div> <div class="ce-empty" id="ceEmpty"> <b>选择一个文件开始编辑</b> <span>从左侧 VFS 文件树打开，或新建文件<br>js / html / css / python 四语言高亮</span> <span><span class="kbd">Ctrl+S</span> 保存 · <span class="kbd">Tab</span> 缩进</span> </div> </div> </div> <div class="ce-status"> <span class="cell" id="ceStPath" data-test="ce-st-path">—</span> <span class="sp"></span> <span class="cell" id="ceStPos" data-test="ce-st-pos">Ln 1, Col 1</span> <span class="cell" id="ceStLines" data-test="ce-st-lines">0 行</span> <span class="cell" id="ceStSize" data-test="ce-st-size">—</span> <span class="cell" id="ceStSave" data-test="ce-st-save">就绪</span> </div> </div> <div class="ce-modal" id="ceModal"> <div class="ce-sheet"> <h2 id="ceModalTitle">新建文件</h2> <p class="hint" id="ceModalDir">目录：/documents</p> <input id="ceModalInput" data-test="ce-modal-input" placeholder="例如 notes.js" spellcheck="false" autocapitalize="off"> <div class="ce-err" id="ceModalErr"></div> <div class="row"> <button class="ce-btn" id="ceModalCancel">取消</button> <button class="ce-btn primary" id="ceModalOk" data-test="ce-modal-ok">确定</button> </div> </div> </div> <div class="ce-toast" id="ceToast"></div> <script>window.__ceDeepLink=window.__ceDeepLink||[],window.addEventListener("message",function(e){try{var n=e.data;if(!n||"BUS_DELIVER"!==n.type||"code-editor/open"!==n.event)return;window.__ceDeepLink.push(n.payload)}catch(e){}})</script> <script type="module" src="./app.mjs"></script> </body> </html>
