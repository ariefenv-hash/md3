<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="../freeze-shim.js"></script>
<script src="../_shared/sanitize.js"></script>
<script src="../_shared/dialog-a11y.js"></script> <!-- #241 建议2：弹层三件套（Esc 可关 + 焦点陷阱 + 焦点恢复） --> <!-- #240：__mdEscape 单一转义真源 -->
<!-- v7.77 M3E 扩场景：AOSP 边缘拉伸（main 内滚容器；FAB 在 main 外不受形变影响） -->
<script src="../_shared/stretch.js" data-stretch="main"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD3 通讯录</title>
  <link rel="stylesheet" href="../_shared/md3-tokens.css">
  <link rel="stylesheet" href="../_shared/idle-slider.css">
<style>
    /* ===== 精简 MD3 令牌 ===== */
    * { box-sizing: border-box; margin: 0; }
    :root {
      /* 色相令牌 --md-h 由宿主主题引擎动态注入（无宿主时回落到 Material 基准紫 262） */
      --md-h: 262;
      /* v7.26 MD3 统一：短名令牌全部引用规范角色，随宿主色相与明暗联动 */
      --primary: var(--md-primary);
      --on-primary: var(--md-on-primary);
      --primary-container: var(--md-primary-container);
      --on-primary-container: var(--md-on-primary-container);
      --surface: var(--md-surface);
      --surface-variant: var(--md-surface-container-high);
      --on-surface: var(--md-on-surface);
      --on-surface-variant: var(--md-on-surface-variant);
      --outline: var(--md-outline);
      --error: var(--md-error);
      --corner-full: 9999px;
      --corner-lg: 16px;
      --font: var(--md-text-font);
    }
    body {
      font-family: var(--font);
      background: var(--md-surface);
      color: var(--md-on-surface);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin: 0;
    }
    /* ===== 顶栏 ===== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--md-surface-container-high);
      background: var(--md-surface);
      flex-shrink: 0;
    }
    .top-bar h1 { font: 400 24px/32px var(--font); }
    .icon-btn {
      background: none;
      border: none;
      padding: 10px;
      border-radius: var(--corner-full);
      cursor: pointer;
      color: var(--md-on-surface-variant);
      transition: background .2s;
    }
    .icon-btn:hover { background: rgba(29,27,32,.08); }
    .icon-btn svg { display: block; width: 24px; height: 24px; fill: currentColor; }

    /* ===== 搜索 ===== */
    .search-wrap {
      padding: 0 16px 12px;
      background: var(--md-surface);
      display: none;
      flex-shrink: 0;
    }
    .search-wrap.open { display: block; }
    .search-bar {
      display: flex;
      align-items: center;
      background: var(--md-surface-container-high);
      border-radius: var(--corner-full);
      padding: 0 16px;
      height: 48px;
    }
    .search-bar svg { fill: var(--md-on-surface-variant); margin-right: 10px; }
    .search-bar input {
      border: none;
      background: transparent;
      flex: 1;
      height: 100%;
      font: 400 16px/24px var(--font);
      color: var(--md-on-surface);
      outline: none;
    }

    /* ===== 主区域 ===== */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 80px;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }
    .empty {
      text-align: center;
      margin-top: 60px;
      color: var(--md-on-surface-variant);
    }
    .empty svg { width: 64px; height: 64px; fill: var(--md-surface-container-high); }
    .empty p { font: 400 16px/24px var(--font); }

    /* ===== 联系人卡片 ===== */
    .list { display: grid; gap: 8px; }
    .card {
      background: var(--md-surface);
      border: 1px solid var(--md-surface-container-high);
      border-radius: var(--corner-lg);
      padding: calc(12px * var(--density-scale, 1)) calc(16px * var(--density-scale, 1));
      gap: calc(14px * var(--density-scale, 1));
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: background .15s;
    }
    .card:hover { background: var(--md-surface-container-high); }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--corner-full);
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      font: 500 22px/1 var(--font);
      flex-shrink: 0;
      user-select: none;
    }
    .info { flex: 1; min-width: 0; }
    .info h3 {
      font: 500 16px/24px var(--font);
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .info p {
      font: 400 14px/20px var(--font);
      color: var(--md-on-surface-variant);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .info .note { font-size: 12px; opacity: .7; }
    .actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .actions a, .actions button {
      background: none;
      border: none;
      padding: 6px;
      border-radius: var(--corner-full);
      cursor: pointer;
      color: var(--md-on-surface-variant);
      display: flex;
      transition: background .15s,color .15s;
    }
    .actions a:hover, .actions button:hover { background: rgba(29,27,32,.08); }
    .actions .del:hover { color: var(--md-error); background: rgba(179,38,30,.08); }
    .actions svg { width: 20px; height: 20px; fill: currentColor; }

    /* ===== FAB ===== */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: var(--md-r-md, 16px);
      border: none;
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      box-shadow: 0 4px 8px rgba(0,0,0,.2);
      cursor: pointer;
      transition: all .2s;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fab:hover { transform: scale(1.04); background: var(--md-secondary-container); }
    .fab:active { transform: scale(.94); }
    .fab svg { width: 28px; height: 28px; fill: currentColor; }

    /* ===== 模态框 ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .25s;
    }
    .overlay.open { display: flex; opacity: 1; }
    .dialog {
      background: var(--md-surface);
      border-radius: var(--md-r-xl, 28px);
      padding: 24px;
      width: 92%;
      max-width: 380px;
      transform: scale(.92);
      transition: transform .2s;
    }
    .overlay.open .dialog { transform: scale(1); }
    .dialog h2 { font: 400 24px/32px var(--font); margin: 0 0 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font: 500 12px/16px var(--font); color: var(--md-primary); margin-bottom: 2px; }
    .field input, .field textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--md-outline);
      border-radius: 4px;
      background: transparent;
      font: 400 16px/24px var(--font);
      color: var(--md-on-surface);
      transition: border .2s;
    }
    .field input:focus, .field textarea:focus {
      border-color: var(--md-primary);
      border-width: 2px;
      padding: 9px 13px;
      outline: none;
    }
    .actions-dialog {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }
    .btn {
      padding: 8px 20px;
      border-radius: var(--md-r-lg, 20px);
      border: none;
      font: 500 14px/20px var(--font);
      cursor: pointer;
      transition: background .2s;
    }
    .btn-text { background: transparent; color: var(--md-primary); }
    .btn-text:hover { background: rgba(103,80,164,.08); }
    .btn-filled { background: var(--md-primary); color: var(--md-on-primary); }
    .btn-filled:hover { opacity: .9; }

    /* ===== Snackbar ===== */
    .snack {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--md-surface-container-highest);
      color: var(--md-on-surface);
      padding: 10px 20px;
      border-radius: 4px;
      font: 400 14px/20px var(--font);
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      opacity: 0;
      transition: all .3s cubic-bezier(.4,0,.2,1);
      z-index: 300;
      white-space: nowrap;
    }
    .snack.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ==================== #181 第三批整改 v9.48（#179 六条准入） ====================
       ①令牌：短名令牌全量规范角色既有达标（14 处 var(--md-）+ --md-surface-container-highest 语义补齐；
       ②响应式：max-width:400px 手机紧凑 + min-width:760px 平板两套布局；
       ③平板分栏：760px+ grid 左列表右【详情面板】（AOSP Contacts 两栏形态：点击联系人右侧渲染详情卡，
         手机态点击=直接呼叫零变化，详情面板 display:none 零变化）；
       ④SDK：通讯录备份镜像 VFS /documents/contacts-backup.json（__system.fs）+ 新增联系人 __system.notify
         + openApp 深链既有接入保留；
       ⑤形态语言：列表密度怠速柄滑条（.mdslider 细竖条怠速/hover 胶囊展开，--p 同步 + localStorage 持久化）
         + 联系人卡片纵向按压联动（pressRipple Y 轴让位版，圆角按基准形状形变）。 */
    #detailPane { display: none; }
    .density-row { display: flex; align-items: center; gap: 8px; padding: 6px 16px 2px; border-bottom: 1px solid var(--md-surface-container-high); flex-shrink: 0; }
    .density-row .lab { font-size: 12px; color: var(--md-on-surface-variant); white-space: nowrap; }
    .density-row #densityVal { font-size: 12px; color: var(--md-primary); font-variant-numeric: tabular-nums; min-width: 30px; }
/* v10.93 #227 滑块单源化：几何/轨道/拇指/focus/disabled 视觉规范已收编
           _shared/idle-slider.css（单一组件源，audit D 门禁禁止本地滑块伪元素）；
           此处仅保留布局与应用主题令牌映射 */
        .mdslider { width: 104px; --md-primary: var(--primary); --md-background: var(--surface); }

  /* 开屏入场动效（#308 批 4；曲线令牌消费口径同 #239 组） */
  @keyframes ct-list-in{from{opacity:0;transform:translateY(8px)}}
  .list{animation:ct-list-in var(--md-duration-medium,400ms) var(--md-easing-emphasized-decelerate, cubic-bezier(0.05,0.7,0.1,1)) both}
    @media (max-width: 400px) {
      .density-row { flex-wrap: wrap; }
    }
    @media (min-width: 760px) {
      body { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto auto auto 1fr; }
      .top-bar { grid-column: 1 / -1; grid-row: 1; }
      .density-row { grid-column: 1 / -1; grid-row: 2; }
      .search-wrap { grid-column: 1; grid-row: 3; }
      body > main { grid-column: 1; grid-row: 4; min-height: 0; }
      #detailPane { display: flex; flex-direction: column; grid-column: 2; grid-row: 1 / -1; border-left: 1px solid var(--md-surface-container-high); background: var(--md-surface); min-height: 0; }
      #detailPane .detail-empty { margin: auto; text-align: center; color: var(--md-on-surface-variant); font-size: 14px; padding: 24px; }
      #detailPane .detail-card { padding: 24px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
      #detailPane .detail-head { display: flex; align-items: center; gap: 14px; }
      #detailPane .detail-head .avatar { width: 56px; height: 56px; font-size: 24px; }
      #detailPane .detail-head h2 { font: 500 20px/28px var(--font); }
      #detailPane .detail-field { padding: 12px 16px; border-radius: var(--md-r-sm, 12px); background: var(--md-surface-container-high); }
      #detailPane .detail-field .k { font-size: 12px; color: var(--md-on-surface-variant); margin-bottom: 2px; }
      #detailPane .detail-field .v { font-size: 15px; font-weight: 500; }
    }
  

    /* V4 状态层（#306 批 2）：按压态令牌（#262 批 1 photos 先例同款），悬停/静态零变化 */
    .fab:active { background: var(--md-state-pressed, rgba(255,255,255,0.12)); }
    .icon-btn:active { background: var(--md-state-pressed, rgba(255,255,255,0.12)); }

</style>
</head>
<body>

<!-- 顶栏 -->
<header class="top-bar">
  <h1>通讯录</h1>
  <button class="icon-btn" id="searchToggle" aria-label="搜索">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
  </button>
</header>

<!-- 搜索条 -->
<div class="search-wrap" id="searchWrap">
  <div class="search-bar">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="searchInput" placeholder="搜索联系人...">
  </div>
</div>

<!-- #181 ⑤：列表密度怠速柄滑条 -->
<div class="density-row">
  <span class="lab">列表密度</span>
  <input type="range" class="mdslider" id="densitySlider" min="0.85" max="1.3" step="0.05" value="1" aria-label="列表密度">
  <span id="densityVal">1.00×</span>
</div>

<!-- 主列表 -->
<main>
  <div id="list" class="list"></div>
  <div id="empty" class="empty" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
    <p>暂无联系人</p>
    <p style="font-size:14px;">点击右下角按钮添加</p>
  </div>
</main>

<!-- #181 ③平板分栏：详情常驻面板（手机态 display:none 零变化） -->
<aside id="detailPane" aria-label="联系人详情面板">
  <div class="detail-empty">点击左侧联系人查看详情</div>
</aside>

<!-- FAB -->
<button class="fab" id="fabAdd" aria-label="添加联系人">
  <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
</button>

<!-- 模态框 -->
<div class="overlay" id="modalOverlay">
  <div class="dialog">
    <h2 id="modalTitle">新联系人</h2>
    <form id="contactForm">
      <div class="field"><label>姓名 *</label><input type="text" id="inputName" required placeholder="张三" autocomplete="off"></div>
      <div class="field"><label>电话 *</label><input type="tel" id="inputPhone" required placeholder="13800138000" pattern="[0-9\-]*"></div>
      <div class="field"><label>电子邮箱</label><input type="email" id="inputEmail" placeholder="name@example.com"></div>
      <div class="field"><label>备注</label><textarea id="inputNote" rows="2" placeholder="添加更多信息…"></textarea></div>
      <div class="actions-dialog">
        <button type="button" class="btn btn-text" id="btnCancel">取消</button>
        <button type="submit" class="btn btn-filled">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- Snackbar -->
<div id="snack" class="snack">操作成功</div>

<script>
  (() => {
    // ===== 数据 =====
    const KEY = 'md3_contacts';
    let contacts = [];

    // ===== DOM =====
    const $list = document.getElementById('list');
    const $empty = document.getElementById('empty');
    const $modal = document.getElementById('modalOverlay');
    const $form = document.getElementById('contactForm');
    const $name = document.getElementById('inputName');
    const $phone = document.getElementById('inputPhone');
    const $email = document.getElementById('inputEmail');
    const $note = document.getElementById('inputNote');
    const $fab = document.getElementById('fabAdd');
    const $cancel = document.getElementById('btnCancel');
    const $searchToggle = document.getElementById('searchToggle');
    const $searchWrap = document.getElementById('searchWrap');
    const $searchInput = document.getElementById('searchInput');
    const $snack = document.getElementById('snack');

    // ===== 工具 =====
    const esc = s => window.__mdEscape(s); // #240：本地 charmap 退役，单一转义真源在 _shared/sanitize.js
    const toast = msg => { $snack.textContent=msg; $snack.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>$snack.classList.remove('show'),2600); };
    const save = () => {
      localStorage.setItem(KEY, JSON.stringify(contacts));
      // #181 ④SDK：通讯录备份镜像 VFS（fsAvailable 守卫，直开降级静默）
      try {
        if (window.__system && window.__system.fs) {
          window.__system.fs.write('/documents/contacts-backup.json', JSON.stringify(contacts), { mime: 'application/json' });
        }
      } catch (e) {}
    };
    const load = () => {
      try { const d = localStorage.getItem(KEY); contacts = d ? JSON.parse(d) : []; } catch { contacts = []; }
      if (!contacts.length) contacts = [{ id: Date.now(), name: '设计指南', phone: '10086', email: 'md3@google.com', note: 'Material Design 3' }];
      save();
    };
    const genId = () => Date.now() + Math.random();

    // #181 ⑤：列表密度怠速柄滑条（mdslider，--p 同步 + localStorage 持久化）
    const DENSITY_KEY = 'ios-desktop:contacts-density-v1';
    (function initDensity() {
      const el = document.getElementById('densitySlider');
      const val = document.getElementById('densityVal');
      if (!el || !val) return;
      const syncP = () => {
        const p = ((parseFloat(el.value) - 0.85) / (1.3 - 0.85) * 100).toFixed(1) + '%';
        el.style.setProperty('--p', p);
      };
      try {
        const v = parseFloat(localStorage.getItem(DENSITY_KEY));
        if (v >= 0.85 && v <= 1.3) el.value = v;
      } catch (e) {}
      document.documentElement.style.setProperty('--density-scale', el.value);
      val.textContent = parseFloat(el.value).toFixed(2) + '×';
      syncP();
      el.addEventListener('input', () => {
        document.documentElement.style.setProperty('--density-scale', el.value);
        val.textContent = parseFloat(el.value).toFixed(2) + '×';
        try { localStorage.setItem(DENSITY_KEY, el.value); } catch (e) {}
        syncP();
      });
    })();

    // #181 ⑤：联系人卡片纵向按压联动（pressRipple Y 轴让位版：按压者压缩+圆角形变，
    // 邻项按距离衰减让位——tile-bounce Bounceable 数学同构轻量版，事件委托覆盖动态列表）
    const RIPPLE_CARD_R = 16;
    function pressRippleCards(originEl) {
      const cards = Array.from(document.querySelectorAll('#list .card'));
      const oi = cards.indexOf(originEl);
      if (oi < 0) return;
      cards.forEach((k, i) => {
        const d = Math.abs(i - oi);
        const f = d === 0 ? 1 : Math.max(0, 1 - d * 0.45);
        const sc = d === 0 ? 0.97 : 1 - 0.02 * f;
        const shift = d === 0 ? 0 : (i < oi ? 1 : -1) * 2 * f;
        k.style.transform = `translateY(${shift.toFixed(1)}px) scale(${sc.toFixed(3)})`;
        k.style.borderRadius = (d === 0 ? RIPPLE_CARD_R + 8 : RIPPLE_CARD_R - 4 * f) + 'px';
        k.style.zIndex = d === 0 ? '1' : '';
      });
    }
    function releaseRippleCards() {
      document.querySelectorAll('#list .card').forEach(k => { k.style.transform = ''; k.style.borderRadius = ''; k.style.zIndex = ''; });
    }
    document.addEventListener('pointerdown', e => {
      const card = e.target.closest('#list .card');
      if (card) pressRippleCards(card);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => document.addEventListener(ev, releaseRippleCards));

    // #181 ③：平板详情面板渲染（手机态 display:none 隐藏时点击直接呼叫零变化）
    function renderDetail(c) {
      const pane = document.getElementById('detailPane');
      if (!pane || !c) return;
      const hue = (Array.from(c.name).reduce((a, b) => a + b.charCodeAt(0), 0) % 360);
      pane.innerHTML = `
        <div class="detail-card">
          <div class="detail-head">
            <div class="avatar" style="background:hsl(${hue},60%,85%);color:#21005D">${esc(c.name.charAt(0).toUpperCase())}</div>
            <h2>${esc(c.name)}</h2>
          </div>
          <div class="detail-field"><div class="k">电话</div><div class="v">${esc(c.phone)}</div></div>
          ${c.email ? `<div class="detail-field"><div class="k">电子邮箱</div><div class="v">${esc(c.email)}</div></div>` : ''}
          ${c.note ? `<div class="detail-field"><div class="k">备注</div><div class="v">${esc(c.note)}</div></div>` : ''}
        </div>`;
    }
    const isWide = () => window.matchMedia('(min-width: 760px)').matches;

    // ===== 渲染 =====
    const render = (filter = '') => {
      const f = filter.trim().toLowerCase();
      const filtered = contacts.filter(c => c.name.toLowerCase().includes(f) || c.phone.includes(f));
      $list.innerHTML = '';
      if (!filtered.length) { $empty.style.display = 'block'; return; }
      $empty.style.display = 'none';
      filtered.forEach(c => {
        const hue = (Array.from(c.name).reduce((a,b)=>a+b.charCodeAt(0),0) % 360);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="avatar" style="background:hsl(${hue},60%,85%);color:#21005D">${esc(c.name.charAt(0).toUpperCase())}</div>
          <div class="info">
            <h3>${esc(c.name)}</h3>
            <p>${esc(c.phone)}</p>
            ${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}
          </div>
          <div class="actions">
            <button class="act" data-act-link="call" data-name="${esc(c.name)}" data-phone="${esc(c.phone)}" aria-label="拨打"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 1.23 0 2.44.2 3.57.57.35.13.75.04 1.02-.24l2.2-2.2z"/></svg></button>
            <button class="act" data-act-link="sms" data-name="${esc(c.name)}" data-phone="${esc(c.phone)}" aria-label="发短信"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></button>
            <button class="del" data-id="${c.id}" aria-label="删除"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
          </div>
        `;
        card.querySelector('.del').addEventListener('click', e => {
          e.stopPropagation();
          const id = Number(e.currentTarget.dataset.id);
          contacts = contacts.filter(x => x.id !== id);
          save();
          render($searchInput.value);
          toast('已删除');
        });
        // v7.19 应用互联：tel: 死链（浏览器里无任何效果）→ 系统深链真动作
        // 呼叫 → 打开电话并预填号码+联系人名；发短信 → 打开信息并定位/新建联系人对话
        const linkAction = (kind) => {
          const S = window.__system;
          if (!S || typeof S.openApp !== 'function') {
            toast(kind === 'call' ? '呼叫 ' + c.phone : '短信 ' + c.name);
            return;
          }
          if (kind === 'call') {
            S.openApp('phone', { event: 'phone/dial', payload: { name: c.name, phone: c.phone } });
          } else {
            S.openApp('msg', { event: 'msg/chat', payload: { name: c.name, phone: c.phone } });
          }
        };
        card.querySelectorAll('[data-act-link]').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            linkAction(btn.getAttribute('data-act-link'));
          });
        });
        card.addEventListener('click', () => {
          if (isWide()) renderDetail(c);   // #181 ③平板：点击→右侧详情面板
          linkAction('call');              // 呼叫动作两端一致（平板双栏形态 AOSP 同构）
        });
        $list.appendChild(card);
      });
    };

    // ===== 模态框 =====
    const openModal = (edit = null) => {
      $modal.classList.add('open');
      if (window.__mdDialogA11y) window.__mdDialogA11y.open($modal, { onClose: closeModal });
      if (edit) {
        document.querySelector('#modalTitle').textContent = '编辑联系人';
        $name.value = edit.name;
        $phone.value = edit.phone;
        $email.value = edit.email || '';
        $note.value = edit.note || '';
        $form._editId = edit.id;
      } else {
        document.querySelector('#modalTitle').textContent = '新联系人';
        $form.reset();
        $form._editId = null;
      }
      setTimeout(() => $name.focus(), 50);
    };
    const closeModal = () => { $modal.classList.remove('open'); if (window.__mdDialogA11y) window.__mdDialogA11y.close($modal); };

    // ===== 事件 =====
    $fab.addEventListener('click', () => openModal());
    $cancel.addEventListener('click', closeModal);
    $modal.addEventListener('click', e => { if (e.target === $modal) closeModal(); });

    $form.addEventListener('submit', e => {
      e.preventDefault();
      const name = $name.value.trim(), phone = $phone.value.trim();
      if (!name || !phone) return;
      const email = $email.value.trim(), note = $note.value.trim();
      const editId = $form._editId;
      if (editId) {
        const idx = contacts.findIndex(c => c.id === editId);
        if (idx > -1) contacts[idx] = { ...contacts[idx], name, phone, email, note };
      } else {
        contacts.unshift({ id: genId(), name, phone, email, note });
        // #181 ④SDK：新增联系人 notify（低频用户主动操作；直开降级静默）
        try { if (window.__system && window.__system.notify) window.__system.notify({ title: '通讯录', body: `已添加联系人：${name}` }); } catch (e) {}
      }
      save();
      render($searchInput.value);
      closeModal();
      toast(editId ? '已更新' : '已保存');
    });

    // 搜索
    $searchToggle.addEventListener('click', () => {
      const open = $searchWrap.classList.toggle('open');
      if (open) $searchInput.focus(); else { $searchInput.value = ''; render(); }
    });
    $searchInput.addEventListener('input', () => render($searchInput.value));

    // ===== 启动 =====
    load();
    render();
  })();
</script>
    <script src="../_shared/idle-slider.js"></script>
</body>
</html>
