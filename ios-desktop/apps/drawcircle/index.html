<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="../freeze-shim.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>画圆挑战 · 人形圆规</title>
  <link rel="stylesheet" href="../_shared/md3-tokens.css">
<style>
  :root {
    --bg: var(--md-surface, #101418);
    --panel: color-mix(in srgb, var(--md-surface-container, #1c2126) 88%, transparent);
    --text: var(--md-on-surface, #e2e2e9);
    --text-sub: var(--md-on-surface-variant, #9a9fa6);
    --accent: hsl(var(--md-h, 215) 70% 60%);
    --chip: var(--md-surface-container-high, #262b31);
    --ok: hsl(var(--md-h, 215) 60% 55%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: system-ui, -apple-system, 'Noto Sans SC', sans-serif; color: var(--text); touch-action: none; }
  #cv { position: fixed; inset: 0; display: block; }

  /* 顶部工具条（MD3 chip 行） */
  #bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
    background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 88%, transparent), transparent);
    pointer-events: none;
  }
  #bar > * { pointer-events: auto; }
  .chip {
    border: none; cursor: pointer; color: var(--text);
    background: var(--chip); border-radius: 999px; padding: 7px 14px;
    font-size: 12.5px; font-weight: 500; letter-spacing: 0.2px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .chip:active { transform: scale(0.94); }
  .chip.best { background: var(--accent); color: var(--md-on-primary, #06222c); font-weight: 600; }
  #title { font-size: 13px; font-weight: 600; color: var(--text); padding-left: 2px; letter-spacing: 0.5px; }

  /* 底部提示条 */
  #hint {
    position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0;
    text-align: center; z-index: 5; pointer-events: none;
    font-size: 11.5px; color: var(--text-sub); letter-spacing: 0.3px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  /* 成绩面板（底部起升） */
  #panel {
    position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 110%);
    width: min(92vw, 360px); z-index: 6;
    background: var(--panel); border-radius: 24px 24px 0 0;
    padding: 18px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    transition: transform 0.32s cubic-bezier(0.2, 0, 0, 1);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #panel.show { transform: translate(-50%, 0); }
  .score-row { display: flex; align-items: baseline; gap: 10px; justify-content: center; }
  #scoreBig { font-size: 44px; font-weight: 700; letter-spacing: -1px; color: var(--accent); font-variant-numeric: tabular-nums; }
  #gradeTag { font-size: 14px; font-weight: 600; color: var(--text-sub); }
  .metric { margin-top: 10px; }
  .metric .lbl { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-sub); margin-bottom: 4px; }
  .metric .track { height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--text-sub) 22%, transparent); overflow: hidden; }
  .metric .fill { height: 100%; border-radius: 999px; background: var(--accent); width: 0; transition: width 0.5s cubic-bezier(0.2, 0, 0, 1); }
  #bestNote { text-align: center; margin-top: 12px; font-size: 12px; color: var(--text-sub); }
  #bestNote.broke { color: var(--accent); font-weight: 600; }

  #flash {
    position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%);
    z-index: 7; pointer-events: none; font-size: 13px; font-weight: 600; color: var(--accent);
    opacity: 0; transition: opacity 0.3s ease;
  }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div id="bar">
    <span id="title">画圆挑战</span>
    <button class="chip best" id="chipBest">最佳 —</button>
    <button class="chip" id="chipReset">重置纪录</button>
  </div>
  <div id="hint">一笔画一个圆 · 松手出分：圆度 × 闭合 × 重合 · 挑战 100 分</div>
  <div id="panel">
    <div class="score-row"><span id="scoreBig">0.0</span><span id="gradeTag">—</span></div>
    <div class="metric"><div class="lbl"><span>圆度（半径方差）</span><span id="vRound">—</span></div><div class="track"><div class="fill" id="fRound"></div></div></div>
    <div class="metric"><div class="lbl"><span>闭合（角度覆盖）</span><span id="vClose">—</span></div><div class="track"><div class="fill" id="fClose"></div></div></div>
    <div class="metric"><div class="lbl"><span>重合（起止点距）</span><span id="vOver">—</span></div><div class="track"><div class="fill" id="fOver"></div></div></div>
    <div id="bestNote">—</div>
  </div>
  <div id="flash"></div>

  <script src="core.js"></script>
  <script>
  (function () {
    'use strict';
    var core = window.__drawCircleCore;
    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    var W = 0, H = 0, dpr = 1;

    // 成绩留存（无痕环境降级为会话内记忆）
    var LS_KEY = 'drawcircle.best.v1';
    var ls = null;
    try { ls = window.localStorage; } catch (e) { ls = null; }
    var best = 0;
    try { best = ls ? (parseFloat(ls.getItem(LS_KEY)) || 0) : 0; } catch (e) { best = 0; }

    var stroke = [];        // 当前笔画点列
    var drawing = false;
    var lastResult = null;  // 只读桥暴露

    var el = {
      best: document.getElementById('chipBest'),
      reset: document.getElementById('chipReset'),
      panel: document.getElementById('panel'),
      scoreBig: document.getElementById('scoreBig'),
      gradeTag: document.getElementById('gradeTag'),
      vRound: document.getElementById('vRound'), fRound: document.getElementById('fRound'),
      vClose: document.getElementById('vClose'), fClose: document.getElementById('fClose'),
      vOver: document.getElementById('vOver'), fOver: document.getElementById('fOver'),
      bestNote: document.getElementById('bestNote'),
      flash: document.getElementById('flash'),
      hint: document.getElementById('hint')
    };

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }
    window.addEventListener('resize', resize);

    function redraw(fit) {
      ctx.clearRect(0, 0, W, H);
      if (stroke.length > 1) {
        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (var i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
        ctx.strokeStyle = 'hsl(var(--md-h, 215) 70% 72%)';
        ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.stroke();
        // 起止点标记
        ctx.fillStyle = 'hsl(var(--md-h, 215) 70% 62%)';
        ctx.beginPath(); ctx.arc(stroke[0].x, stroke[0].y, 4, 0, 6.2832); ctx.fill();
        ctx.beginPath(); ctx.arc(last().x, last().y, 4, 0, 6.2832); ctx.fill();
      }
      if (fit) {
        // 拟合圆虚线叠加（视觉反馈：你的圆 vs 数学圆）
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.arc(fit.cx, fit.cy, fit.r, 0, 6.2832);
        ctx.strokeStyle = 'hsl(var(--md-h, 215) 85% 68%)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(fit.cx, fit.cy, 3, 0, 6.2832); ctx.fill();
      }
    }
    function last() { return stroke[stroke.length - 1]; }

    function flash(msg) {
      el.flash.textContent = msg;
      el.flash.style.opacity = '1';
      clearTimeout(el.flash._t);
      el.flash._t = setTimeout(function () { el.flash.style.opacity = '0'; }, 1300);
    }

    function syncBestChip() {
      el.best.textContent = best > 0 ? '最佳 ' + best.toFixed(1) : '最佳 —';
    }

    function pos(e) {
      var r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    cv.addEventListener('pointerdown', function (e) {
      drawing = true;
      stroke = [pos(e)];
      hidePanel();
      redraw();
      cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', function (e) {
      if (!drawing) return;
      stroke.push(pos(e));
      redraw();
    });
    function endStroke() {
      if (!drawing) return;
      drawing = false;
      var res = core.scoreStroke(stroke);
      if (!res) { flash('笔画太小，重新画个大点的圆'); stroke = []; redraw(); return; }
      lastResult = res;
      redraw({ cx: res.cx, cy: res.cy, r: res.r });
      showResult(res);
    }
    cv.addEventListener('pointerup', endStroke);
    cv.addEventListener('pointercancel', function () { drawing = false; stroke = []; redraw(); });

    function pct(v) { return Math.round(v * 100) + '%'; }
    function showResult(res) {
      el.scoreBig.textContent = res.score.toFixed(1);
      el.gradeTag.textContent = core.grade(res.score);
      el.vRound.textContent = pct(res.roundness);
      el.vClose.textContent = pct(res.closure);
      el.vOver.textContent = pct(res.overlap);
      requestAnimationFrame(function () {
        el.fRound.style.width = pct(res.roundness);
        el.fClose.style.width = pct(res.closure);
        el.fOver.style.width = pct(res.overlap);
      });
      var broke = res.score > best;
      if (broke) {
        best = res.score;
        try { ls && ls.setItem(LS_KEY, String(best)); } catch (e) {}
        syncBestChip();
      }
      el.bestNote.textContent = broke ? '新纪录！' : '距最佳还差 ' + Math.max(0, best - res.score).toFixed(1) + ' 分';
      el.bestNote.classList.toggle('broke', broke);
      el.panel.classList.add('show');
    }
    function hidePanel() {
      el.panel.classList.remove('show');
      el.fRound.style.width = '0'; el.fClose.style.width = '0'; el.fOver.style.width = '0';
    }

    el.reset.addEventListener('click', function () {
      best = 0;
      try { ls && ls.removeItem(LS_KEY); } catch (e) {}
      syncBestChip();
      flash('纪录已重置');
    });

    // 只读 e2e 桥（__gravityUI 同款：零写入面）
    window.__drawCircleUI = {
      get last() { return lastResult; },
      get best() { return best; },
      get strokeLen() { return stroke.length; },
      grade: function () { return lastResult ? core.grade(lastResult.score) : null; }
    };

    syncBestChip();
    resize();
  })();
  </script>
</body>
</html>
