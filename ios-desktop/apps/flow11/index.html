o{filter:brightness(1.25) drop-shadow(0 0 6px #ef4444)}}.gem-special-laser{background:linear-gradient(135deg,#0284c7,#38bdf8,#f0f9ff);box-shadow:0 0 16px rgba(56,189,248,.7);font-size:17px}.gem-special-mult{background:linear-gradient(135deg,#d97706,#fbbf24,#fef08a);box-shadow:0 0 16px rgba(251,191,36,.7);font-size:13px;font-weight:900;color:#78350f!important;text-shadow:none!important}@keyframes rainbowShift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}#flowCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:15}.powerups-bar{display:flex;justify-content:space-between;gap:6px}.powerup-btn{flex:1;background:var(--md-surface-container-low);border:1px solid var(--md-surface-container);padding:8px 3px;border-radius:var(--md-r-md,16px);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:all .2s var(--md-easing-emphasized, cubic-bezier(.2, 0, 0, 1));box-shadow:0 2px 6px rgba(0,0,0,.03)}.powerup-btn:active{transform:scale(.92);background:var(--md-surface-container)}.powerup-icon{font-size:17px}.powerup-name{font-size:10px;font-weight:700;color:var(--md-on-surface)}.powerup-count{font-size:10px;color:var(--accent-primary);font-weight:800;background:var(--md-surface);padding:1px 5px;border-radius:999px}.floating-text{position:absolute;pointer-events:none;font-size:16px;font-weight:900;color:var(--md-accent);text-shadow:0 2px 6px rgba(0,0,0,.25);animation:floatUpFade .8s ease-out forwards;z-index:30;white-space:nowrap}@keyframes floatUpFade{0%{opacity:1;transform:translate(-50%,0) scale(.8)}50%{opacity:1;transform:translate(-50%,-22px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}.vol-row{display:flex;align-items:center;gap:8px;background:var(--md-surface-container-low);border-radius:14px;padding:6px 12px}.vol-row .vol-icon{font-size:13px;color:var(--md-on-surface-variant);display:flex;align-items:center}.vol-row .vol-val{font-size:10  </div> <div class="vol-row"> <span class="vol-icon"><svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-align:-.15em;fill:currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span> <input type="range" class="mdslider" id="flowVol" min="0" max="100" value="70" aria-label="音效音量"> <span class="vol-val" id="flowVolVal">70%</span> </div> <div class="special-crafting-bar" id="specialCraftingBar"> <div class="crafting-header"> <span><svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-align:-.15em;fill:currentColor"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg> 特殊方块工坊 (点击方块后点棋盘置入)</span> <span id="placementStatus" style="color:var(--text-sub);font-size:10px">未选择</span> </div> <div class="crafting-chips"> <button class="craft-btn" data-special="wildcard" title="万能彩晶：可与任意数字相连"> <span><svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-align:-.15em;fill:currentColor"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></span> <span>万能彩晶</span> </button> <button class="craft-btn" data-special="bomb" title="爆破炸弹：合成时炸毁周围3x3范围"> <span><svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-align:-.15em;fill:currentColor"><circle cx="10" cy="14.5" r="6.2"/><rect x="12.9" y="5.6" width="5" height="3" rx="1" transform="rotate(-45 15.4 7.1)"/><path d="M18.6 3.2l1.3-1.3M20.6 5.6l1.7-.4M19.9 4.3l1.1 1.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span> <span>爆破炸弹</span> </button> <button class="craft-btn" data-special="laser" title="闪电穿透：消除时横纵激光贯穿全屏"> <span><svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-a
