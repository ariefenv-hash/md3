<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="../freeze-shim.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>重力沙盒 · N 体轨道演算</title>
  <link rel="stylesheet" href="../_shared/md3-tokens.css">
  <link rel="stylesheet" href="../_shared/idle-slider.css">
<style>
  /* ==================== v9.46 #181 第一批整改：#179 六条准入自证 ====================
     ① 原生已达标：全量 var(--md-*) 令牌 + canvas 深空底色随宿主 --md-h 联动
        （getComputedStyle 后 hsl() 合成——drawcircle 原 bug 的正确写法先例）。
     ② @media 760px 两断点。③ 平板真分栏：物理画布保持全视口（天体运动语义必需），
        新增右侧控制 dock（场景管理 + 时间流速），信息层分栏非手机版放大。
     ④ SDK 接入：自定义天体场景存 VFS /documents/gravity-scenes.json（多场景保存/加载/删除，
        __system.fs IndexedDB 桥）。notify 不接：沙盒无通知语义（诚实豁免）。
     ⑤ 形态语言：时间流速怠速柄滑条（细竖条怠速/hover 胶囊展开）
        + 顶栏 chip 整排按压联动（tile-bounce.js Bounceable 数学同构轻量版）。
        波浪播放条（⑤第 2 条）不适用：无播放链路。 */
  :root {
    --bg: var(--md-surface, #101418);
    --panel: color-mix(in srgb, var(--md-surface-container, #1c2126) 82%, transparent);
    --text: var(--md-on-surface, #e2e2e9);
    --text-sub: var(--md-on-surface-variant, #9a9fa6);
    --accent: hsl(var(--md-h, 215) 70% 60%);
    --chip: var(--md-surface-container-high, #262b31);
    --outline: var(--md-outline-variant, #3c434b);        /* ① 语义层级补充：边框/分隔面 */
    --panel-highest: var(--md-surface-container-highest, #31363c); /* ① 语义层级补充：按钮/高亮面 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--md-font, system-ui, -apple-system, 'Noto Sans SC', sans-serif); color: var(--text); touch-action: none; }
  #cv { position: fixed; inset: 0; display: block; }

  /* 顶部工具条（MD3 chip 行） */
  #bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
    background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 88%, transparent), transparent);
    pointer-events: none;
  }
  #bar > * { pointer-events: auto; }
  .chip {
    border: none; cursor: pointer; color: var(--text);
    background: var(--chip); border-radius: var(--md-r-full, 999px); padding: 7px 14px;
    font-size: 12.5px; font-weight: 500; letter-spacing: 0.2px;
    transition: transform var(--md-duration-short, 0.15s) ease, background var(--md-duration-short, 0.15s) ease;
  }
  .chip:hover { background: var(--md-state-hover); }
  .chip:active { transform: scale(0.94); background: var(--md-state-pressed); }
  .chip.on { background: var(--accent); color: var(--md-on-primary, #06222c); font-weight: 600; }
  #hud { margin-left: auto; font-size: 12px; color: var(--text-sub); padding-right: 4px; }

  /* 底部提示条 */
  #hint {
    position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0;
    text-align: center; z-index: 5; pointer-events: none;
    font-size: 11.5px; color: var(--text-sub); letter-spacing: 0.3px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  #flash {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 6; pointer-events: none; font-size: 13px; font-weight: 600; color: var(--accent);
    opacity: 0; transition: opacity 0.3s ease;
  }

  /* ==================== ②③ 平板右侧控制 dock（手机态隐藏） ==================== */
  #dock { display: none; }

  /* 开屏入场动效（#308 批 4；曲线令牌消费口径同 #239 组） */
  @keyframes gv-bar-in{from{opacity:0;transform:translateY(8px)}}
  #bar{animation:gv-bar-in var(--md-duration-medium,400ms) var(--md-easing-emphasized-decelerate, cubic-bezier(0.05,0.7,0.1,1)) both}
  @media (min-width: 760px) {
    #dock {
      display: flex; flex-direction: column; gap: 10px;
      position: fixed; right: 0; top: 0; bottom: 0; width: 280px; z-index: 4;
      background: var(--panel); border-left: 1px solid color-mix(in srgb, var(--text-sub) 22%, transparent);
      padding: calc(52px + env(safe-area-inset-top, 0px)) 14px calc(14px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
    }
  }
  @media (max-width: 759.98px) { /* 手机态：dock 隐藏，顶栏横条保持 */ }
  .dockTitle { font-size: 11.5px; font-weight: 600; color: var(--text-sub); letter-spacing: 0.5px; }
  .dockBtn {
    border: 1px solid var(--outline); cursor: pointer; color: var(--text);
    background: var(--chip); border-radius: var(--md-r-md, 10px); padding: 8px 10px; font-size: 12.5px; font-weight: 500;
    transition: transform var(--md-duration-short, 0.18s) var(--md-easing-emphasized, cubic-bezier(.2,0,0,1)), border-radius var(--md-duration-short, 0.18s) var(--md-easing-emphasized, cubic-bezier(.2,0,0,1)), background var(--md-duration-short, 0.18s) ease;
  }
  .dockBtn:hover { background: var(--md-state-hover); }
  .dockBtn:active { transform: scale(0.95); background: var(--md-state-pressed); }
  #sceneList { display: flex; flex-direction: column; gap: 6px; }
  #sceneList .scene {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    border: 1px solid var(--outline); border-radius: var(--md-r-md, 10px); padding: 6px 8px;
  }
  #sceneList .scene .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sceneList .scene .meta { color: var(--text-sub); font-variant-numeric: tabular-nums; }
  #sceneList .scene button {
    border: none; cursor: pointer; border-radius: var(--md-r-sm, 8px); padding: 4px 8px; font-size: 11px;
    background: var(--panel-highest); color: var(--text);
    transition: background var(--md-duration-short, 0.15s) ease;
  }
  #sceneList .scene button:hover { background: var(--md-state-hover); }
  #sceneList .scene button:active { background: var(--md-state-pressed); }
  #sceneList .scene button.load { background: var(--accent); color: var(--md-on-primary, #06222c); font-weight: 600; }
  #sceneEmpty { font-size: 11.5px; color: var(--text-sub); }

  /* ⑤ 时间流速怠速柄滑条（A17 Expressive slider idle-handle，markdown 同款） */
  #speedWrap { display: flex; align-items: center; gap: 7px; }
  #speedWrap .lab { font-size: 11px; color: var(--text-sub); white-space: nowrap; }
  #speedVal { font-size: 11.5px; color: var(--text); font-variant-numeric: tabular-nums; min-width: 34px; }
  /* v11.02 #227 滑块单源化：几何/轨道/拇指/focus/disabled 视觉规范已收编
     _shared/idle-slider.css（单一组件源，audit D 门禁禁止本地滑块伪元素）；
     此处仅保留布局与应用主题令牌映射 */
  .mdslider { flex: 1; --md-primary: var(--accent); --md-surface-container-highest: var(--chip); --md-background: var(--bg); }

  #bar .chip { transition: transform .18s var(--md-easing-emphasized, cubic-bezier(.2,0,0,1)), border-radius .18s var(--md-easing-emphasized, cubic-bezier(.2,0,0,1)), background .15s ease; }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div id="bar">
    <button class="chip" data-preset="binary" aria-label="加载双星预设">双星</button>
    <button class="chip" data-preset="three" aria-label="加载三体预设">三体</button>
    <button class="chip" data-preset="solar" aria-label="加载太阳系预设">太阳系</button>
    <button class="chip" id="btnClear">清空</button>
    <button class="chip" id="btnPause" aria-pressed="false">暂停</button>
    <button class="chip on" id="btnTrail" aria-pressed="true">拖尾</button>
    <span id="hud">0 体</span>
  </div>
  <div id="hint">空白处拖拽发射天体（拖向 = 初速） · 拖动天体改位置 · 相撞合并守动量</div>
  <div id="flash"></div>
  <aside id="dock">
    <span class="dockTitle">时间流速（dt 标度）</span>
    <div id="speedWrap">
      <span class="lab">0.25×</span>
      <input type="range" id="speedSlider" class="mdslider" min="25" max="200" step="5" value="100" aria-label="时间流速">
      <span id="speedVal">1.00×</span>
    </div>
    <span class="dockTitle">场景管理（VFS 同步）</span>
    <button class="dockBtn" id="btnSaveScene" aria-label="保存当前场景到 VFS">保存当前场景</button>
    <div id="sceneList"></div>
    <span id="sceneEmpty">暂无保存场景</span>
  </aside>

  <script src="core.js"></script>
  <script>
  (function () {
    'use strict';
    var core = window.__gravityCore;
    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    var hud = document.getElementById('hud');
    var flashEl = document.getElementById('flash');
    var W = 0, H = 0, dpr = 1;

    var bodies = [];
    var paused = false, showTrail = true;
    var totalMerges = 0;
    // 交互态：aim = 空白拖拽发射；drag = 抓取既有天体
    var aim = null, drag = null, dragVel = { x: 0, y: 0, t: 0 };
    var KV = 2.2; // 发射初速标度（拖拽 px → 速度）

    // ---------- ⑤ 时间流速（dt 标度，零 core 改动：step(bodies, dt*speed)） ----------
    var speed = 1;
    var speedSlider = document.getElementById('speedSlider');
    function applySpeed() {
      speed = parseInt(speedSlider.value, 10) / 100;
      speedSlider.style.setProperty('--p', ((speedSlider.value - 25) / 175 * 100) + '%');
      document.getElementById('speedVal').textContent = speed.toFixed(2) + '×';
    }
    speedSlider.addEventListener('input', applySpeed);
    applySpeed();

    // ---------- ④SDK：VFS 场景管理（/documents/gravity-scenes.json 多场景） ----------
    var VFS_PATH = '/documents/gravity-scenes.json';
    var scenes = [];
    function fsAvailable() { return !!(window.__system && window.__system.fs); }
    function fsLoadScenes() {
      if (!fsAvailable()) return;
      try {
        var p = (typeof window.__system.fs.readText === 'function')
          ? window.__system.fs.readText(VFS_PATH)
          : window.__system.fs.read(VFS_PATH).then(function (r) { return (r && r.text) || ''; });
        Promise.resolve(p).then(function (txt) {
          try { scenes = JSON.parse(txt) || []; } catch (e) { scenes = []; }
          if (!Array.isArray(scenes)) scenes = [];
          renderScenes();
        }).catch(function () {});
      } catch (e) {}
    }
    function fsSaveScenes() {
      if (!fsAvailable()) return;
      try { window.__system.fs.write(VFS_PATH, JSON.stringify(scenes), { mime: 'application/json' }).catch(function () {}); } catch (e) {}
    }
    function renderScenes() {
      var list = document.getElementById('sceneList');
      var empty = document.getElementById('sceneEmpty');
      if (!list) return;
      empty.style.display = scenes.length ? 'none' : '';
      list.innerHTML = scenes.map(function (s, i) {
        return '<div class="scene"><span class="name">' + s.name + '</span>' +
          '<span class="meta">' + s.n + ' 体</span>' +
          '<button class="load" data-load="' + i + '" aria-label="载入场景 ' + s.name + '">载入</button>' +
          '<button data-del="' + i + '" aria-label="删除场景 ' + s.name + '">删</button></div>';
      }).join('');
    }
    document.getElementById('sceneList').addEventListener('click', function (e) {
      var t = e.target;
      if (t.dataset.load != null) {
        var s = scenes[+t.dataset.load];
        if (s) {
          bodies = (s.bodies || []).map(function (b) { return core.createBody(b); });
          totalMerges = 0; syncChips(''); flash('已载入「' + s.name + '」');
        }
      } else if (t.dataset.del != null) {
        scenes.splice(+t.dataset.del, 1); fsSaveScenes(); renderScenes(); flash('场景已删除');
      }
    });
    document.getElementById('btnSaveScene').addEventListener('click', function () {
      if (!bodies.length) { flash('空场景无需保存'); return; }
      var name = '场景 ' + new Date().toLocaleTimeString();
      scenes.push({ name: name, n: bodies.length, at: Date.now(),
        bodies: bodies.map(function (b) { return { x: b.x, y: b.y, vx: b.vx, vy: b.vy, m: b.m, hue: b.hue, fixed: b.fixed }; }) });
      if (scenes.length > 12) scenes = scenes.slice(-12);
      fsSaveScenes(); renderScenes(); flash('已保存「' + name + '」');
    });

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    function loadPreset(name) {
      bodies = core.makePreset(name, W, H);
      totalMerges = 0;
      flash(name === 'three' ? '三体 · 8 字周期解' : name === 'binary' ? '双星 · 精确圆轨道' : name === 'solar' ? '太阳系 · 四行星' : '已清空');
      syncChips(name);
    }
    function syncChips(name) {
      document.querySelectorAll('.chip[data-preset]').forEach(function (c) {
        c.classList.toggle('on', c.dataset.preset === name);
      });
    }
    function flash(msg) {
      flashEl.textContent = msg;
      flashEl.style.opacity = '1';
      clearTimeout(flashEl._t);
      flashEl._t = setTimeout(function () { flashEl.style.opacity = '0'; }, 1300);
    }

    document.querySelectorAll('.chip[data-preset]').forEach(function (c) {
      c.addEventListener('click', function () { loadPreset(c.dataset.preset); });
    });
    document.getElementById('btnClear').addEventListener('click', function () {
      bodies = []; totalMerges = 0; syncChips(''); flash('已清空');
    });
    var btnPause = document.getElementById('btnPause');
    btnPause.addEventListener('click', function () {
      paused = !paused;
      btnPause.textContent = paused ? '继续' : '暂停';
      btnPause.classList.toggle('on', paused);
      btnPause.setAttribute('aria-pressed', String(paused));
    });
    var btnTrail = document.getElementById('btnTrail');
    btnTrail.addEventListener('click', function () {
      showTrail = !showTrail;
      btnTrail.classList.toggle('on', showTrail);
      btnTrail.setAttribute('aria-pressed', String(showTrail));
      if (!showTrail) bodies.forEach(function (b) { b.trail.length = 0; });
    });

    // ---------- ⑤ 顶栏 chip 整排按压联动（tile-bounce.js Bounceable 数学同构轻量版） ----------
    var chips = Array.prototype.slice.call(document.querySelectorAll('#bar .chip'));
    function pressRipple(originIdx) {
      chips.forEach(function (k, i) {
        var d = Math.abs(i - originIdx);
        var f = d === 0 ? 1 : Math.max(0, 1 - d * 0.45);
        var sc = d === 0 ? 0.88 : 1 - 0.05 * f;
        var shift = d === 0 ? 0 : (i < originIdx ? 1 : -1) * 2 * f;
        k.style.transform = 'translateX(' + shift.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ')';
        k.style.borderRadius = (999 - (d === 0 ? 60 : 24) * f) + 'px';
        k.style.zIndex = d === 0 ? '1' : '';
      });
    }
    function releaseRipple() {
      chips.forEach(function (k) { k.style.transform = ''; k.style.borderRadius = ''; k.style.zIndex = ''; });
    }
    chips.forEach(function (k, i) {
      k.addEventListener('pointerdown', function () { pressRipple(i); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { k.addEventListener(ev, releaseRipple); });
    });
    document.addEventListener('pointerup', releaseRipple);

    function pick(x, y) {
      for (var i = bodies.length - 1; i >= 0; i--) {
        var b = bodies[i];
        var dx = x - b.x, dy = y - b.y;
        if (dx * dx + dy * dy < Math.max(18, b.r + 10) * Math.max(18, b.r + 10)) return b;
      }
      return null;
    }

    cv.addEventListener('pointerdown', function (e) {
      var b = pick(e.clientX, e.clientY);
      if (b) {
        drag = b; b._drag = true;
        dragVel = { x: 0, y: 0, t: performance.now(), px: e.clientX, py: e.clientY };
      } else {
        aim = { x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY };
      }
      cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', function (e) {
      if (drag) {
        var now = performance.now();
        var dt = Math.max(1, now - dragVel.t) / 1000;
        dragVel.x = (e.clientX - dragVel.px) / dt;
        dragVel.y = (e.clientY - dragVel.py) / dt;
        dragVel.t = now; dragVel.px = e.clientX; dragVel.py = e.clientY;
        drag.x = e.clientX; drag.y = e.clientY;
        drag.trail.length = 0;
      } else if (aim) {
        aim.x1 = e.clientX; aim.y1 = e.clientY;
      }
    });
    function finishPointer(e) {
      if (drag) {
        // 松手速度接力（拖拽轨迹差分，上限钳防甩飞）
        var cap = 600;
        drag.vx = Math.max(-cap, Math.min(cap, dragVel.x));
        drag.vy = Math.max(-cap, Math.min(cap, dragVel.y));
        drag._drag = false; drag = null;
      } else if (aim) {
        var dx = aim.x1 - aim.x0, dy = aim.y1 - aim.y0;
        var len2 = dx * dx + dy * dy;
        if (len2 > 64) { // 有效拖拽（>8px）才发射
          bodies.push(core.createBody({
            x: aim.x0, y: aim.y0,
            vx: dx * KV, vy: dy * KV,
            m: 8, hue: (Math.random() * 360) | 0,
          }));
        }
        aim = null;
      }
    }
    cv.addEventListener('pointerup', finishPointer);
    cv.addEventListener('pointercancel', function () {
      if (drag) { drag._drag = false; drag = null; }
      aim = null;
    });

    // ---------- 渲染 ----------
    function hsl(h, s, l, a) { return 'hsla(' + h.toFixed(0) + ',' + s + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')'; }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      // 深空底色（随宿主 --md-h 微调的径向渐变）
      var h = getComputedStyle(document.documentElement).getPropertyValue('--md-h') || 215;
      var hue = parseFloat(h) || 215;
      var g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
      g.addColorStop(0, hsl(hue, 30, 9));
      g.addColorStop(1, hsl(hue, 35, 4));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      // 拖尾（透明度渐隐折线）
      if (showTrail) {
        for (var i = 0; i < bodies.length; i++) {
          var b = bodies[i], tr = b.trail;
          if (tr.length < 4) continue;
          ctx.strokeStyle = hsl(b.hue, 80, 62, 0.35);
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(tr[0], tr[1]);
          for (var k = 2; k < tr.length; k += 2) ctx.lineTo(tr[k], tr[k + 1]);
          ctx.stroke();
        }
      }

      // 发射瞄准线（虚线 + 初速读数）
      if (aim) {
        var dx = aim.x1 - aim.x0, dy = aim.y1 - aim.y0;
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = hsl(hue, 80, 70, 0.9);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(aim.x0, aim.y0); ctx.lineTo(aim.x1, aim.y1); ctx.stroke();
        ctx.setLineDash([]);
        var v = Math.sqrt(dx * dx + dy * dy) * KV | 0;
        ctx.fillStyle = hsl(hue, 80, 78, 0.95);
        ctx.font = '11px system-ui';
        ctx.fillText('v ≈ ' + v, aim.x1 + 8, aim.y1 - 6);
      }

      // 天体（发光圆：外晕 + 本体 + fixed 恒星光冠）
      for (var j = 0; j < bodies.length; j++) {
        var bb = bodies[j];
        var glow = ctx.createRadialGradient(bb.x, bb.y, 0, bb.x, bb.y, bb.r * 3.2);
        glow.addColorStop(0, hsl(bb.hue, 90, 66, 0.5));
        glow.addColorStop(1, hsl(bb.hue, 90, 66, 0));
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r * 3.2, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = hsl(bb.hue, 85, bb.fixed ? 62 : 58);
        ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI * 2); ctx.fill();
        if (bb.fixed) {
          ctx.strokeStyle = hsl(bb.hue, 90, 80, 0.8);
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r + 4, 0, Math.PI * 2); ctx.stroke();
        }
      }
    }

    // ---------- 主循环（rAF；帧内物理 = step + 碰撞；dt 钳 1/30 防后台跳帧爆炸） ----------
    var last = performance.now();
    function loop(now) {
      var dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000));
      last = now;
      if (!paused && bodies.length) {
        core.step(bodies, dt * speed);   // ⑤ 时间流速：dt 标度（零 core 改动）
        totalMerges += core.handleCollisions(bodies);
      }
      draw();
      hud.textContent = bodies.length + ' 体' + (totalMerges ? ' · 合并 ' + totalMerges : '') + (paused ? ' · 已暂停' : '');
      requestAnimationFrame(loop);
    }

    // e2e 只读桥（零写入面）
    window.__gravityUI = {
      getBodies: function () { return bodies; },
      preset: loadPreset,
      isPaused: function () { return paused; },
      stats: function () { return { n: bodies.length, merges: totalMerges }; },
      get speed() { return speed; },
      get scenes() { return scenes.length; }
    };

    loadPreset('binary');
    fsLoadScenes();
    requestAnimationFrame(loop);
  })();
  </script>
  <script src="../_shared/idle-slider.js"></script>
</body>
</html>
