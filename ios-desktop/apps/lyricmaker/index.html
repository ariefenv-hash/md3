<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="../freeze-shim.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>歌词制作 · LRC 打轴与逐字对齐</title>
  <link rel="stylesheet" href="../_shared/md3-tokens.css">
<style>
  :root {
    --bg: var(--md-surface, #101418);
    --panel: color-mix(in srgb, var(--md-surface-container, #1c2126) 88%, transparent);
    --text: var(--md-on-surface, #e2e2e9);
    --sub: var(--md-on-surface-variant, #9a9fa6);
    --accent: hsl(var(--md-h, 215) 70% 60%);
    --ok: #4adebc;
    --warn: #ffd166;
    --line: color-mix(in srgb, var(--md-outline, #30363d) 55%, transparent);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 "HarmonyOS Sans SC", "Noto Sans SC", system-ui, sans-serif;
    padding: 12px 12px 24px; overflow-y: auto;
  }
  .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .hd h1 { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  .hd .draft { margin-left: auto; font-size: 11px; color: var(--sub); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
  .card h2 { font-size: 12px; font-weight: 600; color: var(--sub); letter-spacing: 1px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button, .btn {
    border: none; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600;
    background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--text); cursor: pointer;
  }
  button:active { transform: scale(.97); }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--sub); }
  .btn-warn { background: color-mix(in srgb, var(--warn) 24%, transparent); }
  .btn-big { width: 100%; padding: 12px; font-size: 15px; border-radius: 14px; margin-top: 8px; }
  input[type="text"], textarea {
    width: 100%; background: color-mix(in srgb, var(--bg) 70%, transparent); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit;
  }
  textarea { min-height: 84px; resize: vertical; }
  #audioFile { display: none; }
  .time { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .time small { font-size: 11px; color: var(--sub); font-weight: 400; }
  #list { max-height: 200px; overflow-y: auto; margin-top: 6px; }
  .lrow {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; cursor: pointer;
  }
  .lrow:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .lrow.sel { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .lrow .tag {
    font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 700; min-width: 58px;
    color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent);
    border-radius: 6px; padding: 2px 5px; text-align: center;
  }
  .lrow .tag.untimed { color: var(--sub); background: color-mix(in srgb, var(--sub) 12%, transparent); }
  .lrow .tx { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .del { border: none; background: transparent; color: var(--sub); padding: 2px 6px; font-size: 13px; }
  #karaoke { min-height: 96px; display: flex; flex-direction: column; justify-content: center; gap: 6px; text-align: center; }
  #kCur { font-size: 20px; font-weight: 800; line-height: 1.45; letter-spacing: .5px; }
  #kCur .w { color: var(--sub); transition: color .12s; position: relative; }
  #kCur .w.on { color: var(--text); }
  #kCur .w.done { color: var(--accent); }
  #kNext { font-size: 12px; color: var(--sub); }
  .muted { color: var(--sub); font-size: 12px; }
  .exp { display: flex; gap: 8px; flex-wrap: wrap; }
  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px);
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 8px 16px; border-radius: 999px; font-size: 12px; opacity: 0; transition: all .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="hd">
    <h1>歌词制作</h1>
    <span class="draft" id="draftState">草稿 · 空</span>
  </div>

  <div class="card">
    <h2>音频 · 音源（可选，无音源可模拟播放/演示）</h2>
    <div class="row">
      <button id="pickAudio">选择音频</button>
      <input type="file" id="audioFile" accept="audio/*">
      <button id="playBtn">播放</button>
      <button id="simBtn" class="btn-ghost">模拟播放</button>
      <span class="time" id="clock">00:00.00<small> / 模拟</small></span>
    </div>
    <audio id="audio" preload="auto"></audio>
  </div>

  <div class="card">
    <h2>歌词源 · 粘贴多行文本（支持带 [mm:ss.xx] 的 LRC 直接回读）</h2>
    <textarea id="src" placeholder="每行一句歌词；也可直接粘贴带时间标签的 LRC"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="loadBtn">载入行</button>
      <button id="demoBtn" class="btn-ghost">载入演示</button>
      <input type="text" id="ti" placeholder="歌名 ti" style="flex:1;min-width:100px">
    </div>
  </div>

  <div class="card">
    <h2>打轴 · 空格键/按钮打点（自动分配到下一未定时行，快打自动防乱序）</h2>
    <div class="row">
      <button id="markBtn" class="btn-warn">打点</button>
      <button id="remarkBtn" class="btn-ghost">重打当前选中</button>
      <button id="wordsBtn" class="btn-ghost">生成逐字对齐</button>
      <span class="muted" id="stat">未定时 0 / 共 0 行</span>
    </div>
    <div id="list"></div>
  </div>

  <div class="card">
    <h2>预览 · 卡拉OK逐字跟随（播放/模拟即动）</h2>
    <div id="karaoke">
      <div id="kCur"><span class="muted">载入歌词后开始预览</span></div>
      <div id="kNext"></div>
    </div>
  </div>

  <div class="card">
    <h2>导出 · LRC（行级通用）/ md3-lyric JSON（逐字，供 #52 消费）</h2>
    <div class="exp">
      <button id="dlLrc">下载 LRC</button>
      <button id="dlJson">下载逐字 JSON</button>
      <button id="cpLrc" class="btn-ghost">复制 LRC</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="core.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var core = window.__lyricCore;
  var LS = 'lyricmaker.draft.v1';

  var lines = [];           // [{time, text, words?}]
  var sel = -1;             // 选中行（重打目标）
  var meta = { ti: '' };
  var sim = { on: false, t: 0, last: 0 };
  var draftTimer = null;

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }

  function now() {
    return sim.on ? sim.t : (audio.duration ? audio.currentTime * 1000 : 0);
  }

  /* ---------- 行列表渲染 ---------- */
  function render() {
    var box = $('list');
    box.innerHTML = '';
    var untimed = 0;
    lines.forEach(function (l, i) {
      if (l.time == null) untimed++;
      var row = document.createElement('div');
      row.className = 'lrow' + (i === sel ? ' sel' : '');
      var tag = document.createElement('span');
      tag.className = 'tag' + (l.time == null ? ' untimed' : '');
      tag.textContent = l.time == null ? '·····' : core.fmtTime(l.time);
      var tx = document.createElement('span');
      tx.className = 'tx';
      tx.textContent = l.text;
      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.title = '删除本行';
      del.onclick = function (e) { e.stopPropagation(); lines.splice(i, 1); sel = -1; render(); saveDraft(); };
      row.appendChild(tag);
      row.appendChild(tx);
      row.appendChild(del);
      row.onclick = function () { sel = (sel === i ? -1 : i); render(); };
      box.appendChild(row);
    });
    $('stat').textContent = '未定时 ' + untimed + ' / 共 ' + lines.length + ' 行';
    $('draftState').textContent = '草稿 · 已存 ' + (function () {
      var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    })();
  }

  /* ---------- 打点 ---------- */
  function nextUntimed() {
    for (var i = 0; i < lines.length; i++) if (lines[i].time == null) return i;
    return -1;
  }
  function prevTimed(idx) {
    for (var i = idx - 1; i >= 0; i--) if (lines[i].time != null) return lines[i].time;
    return null;
  }
  function markAt(ms) {
    var idx = nextUntimed();
    if (idx < 0 && sel >= 0) idx = sel;
    if (idx < 0) { toast('没有可打点的行：先「载入行」'); return -1; }
    var t = core.clampMark(ms, prevTimed(idx));
    lines[idx].time = t;
    lines[idx].words = null; // 时间变了，逐字需重算
    sel = idx;
    render();
    saveDraft();
    return idx;
  }

  /* ---------- 逐字对齐 ---------- */
  function genWords() {
    var timed = [];
    lines.forEach(function (l, i) { if (l.time != null) timed.push(i); });
    if (!timed.length) { toast('先打点再生成逐字'); return; }
    timed.forEach(function (idx, k) {
      var l = lines[idx];
      var end = k + 1 < timed.length ? lines[timed[k + 1]].time : l.time + 4000;
      l.words = core.splitWords(l.text, l.time, end);
    });
    toast('逐字对齐已生成（' + timed.length + ' 行）');
    saveDraft();
  }

  /* ---------- 预览 ---------- */
  function renderKaraoke() {
    var t = now();
    var k = core.karaokeAt(lines, t);
    var cur = $('kCur'), nxt = $('kNext');
    if (k.idx < 0 || !k.line) {
      cur.innerHTML = '<span class="muted">载入歌词后开始预览</span>';
      nxt.textContent = '';
      return;
    }
    var html = '';
    k.words.forEach(function (w, i) {
      var cls = 'w' + (i < k.wordIdx || (i === k.wordIdx && k.wordProgress >= 1) ? ' done'
        : (i === k.wordIdx && k.wordProgress > 0 ? ' on' : ''));
      html += '<span class="' + cls + '">' + w.w.replace(/</g, '&lt;') + '</span>';
    });
    cur.innerHTML = html || '<span class="muted">（空行）</span>';
    var timed = lines.filter(function (l) { return l.time != null; });
    nxt.textContent = (k.idx + 1 < timed.length) ? '下一句：' + timed[k.idx + 1].text : '— 尾句 —';
    if (!sim.on && !audio.paused) {
      $('clock').innerHTML = core.fmtTime(t) + '<small> / 音频</small>';
    } else if (sim.on) {
      $('clock').innerHTML = core.fmtTime(t) + '<small> / 模拟</small>';
    }
  }
  function tick(ts) {
    if (sim.on) {
      if (sim.last) sim.t += Math.min(100, ts - sim.last);
      sim.last = ts;
      if (sim.t > 8 * 60000) sim.on = false;
    }
    renderKaraoke();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- 载入 ---------- */
  function loadFromText() {
    var parsed = core.parseLrc($('src').value);
    if (!parsed.length) { toast('歌词源为空'); return; }
    lines = parsed;
    sel = -1;
    meta.ti = $('ti').value.trim() || meta.ti;
    render();
    saveDraft();
    toast('已载入 ' + parsed.length + ' 行');
  }
  function loadDemo() {
    lines = core.DEMO.lines.map(function (l) { return { time: l.time, text: l.text, words: null }; });
    meta.ti = core.DEMO.title;
    $('ti').value = core.DEMO.title;
    $('src').value = lines.map(function (l) { return '[' + core.fmtTime(l.time) + ']' + l.text; }).join('\n');
    sel = -1;
    genWords();
    render();
    toast('演示已载入（6 行预打轴）');
  }

  /* ---------- 导出 ---------- */
  function lrcText() { return core.serializeLrc(lines, { ti: meta.ti || $('ti').value.trim() || '未命名' }); }
  function jsonText() { return core.exportJson(lines, { ti: $('ti').value.trim() || '未命名' }); }
  function download(name, text, mime) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain' }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    toast('已下载 ' + name);
  }

  /* ---------- 草稿 ---------- */
  function saveDraft() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function () {
      try {
        localStorage.setItem(LS, JSON.stringify({
          src: $('src').value, ti: $('ti').value, lines: lines, sim: sim.on
        }));
      } catch (e) { /* 存储满/隐私模式：草稿静默失败 */ }
    }, 400);
  }
  function restoreDraft() {
    try {
      var d = JSON.parse(localStorage.getItem(LS) || 'null');
      if (!d) return false;
      $('src').value = d.src || '';
      $('ti').value = d.ti || '';
      lines = Array.isArray(d.lines) ? d.lines : [];
      meta.ti = $('ti').value;
      render();
      return lines.length > 0;
    } catch (e) { return false; }
  }
  function saveDraftNow() {
    clearTimeout(draftTimer);
    try {
      localStorage.setItem(LS, JSON.stringify({ src: $('src').value, ti: $('ti').value, lines: lines, sim: sim.on }));
    } catch (e) { /* 同上 */ }
  }

  /* ---------- 音频/模拟 ---------- */
  var audio = $('audio');
  $('pickAudio').onclick = function () { $('audioFile').click(); };
  $('audioFile').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    audio.src = URL.createObjectURL(f);
    meta.ti = meta.ti || f.name.replace(/\.[^.]+$/, '');
    toast('音频已载入：' + f.name);
  };
  $('playBtn').onclick = function () {
    sim.on = false;
    if (!audio.src) { toast('先选择音频文件，或用「模拟播放」'); return; }
    if (audio.paused) { audio.play(); this.textContent = '暂停'; }
    else { audio.pause(); this.textContent = '播放'; }
  };
  $('simBtn').onclick = function () {
    if (sim.on) { sim.on = false; this.textContent = '模拟播放'; this.classList.add('btn-ghost'); return; }
    sim.on = true; sim.last = 0;
    this.textContent = '停止模拟';
    this.classList.remove('btn-ghost');
  };
  audio.onplay = function () { $('playBtn').textContent = '暂停'; };
  audio.onpause = function () { $('playBtn').textContent = '播放'; };

  $('loadBtn').onclick = loadFromText;
  $('demoBtn').onclick = loadDemo;
  $('markBtn').onclick = function () { markAt(now() || (sim.on ? sim.t : 0)); };
  $('remarkBtn').onclick = function () {
    if (sel < 0) { toast('先在列表中选中一行'); return; }
    lines[sel].time = null;
    lines[sel].words = null;
    render();
    toast('已清空第 ' + (sel + 1) + ' 行时间，重新打点');
  };
  $('wordsBtn').onclick = genWords;
  $('dlLrc').onclick = function () { download((meta.ti || 'lyrics') + '.lrc', lrcText()); };
  $('dlJson').onclick = function () { download((meta.ti || 'lyrics') + '.md3lyric.json', jsonText(), 'application/json'); };
  $('cpLrc').onclick = function () {
    var txt = lrcText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast('LRC 已复制'); },
        function () { toast('复制失败（权限）'); });
    } else toast('剪贴板不可用');
  };

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.code === 'Space') { e.preventDefault(); markAt(now()); }
    if (e.code === 'KeyP') { e.preventDefault(); $('playBtn').click(); }
  });
  $('src').addEventListener('input', saveDraft);
  $('ti').addEventListener('input', function () { meta.ti = this.value; saveDraft(); });

  /* ---------- e2e 只读+驱动桥 ---------- */
  window.__lyricMakerUI = {
    get lines() { return lines; },
    get sel() { return sel; },
    get sim() { return sim.on; },
    get draftKey() { return LS; },
    now: now,
    markAt: markAt,
    loadDemo: loadDemo,
    loadFromText: loadFromText,
    genWords: genWords,
    exportLrc: lrcText,
    exportJsonText: jsonText,
    setSrc: function (v) { $('src').value = v; },
    restoreDraft: restoreDraft,
    saveDraftNow: saveDraftNow
  };

  if (!restoreDraft()) $('src').value = '';
  render();
})();
</script>
</body>
</html>
