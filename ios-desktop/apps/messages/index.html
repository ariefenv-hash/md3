wcase__code{font-family:ui-monospace,monospace;font-size:20px;font-weight:700;letter-spacing:2px;color:var(--md-primary);text-align:center;padding:10px 0 12px;user-select:all;cursor:pointer}.room-hash-copy{cursor:pointer;border-bottom:1px dotted transparent;transition:color .15s,border-color .15s}.room-hash-copy:hover{color:var(--md-primary);border-bottom-color:var(--md-primary)}.copy-toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(14px);background:var(--md-on-surface,#1c1b1f);color:var(--md-surface,#fff);padding:9px 18px;border-radius:999px;font-size:12.5px;z-index:1300;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;max-width:82%}.copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.typing-row{display:flex;align-items:center;gap:8px;margin:2px 0 6px 40px}.typing-dots{display:inline-flex;align-items:center;gap:4px;padding:10px 14px;background:var(--md-surface-container,#fff);border-radius:var(--md-r-md,16px);border-bottom-left-radius:4px;box-shadow:var(--md-shadow)}.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--md-on-surface-variant);animation:typingBounce 1.2s ease-in-out infinite}.typing-dot:nth-child(2){animation-delay:.15s}.typing-dot:nth-child(3){animation-delay:.3s}@keyframes typingBounce{0%,100%,60%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}.typing-label{font-size:11px;color:var(--md-on-surface-variant)}.msg-receipt{font-size:10px;text-align:right;margin-top:2px;opacity:.65;display:flex;align-items:center;justify-content:flex-end;gap:3px}.msg-receipt.read{color:var(--md-primary);opacity:.9}.msg-receipt svg{width:13px;height:13px;vertical-align:-2px;fill:currentColor}.conn-banner{display:none;align-items:center;gap:8px;padding:7px 16px;font-size:12px;border-bottom:1px solid var(--md-outline-variant)}.conn-banner.show{display:flex}.conn-banner-dot{width:7px;height:7px;border-radius:50%;background:var(--md-outline-variant);flex-shrink:0}. -rise{from{opacity:0;transform:translateY(12px)}}@media (max-width:768px){.sidebar{position:fixed;left:0;top:0;bottom:0;width:85%;max-width:320px;z-index:50;transform:translateX(-100%);transition:transform .3s;background:var(--md-surface)}.sidebar.open{transform:translateX(0)}.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}.sidebar-overlay.open{opacity:1;pointer-events:auto}.list-card .actions{opacity:1}}.md-btn:active{background:var(--md-state-pressed,rgba(255,255,255,.12))}</style> </head> <body> <div class="sidebar-overlay" id="sidebarOverlay"></div> <div class="flex h-screen"> <aside class="sidebar w-80 border-r flex flex-col" style="border-color:var(--md-outline-variant);background:var(--md-surface)"> <div class="p-5 pb-3"> <h1 class="font-display text-xl font-bold" style="color:var(--md-primary)">信息</h1> <p class="text-xs mt-1" style="color:var(--md-on-surface-variant)">本地 bot 联系人 · 拟人对话</p> </div> <div class="flex-1 overflow-y-auto p-4"> <div class="flex items-center justify-between mb-2 px-1"> <p class="text-xs font-medium" style="color:var(--md-on-surface-variant)">本地联系人 <span class="room-pill ml-2"><span class="room-dot on"></span>离线可用</span></p> </div> <div class="space-y-1.5" id="botList"></div> <div class="mt-5"> <p class="text-xs font-medium" style="color:var(--md-on-surface-variant)">联机房间 <span class="room-pill ml-2"><span class="room-dot" id="roomConnDot"></span><span id="roomConnLabel">未连接</span></span></p> <div class="space-y-1.5" id="roomList" style="margin-top:8px"></div> <div class="flex items-center justify-between mt-5 mb-2 px-1"> <p class="text-xs font-medium" style="color:var(--md-on-surface-variant)">系统通知</p> <button class="action-btn" onclick="openRoomModal()" title="创建 / 加入房间" aria-label="创建 / 加入房间">+</button> </div> <div class="space-y-1.5" id="chatList"></div> </div> </div> </aside> <main class="flex-1 flex flex-col" style="background:linear-gradient(180deg,var(--md-surface) 0,color-mix(in srgb,var(--md-secondary-container) 30%,var(--md-surface)) 100%)"> <header class="flex items-center gap-3 p-3.5 px-5" style="background:var(--md-surface);box-shadow:var(--md-shadow)"> <button class="md:hidden p-2 rounded-full hover:bg-gray-100" onclick="toggleSidebar()" aria-label="切换侧栏"><svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-align:-.15em;fill:currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button> <div class="avatar" id="chatAvatar" style="background:#455a64"><svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-align:-.15em;fill:currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div> <div class="flex-1 min-w-0"> <h2 class="font-medium font-display truncate text-sm sm:text-base" id="chatTitle">选择一个房间</h2> <p class="text-xs truncate" style="color:var(--md-on-surface-variant)" id="chatStatus">创建或加入联机房间开始聊天</p> </div> <div class="flex items-center gap-2"> <span class="conn-pill" id="connPill"><span class="room-dot" id="connPillDot"></span><span id="connPillText"></span></span> <span class="conn-pill" id="roomCodePill" title="点击复制房间码" role="button" tabindex="0" aria-label="复制房间码" style="cursor:pointer"><svg viewBox="0 0 24 24" style="width:1em;height:1em;fill:currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z"/></svg><span id="roomCodeText"></span></span> <button class="action-btn delete" onclick="clearCurrentChatMessages()" title="清空本对话消息" aria-label="清空本对话消息"><svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-align:-.15em;fill:currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button> </div> </header> <div class="conn-banner" id="connBanner" role="status" aria-live="polite"><span class="conn-banner-dot"></span><span id="connBannerText"></span></div> <div class="flex-1 over
