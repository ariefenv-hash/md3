<!DOCTYPE html>
<html lang="zh-CN" data-theme-mode="dark">
<head><script src="../freeze-shim.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MIDI 播放器</title>
    <link rel="stylesheet" href="../_shared/md3-tokens.css">
    <script src="../../js/midi-player-core.js"></script>
<style>
        /* ==================== v8.51 #56 MIDI 播放器（html-midi-player） ====================
           Web Component <midi-player> + <midi-visualizer type="piano-roll">。
           vendor 离线内嵌（apps/_shared/vendor/midi-player-bundle.mjs，magenta shim 跳 tfjs），
           零 CDN；默认音色 = 库内置 Tone 振荡器合成器（离线可发声），
           sound-font 音源为用户显式开启的懒加载增强（失败自动回退）。
           纯函数在 js/midi-player-core.js（vitest 锚），本页只做接线。 */
        :root {
            --mp-bg: var(--md-surface);
            --mp-panel: rgba(0,0,0,.22);
            --mp-text: var(--md-on-surface);
            --mp-dim: var(--md-on-surface-variant);
            --mp-accent: var(--md-primary);
            --mp-on-accent: var(--md-on-primary, #062e6f);
            --mp-line: var(--md-outline-variant, rgba(255,255,255,.12));
            --mp-chip: var(--md-secondary-container);
            --mp-chip-text: var(--md-on-secondary-container);
            --mp-err: var(--md-error, #f2b8b5);
            --mp-ok: var(--md-tertiary, #efb8c8);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body { margin: 0; overflow: hidden; background: var(--mp-bg); color: var(--mp-text);
               font-family: var(--md-font, var(--md-text-font, system-ui, sans-serif)); }
        .mp-app { position: absolute; inset: 0; display: flex; flex-direction: column; }
        .mp-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 8px; flex: 0 0 auto; }
        .mp-title { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .3px; white-space: nowrap; }
        .mp-sp { flex: 1; }
        .mp-btn { border: 1px solid var(--mp-line); background: transparent; color: var(--mp-dim);
                  font-size: 11px; padding: 5px 11px; border-radius: 999px; cursor: pointer; font-family: inherit;
                  white-space: nowrap; transition: transform 130ms cubic-bezier(.34,1.56,.64,1), color 160ms, border-color 160ms; }
        .mp-btn:active { transform: scale(.92); }
        .mp-btn.primary { background: var(--mp-accent); color: var(--mp-on-accent); border-color: transparent; font-weight: 700; }
        .mp-btn.on { color: var(--mp-ok); border-color: var(--mp-ok); }

        .mp-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 0 12px; }
        .mp-stage { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px;
                    border: 1px solid var(--mp-line); border-radius: 14px; background: var(--mp-panel);
                    padding: 10px 12px; }
        .mp-stage.hide, .mp-empty.hide { display: none; }
        midi-player { width: 100%; --midi-player-font-size: 12px; }
        midi-player::part(control-panel) { background: rgba(255,255,255,.055); border: 1px solid var(--mp-line); }
        midi-player::part(play-button) { color: var(--mp-text); }
        midi-player::part(current-time), midi-player::part(total-time) { color: var(--mp-dim);
                  font-variant-numeric: tabular-nums; }
        midi-player::part(seek-bar) { accent-color: var(--mp-accent); }
        midi-visualizer { width: 100%; max-height: 40vh; overflow: auto; }
        midi-visualizer .piano-roll-visualizer rect.note { rx: 3px; }
        .mp-empty { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center;
                    justify-content: center; gap: 8px; color: var(--mp-dim); text-align: center; }
        .mp-empty b { font-size: 14.5px; color: var(--mp-text); }
        .mp-empty span { font-size: 11.5px; line-height: 1.7; }

        .mp-samples { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
                      padding: 2px 2px 6px; }
        .mp-samples-label { font-size: 9.5px; color: var(--mp-dim); letter-spacing: 1.2px; margin-right: 2px; }
        .mp-chip { border: 1px solid var(--mp-line); background: var(--mp-chip); color: var(--mp-chip-text);
                   border-radius: 999px; padding: 4px 12px; font-size: 11px; cursor: pointer; font-family: inherit;
                   transition: transform 130ms cubic-bezier(.34,1.56,.64,1); }
        .mp-chip:active { transform: scale(.9); }
        .mp-chip.active { border-color: var(--mp-accent); }

        .mp-info { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
                   padding: 8px 12px; border-top: 1px solid var(--mp-line); font-size: 10.5px; color: var(--mp-dim);
                   font-variant-numeric: tabular-nums; }
        .mp-info .cell b { color: var(--mp-text); font-weight: 600; }

        /* ---- 导入 sheet（#55 取消路径纪律：取消按钮/Escape/背景点击/input oncancel 全收起） ---- */
        .mp-sheet-mask { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: none;
                         align-items: flex-end; justify-content: center; z-index: 30; }
        .mp-sheet-mask.show { display: flex; }
        .mp-sheet { width: min(420px, 100%); background: var(--mp-bg); border-radius: 24px 24px 0 0;
                    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 40px rgba(0,0,0,.5);
                    max-height: 76%; display: flex; flex-direction: column; gap: 10px; }
        .mp-sheet h2 { margin: 0; font-size: 15px; }
        .mp-sheet .hint { margin: 0; font-size: 11px; color: var(--mp-dim); line-height: 1.6; }
        .mp-sheet-actions { display: flex; gap: 8px; align-items: center; }
        .mp-vfs-list { flex: 1 1 auto; min-height: 80px; max-height: 240px; overflow: auto; display: flex;
                       flex-direction: column; gap: 2px; }
        .mp-vfs-row { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px;
                      font-size: 11.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mp-vfs-row:hover { background: rgba(255,255,255,.05); }
        .mp-vfs-row .sz { margin-left: auto; color: var(--mp-dim); font-size: 10px; flex: 0 0 auto; }
        .mp-vfs-empty { color: var(--mp-dim); font-size: 11px; padding: 10px 6px; }
        .mp-toast { position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%) translateY(8px);
                    background: var(--mp-chip); color: var(--mp-chip-text); padding: 8px 16px; border-radius: 999px;
                    font-size: 12px; opacity: 0; pointer-events: none; transition: opacity 180ms, transform 180ms;
                    max-width: 82%; text-align: center; z-index: 40; }
        .mp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="mp-app">
    <div class="mp-head">
        <h1 class="mp-title">MIDI 播放器</h1>
        <span class="mp-sp"></span>
        <button class="mp-btn" id="mpSfBtn" data-test="mp-soundfont" title="切换音色引擎">音色：内置合成</button>
        <button class="mp-btn primary" id="mpImportBtn" data-test="mp-import">导入</button>
    </div>
    <div class="mp-body">
        <div class="mp-stage hide" id="mpStage" data-test="mp-stage">
            <midi-player id="mpPlayer" data-test="mp-player" visualizer="#mpViz"></midi-player>
            <midi-visualizer id="mpViz" data-test="mp-viz" type="piano-roll"></midi-visualizer>
        </div>
        <div class="mp-empty" id="mpEmpty" data-test="mp-empty">
            <b>选择一首 MIDI 开始播放</b>
            <span>点下方示例曲目，或点「导入」选择 .mid / .midi 文件<br>
            钢琴卷帘可视化 · 音符高亮随播放同步</span>
        </div>
        <div class="mp-samples" id="mpSamples" data-test="mp-samples">
            <span class="mp-samples-label">示例曲目（公有领域）</span>
        </div>
    </div>
    <div class="mp-info" id="mpInfo" data-test="mp-info">
        <span class="cell">曲目 <b id="mpStName">—</b></span>
        <span class="cell">格式 <b id="mpStFmt">—</b></span>
        <span class="cell">轨道 <b id="mpStTrks">—</b></span>
        <span class="cell">音符 <b id="mpStNotes">—</b></span>
        <span class="cell">时长 <b id="mpStDur">—</b></span>
        <span class="cell">大小 <b id="mpStSize">—</b></span>
    </div>
</div>

<div class="mp-sheet-mask" id="mpMask">
    <div class="mp-sheet">
        <h2>导入 MIDI</h2>
        <p class="hint">从本地选择 .mid / .midi 文件（≤5MB），或从 VFS 文件系统直接打开。</p>
        <div class="mp-sheet-actions">
            <button class="mp-btn primary" id="mpLocalBtn" data-test="mp-local">本地文件…</button>
            <button class="mp-btn" id="mpSheetCancel" data-test="mp-cancel">取消</button>
            <input type="file" id="mpFileInput" data-test="mp-file-input" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>
        </div>
        <div class="mp-vfs-list" id="mpVfsList" data-test="mp-vfs-list"></div>
    </div>
</div>
<div class="mp-toast" id="mpToast"></div>
<script>
// 深链缓冲（HTML 解析期注册 —— app-bus 补投锚定 loaded=1+60ms，module 脚本 defer 执行
// 可能晚于补投，监听放 module 会丢首帧深链；inline 先暂存，app.mjs 启动后消费）。
window.__mpDeepLink = window.__mpDeepLink || [];
window.addEventListener('message', function (e) {
    try {
        var d = e.data;
        if (!d || d.type !== 'BUS_DELIVER' || d.event !== 'midi-player/open') return;
        window.__mpDeepLink.push(d.payload);
    } catch (err) { /* 深链异常不影响本体 */ }
});
</script>
<script type="module" src="./app.mjs"></script>
</body>
</html>
