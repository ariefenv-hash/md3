<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="../freeze-shim.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyanWave · 极简多彩本地音乐</title>
  <link rel="stylesheet" href="../_shared/md3-tokens.css">
<style>
    /* ==========================================================================
       1. 扁平几何设计令牌 (Flat / Geometric Tokens) — 修复UI细节
       ========================================================================== */
    :root {
      /* v7.25 Material You 主题同步 / v7.26 MD3 统一 / v7.28 多彩化：
         全套色令牌映射到共享规范令牌层（_shared/md3-tokens.css）的 MD3 色彩角色，
         随宿主色相与明暗实时联动 —— 暗色系统呈现暗色 CyanWave，浅色系统呈现原味浅色。
         v7.28 多彩化：空状态插画/频谱/封面渐变不再单色系派生，而是以基色相为锚做多色相
         散布（+45/+115/+175/+215/+305 五族），任意主题色令牌下整体旋转、观感自洽，
         后续适配任何颜色令牌都不会显得别扭；--md-h 独立打开时回落 199 = 原味基色相 */
      --md-h: 199;
      --c-primary: var(--md-primary);
      --c-primary-dark: var(--md-on-primary-container);
      --c-primary-soft: var(--md-primary-container);
      --c-primary-line: var(--md-accent);
      --c-accent: hsl(calc(var(--md-h) - 24), 83%, 32%);
      --c-accent-soft: var(--md-tertiary-container);

      --c-bg: var(--md-surface);
      --c-surface: var(--md-surface-container-low);
      --c-surface-sunken: var(--md-surface-container);

      --c-line: var(--md-outline-variant);
      --c-line-strong: var(--md-outline);

      --c-ink: var(--md-on-surface);
      --c-ink-2: var(--md-on-surface-variant);
      --c-ink-3: color-mix(in srgb, var(--md-on-surface) 55%, transparent);

      --r-xs: var(--md-r-xs);
      --r-s: var(--md-r-sm);
      --r-m: var(--md-r-md);

      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 底层几何网格 + 新增渐变氛围（与空状态呼应）—— 色相随 --md-h 平移 */
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--md-surface);
      background-image:
        linear-gradient(to right, color-mix(in srgb, var(--md-accent) 5%, transparent) 1px, transparent 1px),
        linear-gradient(to bottom, color-mix(in srgb, var(--md-accent) 5%, transparent) 1px, transparent 1px),
        radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--md-surface-bright) 55%, var(--md-surface)) 0%, var(--md-surface) 100%);
      background-size: 28px 28px, 28px 28px, 100% 100%;
      background-blend-mode: overlay, overlay, normal;
      font-family: var(--md-text-font), "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--c-ink);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       2. 顶部应用栏 — 更稳固的flex和触控优化
       ========================================================================== */
    .top-app-bar {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--c-surface);
      border-bottom: 1px solid var(--c-line);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.06em;
      color: var(--c-primary-dark);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: var(--r-xs);
      background: var(--c-primary);
      display: grid;
      place-items: center;
      position: relative;
      flex-shrink: 0;
    }
    /* v8.22 #55③: 品牌角标收进容器内——旧值 right/bottom:-4px 负偏移使 8px 方块
       溢出 logo 边界（QA 走查报告「左上角图标右下角溢出/多余绿色小方块」实锤），
       改 2px 内缩 + 6px 尺寸保留品牌语义且不再溢出容器 */
    .brand-logo::after {
      content: "";
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 6px;
      height: 6px;
      background: var(--c-accent);
      border-radius: 1px;
    }

    .brand-logo svg {
      width: 17px;
      height: 17px;
      fill: #fff;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       3. 扁平按钮体系 — 提升可读性与交互反馈
       ========================================================================== */
    .md-btn {
      height: 40px;
      padding: 0 18px;
      border-radius: var(--r-s);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color .15s, color .15s, border-color .15s, box-shadow .1s;
      white-space: nowrap;
    }

    .md-btn-primary {
      background: var(--c-primary);
      color: #fff;
    }
    .md-btn-primary:hover {
      background: var(--c-primary-dark);
    }

    .md-btn-tonal {
      background: var(--c-surface);
      border-color: var(--c-primary);
      color: var(--c-primary);
    }
    .md-btn-tonal:hover {
      background: var(--c-primary-soft);
    }

    .md-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--r-s);
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--c-ink-2);
      transition: background-color .15s, color .15s;
      flex-shrink: 0;
    }
    .md-icon-btn:hover {
      background: var(--c-primary-soft);
      color: var(--c-primary);
    }

    /* ==========================================================================
       4. 主视口 — 更好的滚动与尺寸约束
       ========================================================================== */
    .main-content {
      flex: 1;
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ---- 空状态：优雅多彩插画 (已替换) ---- */
    .empty-container {
      flex: 1;
      min-height: 62vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeIn 0.35s ease-out;
    }

    .empty-icon {
      width: 260px;
      height: 260px;
      overflow: visible;
      filter: drop-shadow(0 14px 28px color-mix(in srgb, var(--md-primary) 10%, transparent));
      max-width: 100%;
      height: auto;
    }

    /* v7.28 多彩化：插画以基色相为锚做多色相散布 —— 主体（盖板/箱身）保持基色相
       系住品牌锚点，装饰族（光晕+45 / 音点+115 / 琴环+175 / 声浪+215 / 星芒与三角+45/+305）
       五族散布铺满色环；换任意主题色相全族整体旋转，观感自洽不别扭。 */
    .empty-icon .cw-s-halo1 { stop-color: hsl(var(--md-h), 77%, 95%); }
    .empty-icon .cw-s-halo2 { stop-color: hsl(calc(var(--md-h) + 45), 71%, 91%); }
    .empty-icon .cw-s-f1 { stop-color: hsl(var(--md-h), 93%, 61%); }
    .empty-icon .cw-s-f2 { stop-color: hsl(var(--md-h), 97%, 39%); }
    .empty-icon .cw-s-b1 { stop-color: hsl(var(--md-h), 97%, 39%); }
    .empty-icon .cw-s-b2 { stop-color: hsl(var(--md-h), 92%, 32%); }
    .empty-icon .cw-s-w1 { stop-color: hsl(calc(var(--md-h) + 215), 90%, 55%); }
    .empty-icon .cw-s-w2 { stop-color: hsl(calc(var(--md-h) + 215), 92%, 38%); }
    .empty-icon .cw-s-o1 { stop-color: hsl(calc(var(--md-h) + 115), 67%, 51%); }
    .empty-icon .cw-s-o2 { stop-color: hsl(calc(var(--md-h) + 115), 78%, 34%); }
    .empty-icon .cw-ring { stroke: hsl(calc(var(--md-h) + 175), 85%, 60%); }
    .empty-icon .cw-tri { fill: hsl(calc(var(--md-h) + 305), 70%, 64%); }
    .empty-icon .cw-star { fill: hsl(calc(var(--md-h) + 45), 93%, 61%); }
    .empty-icon .cw-dark { fill: hsl(calc(var(--md-h) + 4), 80%, 24%); }
    .empty-icon .cw-sh { flood-color: hsl(calc(var(--md-h) + 4), 80%, 24%); }

    .empty-title {
      margin-top: 24px;
      font-size: 17px;
      font-weight: 500;
      color: var(--md-on-surface);
      letter-spacing: 0.15em;
      text-indent: 0.15em;
    }

    .empty-subtitle {
      margin-top: 8px;
      font-size: 13px;
      color: var(--md-on-surface-variant);
      letter-spacing: 0.05em;
    }

    .empty-actions {
      margin-top: 26px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ---- 拖拽蒙层 ---- */
    .drag-overlay {
      position: fixed;
      inset: 12px;
      background: hsl(var(--md-h, 199) 97% 39% / 0.07); /* v7.28 令牌化（原 CyanWave 品牌青蓝残留） */
      border: 2px dashed var(--c-primary);
      border-radius: var(--r-m);
      z-index: 100;
      pointer-events: none;
      display: none;
      place-items: center;
    }
    .drag-overlay.active {
      display: grid;
    }
    .drag-card {
      background: var(--c-surface);
      border: 2px solid var(--c-primary);
      padding: 22px 36px;
      border-radius: var(--r-s);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--c-primary);
      text-transform: uppercase;
      box-shadow: 0 8px 20px hsl(var(--md-h, 199) 97% 39% / 0.15);
    }

    /* ==========================================================================
       5. 工作台栅格 — 修复高度、overflow和滚动
       ========================================================================== */
    .app-workspace {
      display: none;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      height: calc(100vh - 112px);
      min-height: 500px;
      animation: fadeIn 0.3s ease-out;
    }

    .workspace-left {
      display: flex;
      flex-direction: column;
      background: var(--c-surface);
      border: 1px solid var(--c-line);
      border-radius: var(--r-m);
      overflow: hidden;
      min-width: 0;
      height: 100%;
    }

    /* 工具栏 */
    .list-toolbar {
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid var(--c-line);
      background: var(--c-surface-sunken);
      flex-shrink: 0;
    }

    .search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .search-box input {
      width: 100%;
      height: 40px;
      background: var(--c-surface);
      border: 1px solid var(--c-line);
      border-radius: var(--r-s);
      padding: 0 14px 0 40px;
      font-size: 13.5px;
      outline: none;
      color: var(--c-ink);
      transition: border-color .15s, background-color .15s;
      user-select: text;
    }
    .search-box input::placeholder {
      color: var(--c-ink-3);
      letter-spacing: 0.02em;
    }
    .search-box input:focus {
      border-color: var(--c-primary);
      background: #fff;
    }
    .search-box svg {
      position: absolute;
      left: 13px;
      width: 17px;
      height: 17px;
      fill: var(--c-ink-3);
      pointer-events: none;
    }

    /* 曲目列表 — 优化滚动条 */
    .track-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      list-style: none;
      min-height: 0;
    }
    .track-list::-webkit-scrollbar { width: 6px; }
    .track-list::-webkit-scrollbar-thumb {
      background: var(--c-line-strong);
      border-radius: 0;
    }
    .track-list::-webkit-scrollbar-track { background: transparent; }

    .track-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 14px;
      border-radius: var(--r-xs);
      cursor: pointer;
      border-bottom: 1px solid var(--md-outline-variant);
      transition: background-color .12s;
    }
    .track-item:last-child { border-bottom: none; }
    .track-item:hover {
      background: var(--c-surface-sunken);
    }
    .track-item.active {
      background: var(--c-primary-soft);
      box-shadow: inset 3px 0 0 var(--c-primary);
    }

    .track-index {
      width: 22px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--mono);
      color: var(--c-ink-3);
      text-align: center;
      flex-shrink: 0;
    }
    .track-item.active .track-index {
      color: var(--c-primary);
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }
    .track-name {
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 12.5px;
      color: var(--c-ink-2);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .track-badge {
      font-size: 10px;
      padding: 3px 6px;
      border-radius: var(--r-xs);
      border: 1px solid var(--c-line-strong);
      background: var(--c-surface);
      color: var(--c-ink-2);
      font-family: var(--mono);
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .track-item.active .track-badge {
      border-color: var(--c-primary);
      color: var(--c-primary);
    }

    /* ==========================================================================
       6. 播放台 — 布局加固，避免内容溢出
       ========================================================================== */
    .workspace-right {
      background: var(--c-surface);
      border: 1px solid var(--c-line);
      border-radius: var(--r-m);
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      height: 100%;
      min-width: 0;
    }

    /* 几何封面 — 添加弹性高度和固定宽高比 */
    .album-art-wrap {
      width: 100%;
      max-width: 210px;
      aspect-ratio: 1 / 1;
      border-radius: var(--r-s);
      background-color: var(--c-primary);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.13) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.13) 1px, transparent 1px);
      background-size: 24px 24px;
      border: 1px solid var(--c-primary-dark);
      display: grid;
      place-items: center;
      position: relative;
      margin: 6px 0 22px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .art-rings {
      position: absolute;
      inset: 18px;
      border: 2px dashed rgba(255, 255, 255, 0.42);
      animation: rotateRing 26s linear infinite paused;
    }
    .art-rings.playing {
      animation-play-state: running;
    }

    .album-art-wrap svg {
      width: 62px;
      height: 62px;
      fill: #fff;
      position: relative;
      z-index: 1;
    }

    /* 频谱 — 宽度100%不变，高度弹性 */
    #visualizerCanvas {
      width: 100%;
      height: 56px;
      margin-bottom: 16px;
      border-radius: 0;
      flex-shrink: 0;
      display: block;
    }

    .now-playing-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-align: center;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .now-playing-sub {
      font-size: 12.5px;
      color: var(--c-ink-2);
      letter-spacing: 0.04em;
      margin-top: 5px;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    /* 进度 */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    /* v8.25 #46 remedia 波浪进度条容器（对齐通知卡/QS 卡接管范式）：
       波浪为唯一视觉，原生 range 透明覆盖保拖拽/点击/无障碍语义（AOSP SeekBar 同构） */
    .progress-track {
      position: relative;
      width: 100%;
      height: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .slider-seek {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      margin: 0;
    }

    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 0;
      background: var(--md-surface-container-highest);
      outline: none;
      cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: var(--c-primary);
      border: none;
      cursor: pointer;
    }
    .slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: var(--c-primary);
      border: none;
      cursor: pointer;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-family: var(--mono);
      letter-spacing: 0.06em;
      color: var(--c-ink-2);
    }

    /* 控制区 */
    .controls-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      width: 100%;
    }

    /* v8.25 #46 A17 remedia PlayPauseAction：DpSize(72×48) 胶囊（Media.kt buttonSize 逐字）；
       圆角由弹簧驱动（暂停 48px 全圆 ↔ 播放 16px，animateDpAsState 默认 spring 同构），
       CSS 初始值 = 暂停端点；transform 挤压脉冲由 JS 驱动（点击 1→1.125→1 tween 250ms） */
    .play-btn-large {
      width: 72px;
      height: 48px;
      border-radius: 48px;
      background: var(--c-primary);
      color: #fff;
      border: none;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color .15s;
      flex-shrink: 0;
      will-change: transform;
    }
    .play-btn-large:hover {
      background: var(--c-primary-dark);
    }
    .play-btn-large svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* 音量 */
    .volume-box {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 6px;
      flex-shrink: 0;
      margin-top: auto; /* 将音量推到底部，避免浮动 */
    }
    .volume-box svg {
      width: 17px;
      height: 17px;
      fill: var(--c-ink-2);
      flex-shrink: 0;
    }

    #audioFileInput, #folderFileInput {
      display: none;
    }

    /* 动画 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes rotateRing {
      100% { transform: rotate(360deg); }
    }

    /* ==========================================================================
       7. 响应式 — 移动端底部播放条更友好
       ========================================================================== */
    @media (max-width: 900px) {
      .top-app-bar { padding: 0 16px; }
      .app-brand span { display: none; }
      .main-content { padding: 16px; }

      .app-workspace {
        grid-template-columns: 1fr;
        height: auto;
        min-height: auto;
        padding-bottom: 132px;
      }

      .workspace-left {
        height: auto;
        max-height: 55vh;
      }

      .workspace-right {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 50;
        border-radius: var(--r-m) var(--r-m) 0 0;
        border: none;
        border-top: 2px solid var(--c-primary);
        padding: 14px 18px 18px;
        height: auto;
        background: var(--c-surface);
        box-shadow: 0 -4px 16px rgba(0,0,0,0.05);
      }

      .album-art-wrap,
      #visualizerCanvas,
      .volume-box {
        display: none;
      }

      .now-playing-title { text-align: left; font-size: 15px; }
      .now-playing-sub { text-align: left; margin-bottom: 12px; }
      .progress-wrap { margin-bottom: 12px; }
      .controls-main { margin-bottom: 0; justify-content: center; gap: 10px; }
      .play-btn-large { width: 72px; height: 48px; }
    }

    /* 小手机优化 */
    @media (max-width: 480px) {
      .header-actions .md-btn span:not(.icon-fallback) { display: none; }
      .header-actions .md-btn { padding: 0 12px; }
      .header-actions .md-btn svg { margin-right: 0; }
      .md-btn { gap: 4px; }
      .top-app-bar { padding: 0 12px; }
      .workspace-right { padding: 12px 14px 14px; }
    }

    /* ==========================================================================
       7. v7.61 歌词面板 / 封面缩略图（与频谱互斥展示）
       ========================================================================== */
    #lyricsPanel {
      width: 100%;
      height: 64px;
      margin-bottom: 16px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      /* 上下边缘渐隐（WebKit 前缀 + 标准 mask） */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%);
    }
    #lyricsPanel::before {
      /* 空态提示底色：无歌词时给出柔和占位 */
      content: '';
      position: absolute;
      inset: 0;
      background: var(--c-primary-soft);
      border-radius: var(--r-xs);
      opacity: 0;
      transition: opacity .3s;
    }
    #lyricsPanel.no-lyrics::before { opacity: 1; }
    #lyricsList {
      list-style: none;
      margin: 0;
      padding: 0;
      position: relative;
      z-index: 1;
      transition: transform .45s cubic-bezier(.2, 0, 0, 1);
      will-change: transform;
    }
    #lyricsList li {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--c-ink-2);
      padding: 4px 10px;
      text-align: center;
      opacity: .6;
      transition: opacity .35s, color .35s, transform .35s;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #lyricsList li:hover { opacity: .9; }
    #lyricsList li.active {
      opacity: 1;
      color: var(--c-primary);
      font-weight: 700;
      transform: scale(1.04);
    }
    #lyricsList li.no-lyrics {
      cursor: default;
      opacity: .85;
      color: var(--c-ink-2);
      transform: none;
      font-weight: 500;
    }
    #lyricsList li.no-lyrics:hover { opacity: .85; }

    /* 播放列表封面缩略图（v7.61）：有内置/压缩包封面时替代序号位 */
    .track-thumb {
      width: 36px;
      height: 36px;
      border-radius: var(--r-xs);
      object-fit: cover;
      flex-shrink: 0;
      background: var(--c-primary-soft);
      border: 1px solid var(--c-line);
    }
    /* 播放台歌词按钮激活态（与 btnShuffle 的既有激活视觉一致） */
    #btnLyrics.active {
      color: var(--c-primary);
      background: var(--c-primary-soft);
    }
  </style>
</head>

  <script>
    /* ==========================================================================
       核心逻辑控制器
       ========================================================================== */

    // ==================== v7.44 持久化（双通道） ====================
    // ① 音频文件本体 → VFS /music/（桌面 js/vfs.js 经 __system.fs 桥接，IndexedDB 落盘，
    //    重启后自动恢复播放列表；同名覆盖语义与相册一致）；
    // ② 播放偏好（音量/播放模式/当前曲目下标）→ localStorage md3_music_prefs_v1。
    const MUSIC_PREFS_KEY = 'md3_music_prefs_v1';
    const fsReady = new Promise(resolve => {
      if (window.__system && window.__system.fs) return resolve(true);
      window.addEventListener('__system-ready', () => resolve(!!(window.__system && window.__system.fs)), { once: true });
      setTimeout(() => resolve(!!(window.__system && window.__system.fs)), 4000);
    });
    function fsWrite(path, data) {
      return fsReady.then(ok => ok ? window.__system.fs.write(path, data).catch(() => null) : null);
    }
    function saveMusicPrefs(patch) {
      try {
        const prev = JSON.parse(localStorage.getItem(MUSIC_PREFS_KEY) || '{}') || {};
        localStorage.setItem(MUSIC_PREFS_KEY, JSON.stringify(Object.assign(prev, patch)));
      } catch (e) {}
    }

    class MusicApp {
      constructor() {
        this.tracks = [];
        this.currentIndex = -1;
        this.isPlaying = false;
        this.playMode = 'sequence'; // 'sequence' | 'single' | 'shuffle'
        this.lyricsOn = false;      // v7.61：歌词面板开关（prefs 恢复）

        this.audio = new Audio();
        this.audioCtx = null;
        this.analyser = null;
        this.sourceNode = null;

        // v7.25 Material You 主题同步：频谱/封面渐变用色由 --md-h 派生
        // （无宿主时 199 = CyanWave 原味基色相；宿主切色后经 set-theme-hue 消息刷新。
        //  v7.28 多彩频谱：条色由 vizBarColor 按条位从基色相散布派生，无需缓存双色调）
        this.themeHue = 199;
        this.refreshThemeColors();

        this.dom = {
          emptyView: document.getElementById('emptyStateView'),
          workspaceView: document.getElementById('workspaceView'),
          trackContainer: document.getElementById('trackListContainer'),
          audioFileInput: document.getElementById('audioFileInput'),
          folderFileInput: document.getElementById('folderFileInput'),
          btnFileImport: document.getElementById('btnFileImport'),
          btnFolderImport: document.getElementById('btnFolderImport'),
          btnClearPlaylist: document.getElementById('btnClearPlaylist'),
          searchInput: document.getElementById('searchInput'),
          dragOverlay: document.getElementById('dragOverlay'),

          btnPlayPause: document.getElementById('btnPlayPause'),
          playIcon: document.getElementById('playIcon'),
          btnPrev: document.getElementById('btnPrev'),
          btnNext: document.getElementById('btnNext'),
          btnMode: document.getElementById('btnMode'),
          modeIcon: document.getElementById('modeIcon'),
          btnShuffle: document.getElementById('btnShuffle'),
          seekSlider: document.getElementById('seekSlider'),
          seekTrack: document.getElementById('seekTrack'),
          currentTimeLabel: document.getElementById('currentTimeLabel'),
          totalTimeLabel: document.getElementById('totalTimeLabel'),
          volumeSlider: document.getElementById('volumeSlider'),

          nowTitle: document.getElementById('nowTitle'),
          nowArtist: document.getElementById('nowArtist'),
          artRings: document.getElementById('artRings'),
          albumArtImg: document.getElementById('albumArtImg'),
          lyricsPanel: document.getElementById('lyricsPanel'),
          lyricsList: document.getElementById('lyricsList'),
          btnLyrics: document.getElementById('btnLyrics'),
          archiveToast: document.getElementById('archiveToast'),
          archiveToastText: document.getElementById('archiveToastText'),
          canvas: document.getElementById('visualizerCanvas')
        };

        // 设置初始音量
        this.audio.volume = 0.8;

        // ---- v8.25 #46 三联动挂载 ----
        // ① remedia 波浪进度条：与通知卡/QS 卡同一引擎（aosp/media-wave.js）
        //    同参数同观感；音乐应用随主题 resolve on-surface 系色（暗底白浪同构）
        this.wave = null;
        if (this.dom.seekTrack && window.__a17MediaWave) {
          try {
            this.wave = window.__a17MediaWave.create(this.dom.seekTrack, this.resolveWaveColors());
          } catch (e) { /* 引擎缺位时回退原生 slider 视觉 */ }
        }
        // ② 播放/暂停按钮 A17 引擎（圆角 spring + 点击脉冲 + 官方 AVD 图标 morph）
        this.a17Btn = null;
        if (this.dom.btnPlayPause && window.__a17MediaButton) {
          try { this.a17Btn = window.__a17MediaButton.create(this.dom.btnPlayPause); } catch (e) {}
        }

        this.initEventListeners();
        this.initCanvas();
      }

      initEventListeners() {
        this.dom.btnFileImport.onclick = () => this.dom.audioFileInput.click();
        this.dom.btnFolderImport.onclick = () => this.dom.folderFileInput.click();
        this.dom.audioFileInput.onchange = (e) => this.handleFiles(e.target.files);
        this.dom.folderFileInput.onchange = (e) => this.handleFiles(e.target.files);
        this.dom.btnClearPlaylist.onclick = () => this.clearPlaylist();

        this.dom.btnPlayPause.onclick = () => {
          // v8.25 #46 A17 PlayPauseAction：onClick 即脉冲（1→1.125→1），与状态切换并发
          if (this.a17Btn) this.a17Btn.pulse();
          this.togglePlay();
        };
        this.dom.btnPrev.onclick = () => this.prev();
        this.dom.btnNext.onclick = () => this.next();
        this.dom.btnMode.onclick = () => this.cyclePlayMode();
        this.dom.btnShuffle.onclick = () => this.toggleShuffleMode();
        // v7.61 歌词开关：面板与频谱互斥展示
        this.dom.btnLyrics.onclick = () => this.toggleLyricsPanel();

        this.dom.searchInput.oninput = (e) => this.renderPlaylist(e.target.value.trim());

        this.audio.ontimeupdate = () => this.onTimeUpdate();
        this.audio.onloadedmetadata = () => this.onMetadataLoaded();
        this.audio.onended = () => this.onTrackEnded();

        this.dom.seekSlider.oninput = (e) => {
          if (this.audio.duration) {
            this.audio.currentTime = (e.target.value / 100) * this.audio.duration;
            // v8.25 #46 拖拽时波浪即时跟随（不等 ~4Hz timeupdate）
            if (this.wave) this.wave.setProgress(e.target.value / 100);
          }
        };
        this.dom.volumeSlider.oninput = (e) => {
          this.audio.volume = e.target.value;
          saveMusicPrefs({ volume: parseFloat(e.target.value) }); // v7.44：音量落盘
        };

        window.addEventListener('dragover', (e) => {
          e.preventDefault();
          this.dom.dragOverlay.classList.add('active');
        });
        window.addEventListener('dragleave', (e) => {
          if (e.relatedTarget === null) {
            this.dom.dragOverlay.classList.remove('active');
          }
        });
        window.addEventListener('drop', (e) => {
          e.preventDefault();
          this.dom.dragOverlay.classList.remove('active');
          if (e.dataTransfer.files && e.dataTransfer.files.length) {
            this.handleFiles(e.dataTransfer.files);
          }
        });

        // 修复点击搜索框时可能触发的拖动 (防止意外)
        this.dom.searchInput.addEventListener('dragstart', (e) => e.preventDefault());
      }

      parseFileName(fileName) {
        const cleanName = fileName.replace(/\.[^/.]+$/, "");
        const parts = cleanName.split('-');
        if (parts.length > 1) {
          return {
            artist: parts[0].trim(),
            title: parts.slice(1).join('-').trim()
          };
        }
        return { artist: "未知艺术家", title: cleanName };
      }

      /* ---- v7.61 文件分类入口：压缩包 / 歌词 / 封面 / 音频分轨处理 ---- */
      handleFiles(fileList) {
        const files = Array.from(fileList || []);
        if (!files.length) return;
        const ARCHIVE_RE = /\.(zip|tar|tgz)$/i;
        const archives = files.filter(f => ARCHIVE_RE.test(f.name));
        if (archives.length) {
          // 压缩包优先：包内已含全套（音频+封面+歌词），避免与散选混装
          archives.forEach(f => this.importArchive(f));
          return;
        }
        const audioFiles = files.filter(f =>
          f.type.startsWith('audio/') || /\.(mp3|wav|flac|aac|ogg|oga|m4a|m4b|opus)$/i.test(f.name)
        );
        if (!audioFiles.length) return;

        // 同批携带的 .lrc/.txt 歌词与封面图：按 basename 配对（v7.61）
        const lrcMap = new Map();
        let genericCover = null;
        for (const f of files) {
          if (/\.(lrc|txt)$/i.test(f.name)) {
            f.text().then(t => {
              if (/\[\d{1,3}:\d{1,2}/.test(t)) lrcMap.set(f.name.replace(/\.[^/.]+$/, '').toLowerCase(), t);
            }).catch(() => {});
          } else if (/\.(jpe?g|png|webp|bmp|gif)$/i.test(f.name) && !genericCover) {
            genericCover = { file: f, basename: f.name.replace(/\.[^/.]+$/, '').toLowerCase() };
          }
        }

        const wasEmpty = this.tracks.length === 0;
        const newTracks = audioFiles.map(file => {
          const { artist, title } = this.parseFileName(file.name);
          const ext = file.name.split('.').pop() || 'AUD';
          return {
            id: Math.random().toString(36).substr(2, 9),
            file: file,
            url: URL.createObjectURL(file),
            title: title,
            artist: artist,
            ext: ext.toUpperCase(),
            metaDone: false // v7.61：元数据懒解析标记
          };
        });

        this.tracks.push(...newTracks);
        audioFiles.forEach(f => fsWrite('/music/' + f.name, f)); // v7.44：音频本体入 VFS
        this.updateViewState();
        this.renderPlaylist();

        // v7.61：元数据（封面/标签/歌词）异步解析，不阻塞列表渲染；完成即刷新
        newTracks.forEach((track, i) => {
          const lrcText = lrcMap.get(track.file.name.replace(/\.[^/.]+$/, '').toLowerCase());
          const pairCover = genericCover && genericCover.basename === track.file.name.replace(/\.[^/.]+$/, '').toLowerCase()
            ? genericCover.file : null;
          this.parseTrackMeta(track, { lrcText, pairCover });
        });

        if (wasEmpty) {
          this.loadTrack(0, false); // 不自动播放，避免浏览器自动播放限制
        }
      }

      /* ---- v7.61 轻提示 ---- */
      showArchiveToast(msg, hold = 2600) {
        const el = this.dom.archiveToast;
        if (!el) return;
        this.dom.archiveToastText.textContent = msg;
        el.classList.add('active');
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => el.classList.remove('active'), hold);
      }

      /* ---- v7.61 压缩包导入：zip（readZip）/ tar / tar.gz（parseTar）----
         包内清单期望：音频本体 + 专辑封面图（cover/front/album 命中优先）
         + .lrc/.txt 歌词（按 basename 配对），目录结构与命名习惯宽容。 */
      async importArchive(file) {
        const mm = window.__mediaMeta;
        if (!mm) { this.showArchiveToast('当前环境不支持压缩包解析'); return; }
        this.showArchiveToast('正在解压 ' + file.name + ' …', 60000);
        try {
          const buf = new Uint8Array(await file.arrayBuffer());
          let entries;
          if (/\.zip$/i.test(file.name)) {
            const res = await mm.readZip(buf, {
              limits: { maxZipSize: 512 * 1024 * 1024, maxFileUncompressed: 192 * 1024 * 1024, maxEntries: 4096, maxTotalUncompressed: 768 * 1024 * 1024 }
            });
            entries = res.files.map(f => ({ path: f.path, data: f.data }));
          } else {
            let u8 = buf;
            if (/\.(tgz|gz)$/i.test(file.name)) u8 = await mm.gunzipBytes(buf);
            entries = mm.parseTar(u8);
          }
          const cls = mm.classifyZipEntries(entries);
          if (!cls.audio.length) {
            this.showArchiveToast('压缩包内未发现音频文件');
            return;
          }
          const AUDIO_MIME = { mp3: 'audio/mpeg', flac: 'audio/flac', m4a: 'audio/mp4', m4b: 'audio/mp4', wav: 'audio/wav', aac: 'audio/aac', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg', wma: 'audio/x-ms-wma' };
          const wasEmpty = this.tracks.length === 0;
          const newTracks = cls.audio.map(a => {
            const ext = (a.name.match(/\.([a-z0-9]+)$/i) || [])[1] || 'AUD';
            const f = new File([a.data], a.name, { type: AUDIO_MIME[ext.toLowerCase()] || 'audio/mpeg' });
            const { artist, title } = this.parseFileName(a.name.replace(/\.[^/.]+$/, ''));
            const track = {
              id: Math.random().toString(36).substr(2, 9),
              file: f,
              url: URL.createObjectURL(f),
              title, artist,
              ext: ext.toUpperCase(),
              metaDone: false,
              // 包内清单直映射：歌词文本 / 同目录封面（在 parseTrackMeta 里消费）
              pkgLrcText: cls.lyrics.get(mm.basenameNoExt(a.path)) || null,
              pkgCover: (() => {
                const c = mm.coverForAudio(cls.covers, a.path);
                return c ? { data: c.data, mime: c.mime } : null;
              })()
            };
            fsWrite('/music/' + f.name, f);
            return track;
          });
          this.tracks.push(...newTracks);
          this.updateViewState();
          this.renderPlaylist();
          newTracks.forEach(t => this.parseTrackMeta(t));
          if (wasEmpty) this.loadTrack(0, false);
          const withCover = cls.covers.length ? '，含封面' : '';
          const withLrc = cls.lyrics.size ? '，含歌词' : '';
          this.showArchiveToast('已导入 ' + newTracks.length + ' 首乐曲' + withCover + withLrc);
        } catch (e) {
          this.showArchiveToast('解压失败：' + (e && e.message ? e.message : '文件损坏或格式不支持'));
        }
      }

      /* ---- v7.61 元数据懒解析：内置封面 / 标签修正 / 歌词 ----
         来源优先级：包内/同批 .lrc > ID3 USLT / Vorbis LYRICS / MP4 ©lyr；
         封面：ID3 APIC / FLAC PICTURE / MP4 covr > 包内同目录图 > 同名散图。 */
      async parseTrackMeta(track, opts = {}) {
        if (track.metaDone) return;
        track.metaDone = true;
        const mm = window.__mediaMeta;
        if (!mm) return;
        try {
          const blob = track.file || await fetch(track.url).then(r => r.ok ? r.blob() : null).catch(() => null);
          if (!blob) return;
          const head = new Uint8Array(await blob.slice(0, 3 * 1024 * 1024).arrayBuffer());
          const meta = mm.parseAudioMeta(head);
          if (meta.title) track.title = meta.title;
          if (meta.artist) track.artist = meta.artist;
          if (meta.album) track.album = meta.album;

          // 封面：内置 > 包内同目录 > 同名散图
          if (meta.cover) {
            track.coverUrl = URL.createObjectURL(new Blob([meta.cover.data], { type: meta.cover.mime }));
          } else if (track.pkgCover) {
            track.coverUrl = URL.createObjectURL(new Blob([track.pkgCover.data], { type: track.pkgCover.mime }));
          } else if (opts.pairCover) {
            track.coverUrl = URL.createObjectURL(opts.pairCover);
          }

          // 歌词：同批/包内 .lrc > 内嵌（同步按 LRC 解析；非同步整段按时长均布）
          const lrcText = opts.lrcText || track.pkgLrcText || null;
          const embedded = meta.lyricsSynced ? meta.lyrics : null;
          const plain = !lrcText && !embedded && meta.lyrics ? meta.lyrics : null;
          if (lrcText || embedded) {
            track.lyrics = mm.parseLrc(lrcText || embedded);
          } else if (plain && plain.trim()) {
            const lines = plain.split(/\r\n|\n|\r/).map(s => s.trim()).filter(Boolean);
            if (lines.length) track.lyrics = lines.map((text, i) => ({ t: -1, text, _plainIdx: i }));
          }
          track.pkgLrcText = null; track.pkgCover = null; // 释放包内大缓冲
          this.renderPlaylist(this.dom.searchInput.value.trim());
          if (this.tracks[this.currentIndex] === track) {
            // v7.61：ID3 标签晚到时同步刷新播放台文案（此前只刷封面/歌词，标题滞留文件名解析值）
            this.dom.nowTitle.textContent = track.title;
            this.dom.nowArtist.textContent = track.artist;
            this.applyCoverUI(track);
            this.prepareLyricsUI(track);
          }
        } catch (e) { /* 元数据解析失败不影响播放 */ }
      }

      /* ---- v7.61 播放台封面应用 ---- */
      applyCoverUI(track) {
        const img = this.dom.albumArtImg;
        if (!img) return;
        if (track && track.coverUrl && img.src !== track.coverUrl) {
          img.src = track.coverUrl;
          img.style.display = 'block';
        } else if (!track || !track.coverUrl) {
          img.style.display = 'none';
          img.removeAttribute('src');
        }
      }

      /* ---- v7.61 歌词 UI：渲染 / 开关 / 跟随高亮 / 点击跳转 ---- */
      prepareLyricsUI(track) {
        const has = !!(track && track.lyrics && track.lyrics.length);
        this.dom.btnLyrics.style.display = has ? '' : 'none';
        if (!has && this.lyricsOn) this.toggleLyricsPanel();
        if (this.lyricsOn) this.renderLyrics();
      }

      toggleLyricsPanel() {
        this.lyricsOn = !this.lyricsOn;
        this.dom.btnLyrics.classList.toggle('active', this.lyricsOn);
        const track = this.tracks[this.currentIndex];
        if (this.lyricsOn) {
          this.dom.lyricsPanel.style.display = 'block';
          this.dom.canvas.style.display = 'none';
          this.renderLyrics();
        } else {
          this.dom.lyricsPanel.style.display = 'none';
          this.dom.canvas.style.display = 'block';
        }
        saveMusicPrefs({ lyricsOn: this.lyricsOn });
      }

      renderLyrics() {
        const ul = this.dom.lyricsList;
        const track = this.tracks[this.currentIndex];
        ul.innerHTML = '';
        this._lyricEls = [];
        this._lyricActive = -1;
        const lyrics = track && track.lyrics;
        if (!lyrics || !lyrics.length) {
          const li = document.createElement('li');
          li.className = 'no-lyrics';
          li.textContent = '暂无歌词';
          this.dom.lyricsPanel.classList.add('no-lyrics');
          ul.appendChild(li);
          return;
        }
        this.dom.lyricsPanel.classList.remove('no-lyrics');
        const dur = this.audio.duration || 0;
        lyrics.forEach((l, i) => {
          const li = document.createElement('li');
          li.textContent = l.text;
          // 非同步歌词（整段 USLT）：时长可测后按时长均布时间戳
          const t = l.t >= 0 ? l.t : (l._plainIdx !== undefined && dur ? (l._plainIdx / lyrics.length) * dur : -1);
          if (t >= 0) {
            li.dataset.t = String(t);
            li.onclick = () => { this.audio.currentTime = t; if (this.audio.paused) this.togglePlay(); };
          } else {
            li.onclick = null;
            li.style.cursor = 'default';
          }
          this._lyricEls.push({ li, t });
          ul.appendChild(li);
        });
        this._lyricActive = -1;
        this.updateLyricsHighlight(true);
      }

      updateLyricsHighlight(force = false) {
        if (!this.lyricsOn || !this._lyricEls || !this._lyricEls.length) return;
        if (this._lyricEls[0] && this._lyricEls[0].t < 0) return; // 纯静态（无时间标签且时长未知）
        const t = this.audio.currentTime || 0;
        // 顺序指针：歌词按时间升序，播放推进只需 O(1) 前进 / 一次回退扫描
        let idx = -1;
        for (let i = 0; i < this._lyricEls.length; i++) {
          if (this._lyricEls[i].t <= t + 0.05) idx = i; else break;
        }
        if (idx === this._lyricActive && !force) return;
        if (this._lyricActive >= 0 && this._lyricEls[this._lyricActive]) {
          this._lyricEls[this._lyricActive].li.classList.remove('active');
        }
        this._lyricActive = idx;
        if (idx >= 0) {
          const li = this._lyricEls[idx].li;
          li.classList.add('active');
          const vp = this.dom.lyricsPanel.clientHeight;
          const target = li.offsetTop - vp / 2 + li.offsetHeight / 2;
          this.dom.lyricsList.style.transform = `translateY(${(-Math.max(0, target)).toFixed(1)}px)`;
        }
      }

      /* ---- 桌面集成：宿主「导入本地音乐」浮层投递（postMessage 只有 blob URL，无 File 对象） ---- */
      addExternalTrack(url, name) {
        const fileName = name || '本地音乐';
        // v7.61：宿主浮层投递的压缩包 → fetch Blob 走 importArchive 全套解包链路
        if (/\.(zip|tar|tgz)$/i.test(fileName)) {
          fetch(url).then(r => r.ok ? r.blob() : null).then(b => {
            if (b) this.importArchive(new File([b], fileName));
          }).catch(() => this.showArchiveToast('压缩包拉取失败'));
          return;
        }
        const { artist, title } = this.parseFileName(fileName);
        const dot = fileName.lastIndexOf('.');
        const ext = dot > 0 ? fileName.slice(dot + 1).toUpperCase() : 'AUD';
        const wasEmpty = this.tracks.length === 0;
        this.tracks.push({
          id: Math.random().toString(36).substr(2, 9),
          file: null,
          url: url,
          title: title,
          artist: artist,
          ext: ext,
          vfsName: fileName // v7.44：记录 VFS 对应文件名
        });
        // v7.44：拉取 Blob 入 VFS（深链/浮层只有 URL，需先 fetch；失败则保持会话级）
        try {
          fetch(url).then(r => r.ok ? r.blob() : null).then(b => { if (b) fsWrite('/music/' + fileName, b); }).catch(() => {});
        } catch (e) {}
        this.updateViewState();
        this.renderPlaylist();
        if (wasEmpty) this.loadTrack(0, false); // 与本地导入一致：只装载不自动播放
      }

      /* ---- v7.25 主题同步 / v7.28 多彩化：从文档 --md-h 读取基色相（条色/封面渐变按需派生） ---- */
      refreshThemeColors() {
        try {
          const raw = getComputedStyle(document.documentElement).getPropertyValue('--md-h');
          const h = parseInt(raw, 10);
          if (!isNaN(h) && h >= 0 && h < 360) this.themeHue = h;
        } catch (e) {}
        // v8.25 #46 主题切换联动波浪三色（宿主 set-theme-hue / 明暗切换钩子）
        if (this.wave) this.wave.setColors(this.resolveWaveColors());
      }

      /* ---- v8.25 #46 波浪配色 resolve：on-surface 系（暗底→白浪，浅底→深浪，
             与通知卡深底白浪同构同观感）；CSS 变量引用需经 computed 取真实色值 ---- */
      resolveWaveColors() {
        const out = { activeColor: 'rgba(255,255,255,1)', inactiveColor: 'rgba(255,255,255,0.3)', thumbColor: 'rgba(255,255,255,1)' };
        try {
          const probe = document.createElement('span');
          probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;';
          document.body.appendChild(probe);
          probe.style.color = 'var(--c-ink)';
          const ink = getComputedStyle(probe).color;
          probe.remove();
          if (ink && ink !== 'var(--c-ink)') {
            const faded = ink.replace(/^rgb\(/, 'rgba(').replace(/\)$/, ', 0.3)');
            out.activeColor = ink;
            out.thumbColor = ink;
            out.inactiveColor = faded !== ink ? faded : out.inactiveColor;
          }
        } catch (e) {}
        return out;
      }

      /* ---- v7.28 多彩频谱：条位色相沿基色相左右散布（±75°，全宽 150°），
             交替明度保留扁平几何节奏；任意主题基色相下全谱整体旋转、观感自洽 ---- */
      vizBarColor(i, n) {
        const t = n > 1 ? i / (n - 1) : 0.5;
        const h = (this.themeHue + Math.round((t - 0.5) * 150) + 720) % 360;
        return `hsl(${h}, 93%, ${i % 2 === 0 ? 52 : 42}%)`;
      }

      /* ---- 桌面集成：媒体状态回报（MEDIA_STATE_SYNC，与旧音乐应用协议兼容，宿主消费可选）
             v7.93：coverGradient 渐变字段退役 —— 媒体卡底回归纯色（扁平视觉标识） ---- */
      syncToParent() {
        if (!window.parent || window.parent === window) return;
        const t = this.tracks[this.currentIndex];
        try {
          window.parent.postMessage({
            type: 'MEDIA_STATE_SYNC',
            payload: {
              title: t ? t.title : '',
              artist: t ? t.artist : '',
              isPlaying: this.isPlaying,
              currentTime: this.audio.currentTime || 0,
              duration: this.audio.duration || 0
              // v7.93 coverGradient 退役（接收端 media-service 已删）—— 媒体卡底回归纯色
            }
          }, '*');
        } catch (e) {}
      }

      updateViewState() {
        if (this.tracks.length > 0) {
          this.dom.emptyView.style.display = 'none';
          this.dom.workspaceView.style.display = 'grid';
        } else {
          this.dom.emptyView.style.display = 'flex';
          this.dom.workspaceView.style.display = 'none';
        }
      }

      renderPlaylist(filter = '') {
        this.dom.trackContainer.innerHTML = '';
        const lowerFilter = filter.toLowerCase();

        this.tracks.forEach((track, index) => {
          if (filter &&
              !track.title.toLowerCase().includes(lowerFilter) &&
              !track.artist.toLowerCase().includes(lowerFilter)) {
            return;
          }

          const li = document.createElement('li');
          li.className = `track-item ${index === this.currentIndex ? 'active' : ''}`;
          // v7.61：有封面的曲目以缩略图替代序号位
          const lead = track.coverUrl
            ? `<img class="track-thumb" src="${track.coverUrl}" alt="" loading="lazy">`
            : `<span class="track-index">${String(index + 1).padStart(2, '0')}</span>`;
          li.innerHTML = `
            ${lead}
            <div class="track-info">
              <div class="track-name">${this.escapeHTML(track.title)}</div>
              <div class="track-artist">${this.escapeHTML(track.artist)}</div>
            </div>
            <div class="track-meta">
              ${track.lyrics && track.lyrics.length ? '<span class="track-badge" title="含歌词">词</span>' : ''}
              <span class="track-badge">${track.ext}</span>
            </div>
          `;
          li.onclick = () => this.loadTrack(index, true);
          this.dom.trackContainer.appendChild(li);
        });
      }

      loadTrack(index, autoPlay = false) {
        if (index < 0 || index >= this.tracks.length) return;
        this.currentIndex = index;
        saveMusicPrefs({ currentIndex: index }); // v7.44：当前曲目落盘
        const track = this.tracks[index];

        this.audio.src = track.url;
        this.dom.nowTitle.textContent = track.title;
        this.dom.nowArtist.textContent = track.artist;
        this.renderPlaylist(this.dom.searchInput.value.trim());
        this.applyCoverUI(track);          // v7.61：封面即时代入（已解析则直接展示）
        this.prepareLyricsUI(track);       // v7.61：歌词按钮可用性 / 面板重建
        if (!track.metaDone) this.parseTrackMeta(track); // v7.61：VFS 恢复/深链曲目的懒解析
        this.syncToParent();

        if (autoPlay) {
          this.initAudioContext();
          this.audio.play().then(() => {
            // v7.24 竞态防护：play() 起播后可能已被快速 pause（曲目结束循环切换 / 用户急点 /
            // 深链装载后立即暂停）—— 此时 promise 仍会 resolve（Chromium 语义：起播即 resolve），
            // 盲目置 true 会造成「isPlaying=true 但实际暂停」状态污染（图标/频谱/宿主回报全错）
            if (!this.audio.paused) this.setPlayState(true);
          }).catch(console.error);
        } else {
          // 即使不播放，也让进度条显示总时长
          this.audio.load(); 
        }
      }

      initAudioContext() {
        if (!this.audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AudioContext();
          this.analyser = this.audioCtx.createAnalyser();
          this.analyser.fftSize = 64;
          this.sourceNode = this.audioCtx.createMediaElementSource(this.audio);
          this.sourceNode.connect(this.analyser);
          this.analyser.connect(this.audioCtx.destination);
          this.kickViz();
        }
        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      }

      togglePlay() {
        if (this.currentIndex === -1 && this.tracks.length > 0) {
          this.loadTrack(0, true);
          return;
        }
        this.initAudioContext();
        if (this.audio.paused) {
          this.audio.play().then(() => {
            if (!this.audio.paused) this.setPlayState(true); // 同 loadPlay 竞态防护（v7.24）
          }).catch(console.error);
        } else {
          this.audio.pause();
          this.setPlayState(false);
        }
      }

      setPlayState(playing) {
        this.isPlaying = playing;
        if (this.a17Btn) {
          // v8.25 #46 A17 引擎接管图标（官方 AVD morph）——硬切退役；圆角随播放态 morph
          this.a17Btn.setState(playing);
        } else if (playing) {
          this.dom.playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
        } else {
          this.dom.playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
        }
        if (this.dom.artRings) {
          if (playing) this.dom.artRings.classList.add('playing');
          else this.dom.artRings.classList.remove('playing');
        }

    /** CSS cubic-bezier 同构采样（控制点 x∈[0,1] 单调，二分求逆） */

      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sampleX = (s) => ((ax * s + bx) * s + cx) * s;
      const sampleY = (s) => ((ay * s + by) * s + cy) * s;
      return (t) => {
        if (t <= 0) return 0;
        if (t >= 1) return 1;
        let lo = 0, hi = 1, s = t;
        for (let i = 0; i < 24; i++) {
          const x = sampleX(s);
          if (Math.abs(x - t) < 1e-6) break;
          if (x < t) lo = s; else hi = s;
          s = (lo + hi) / 2;
        }
        return sampleY(s);
      };
    }

    const NS = 'http://www.w3.org/2000/svg';
    const noAnim = () => document.documentElement.classList.contains('no-anim');

    /**
     * A17 播放/暂停按钮动效引擎（PlayPauseAction 同构）。
     * @param {HTMLButtonElement} btn .play-btn-large（CSS 尺寸/配色已落）
     */
    function createA17PlayButton(btn) {
      const svg = btn.querySelector('svg');
      const p1 = document.createElementNS(NS, 'path');
      const p2 = document.createElementNS(NS, 'path');
      p1.setAttribute('fill', 'currentColor');
      p2.setAttribute('fill', 'currentColor');
      p1.setAttribute('transform', `translate(${T1.x} ${T1.y}) scale(0.333)`);
      const svgNew = svg.cloneNode(false);
      svgNew.appendChild(p1); svgNew.appendChild(p2);
      svg.replaceWith(svgNew);
      svgNew.id = 'playIcon';

      // 当前形态参数：p=0 播放三角 / p=1 暂停双杠；tx 独立驱动（曲线与 d 不同）
      // v8.25 #46 勘正：初始 = 暂停态 → 图标应为 play 三角（A17 atEnd = state ==
      // Playing 语义：播放中才显示 pause 杠）；圆角 48px 与图标形态独立（各自端点）
      let p = 0, tx = TX_PLAY;
      let morphRaf = 0, pulseRaf = 0, cornerRaf = 0, scale = 1;
      const apply = () => {
        p1.setAttribute('d', lerpSeq(PLAY_SEQ, PAUSE1_SEQ, p));
        p2.setAttribute('d', lerpSeq(PLAY_SEQ, PAUSE2_SEQ, p));
        p2.setAttribute('transform', `translate(${tx.toFixed(4)} ${T1.y}) scale(0.333)`);
      };
      apply();                                 // 初始渲染 play 三角（暂停态语义）

      const corner = new Spring({ mass: 1, stiffness: 400, damping: 40, initialValue: 48 });
      const cornerTick = (now) => {
        const dt = Math.min((now - (corner._last || now)) / 1000, 0.05);
        corner._last = now;
        corner.update(dt);
        btn.style.borderRadius = corner.x.toFixed(2) + 'px';
        if (corner.isSettled(0.05, 0.05)) {
          corner.x = corner.target; corner.update(0);
          btn.style.borderRadius = corner.target.toFixed(2) + 'px';
          cornerRaf = 0;
        } else {
          cornerRaf = requestAnimationFrame(cornerTick);
        }
      };

      const obj = {
        /** 播放态迁移：圆角 spring + 图标 pathData morph（PlayPauseAction.cornerRadius） */
        setState(playing) {
          const target = playing ? 16 : 48;    // buttonCornerRadius: isPlaying→16dp else 48dp
          // v8.25 #46 勘正：p 目标 = playing ? 1 : 0（A17 atEnd = state == Playing：
          // 播放中显示 pause 杠、暂停显示 play 三角）；morph 方向（toPause）随之
          const toPause = playing;
          if (morphRaf) cancelAnimationFrame(morphRaf);
          if (cornerRaf) cancelAnimationFrame(cornerRaf);
          if (noAnim()) {                      // no-anim 全局开关：瞬时落位（磁贴先例同律）
            p = toPause ? 1 : 0; tx = toPause ? TX_PAUSE : TX_PLAY;
            apply();
            corner.x = target; corner.v = 0; corner.target = target;
            btn.style.borderRadius = target + 'px';
            return;
          }
          // d：单段 333ms；tx：正向单段 / 反向两段（AVD 时间轴逐字）
          const dEase = toPause ? EASE_D_TO_PAUSE : EASE_D_TO_PLAY;
          const dBez = makeBezier(...dEase);
          const fromP = p, fromTx = tx;
          const revMid = TX_PLAY + (TX_PAUSE - TX_PLAY) *
            ((15.485 - 12.321) / (15.485 - 7.576)); // AVD 反向中间点 12.321 → web 域
          const rev1 = makeBezier(...EASE_TX_REV_1);
          const rev2 = makeBezier(...EASE_TX_REV_2);
          const txDur = toPause ? MORPH_MS : TX_REV_MS1 + TX_REV_MS2;
          const txBez1 = makeBezier(...EASE_TX_TO_PAUSE);
          const start = performance.now();
          const tick = (now) => {
            const t = Math.min(1, (now - start) / MORPH_MS);
            p = fromP + ((toPause ? 1 : 0) - fromP) * dBez(t);
            const tt = Math.min(1, (now - start) / txDur);
            if (toPause) {
              tx = fromTx + (TX_PAUSE - fromTx) * txBez1(tt);
            } else if (tt < TX_REV_MS1 / txDur) {
              tx = fromTx + (revMid - fromTx) * rev1(tt / (TX_REV_MS1 / txDur));
            } else {
              tx = revMid + (TX_PLAY - revMid) * rev2((tt - TX_REV_MS1 / txDur) / (1 - TX_REV_MS1 / txDur));
            }
            apply();
            const settled = t >= 1 && tt >= 1;
            morphRaf = settled ? 0 : requestAnimationFrame(tick);
            if (settled) { p = toPause ? 1 : 0; tx = toPause ? TX_PAUSE : TX_PLAY; apply(); }
          };
          morphRaf = requestAnimationFrame(tick);
          corner.target = target;              // Spring 惰性重锚（setTarget 语义）
          corner._last = performance.now();
          cornerRaf = requestAnimationFrame(cornerTick);
        },
        /** 点击挤压脉冲：1→1.125→1（各 250ms tween FastOutSlowIn；连点从当前值重启） */
        pulse() {
          if (pulseRaf) cancelAnimationFrame(pulseRaf);
          if (noAnim()) return;                // 动效关闭不脉冲（语义同磁贴）
          const from = scale;
          const up = makeBezier(...EASE_FOSI);
          const start = performance.now();
          const tick = (now) => {
            const t1 = (now - start) / PULSE_MS;
            if (t1 < 1) {
              scale = from + (PULSE_SCALE - from) * up(t1);
            } else {
              const t2 = Math.min(1, (now - start - PULSE_MS) / PULSE_MS);
              scale = PULSE_SCALE + (1 - PULSE_SCALE) * up(t2);
              if (t2 >= 1) { scale = 1; btn.style.transform = ''; pulseRaf = 0; return; }
            }
            btn.style.transform = `scale(${scale.toFixed(4)})`;
            pulseRaf = requestAnimationFrame(tick);
          };
          pulseRaf = requestAnimationFrame(tick);
        },
      };
      return obj;
    }

    window.__a17MediaButton = { create: createA17PlayButton };
  </script>
  <!-- v7.77 M3E 扩场景：下拉刷新（重渲染曲库列表）+ AOSP 边缘拉伸（.track-list 内滚容器） -->
  <script src="../_shared/m3e-mini.js"></script>
