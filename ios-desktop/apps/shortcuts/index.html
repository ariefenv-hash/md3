<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="../freeze-shim.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>快捷指令</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_shared/md3-tokens.css">
<style>
/* v7.26 MD3 统一：色彩全部来自共享规范令牌层（_shared/md3-tokens.css），
   自有变量仅作语义别名，不再自派生色相；磁贴底色用 P/S/T 容器角色。 */
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--bg:var(--md-surface);--sf:var(--md-surface-container);--sv:var(--md-surface-container-high);--m:var(--md-on-surface);--sub:var(--md-on-surface-variant);--acc:var(--md-accent);--r:var(--md-r-md);--rp:var(--md-r-full)}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--md-font);background:var(--bg);color:var(--m)}
.app{height:100vh;overflow-y:auto;padding:60px 16px 20px}
.header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-bottom:1px solid var(--md-outline-variant);z-index:10;font-size:20px;font-weight:600}
.section-title{font-size:14px;font-weight:600;color:var(--sub);margin:16px 0 8px}
.shortcut-card{background:var(--sf);border-radius:var(--r);padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background var(--md-duration-fast-effects,150ms) var(--md-easing-standard, cubic-bezier(0.2,0,0,1)),transform var(--md-duration-fast-effects,150ms) var(--md-easing-spring-fast-effects, cubic-bezier(0.31,0.94,0.34,1)),border-radius var(--md-duration-fast-effects,150ms) var(--md-easing-spring-fast-effects, cubic-bezier(0.31,0.94,0.34,1));animation:sc-list-in var(--md-duration-medium,400ms) var(--md-easing-emphasized-decelerate, cubic-bezier(0.05,0.7,0.1,1)) both}
.shortcut-card:active{background:var(--sv);transform:scale(.985);border-radius:calc(var(--r) * .82)}
.shortcut-icon{width:44px;height:44px;border-radius:var(--md-r-sm);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.shortcut-icon svg{fill:currentColor}
/* MD3 色彩角色磁贴：明暗两套方案下图标/底色对比度自动成立 */
.ti-primary{background:var(--md-primary);color:var(--md-on-primary)}
.ti-tonal{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.ti-secondary{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.ti-tertiary{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.ti-accent{background:var(--md-accent-container);color:var(--md-accent)}
.ti-neutral{background:var(--md-surface-container-highest);color:var(--md-on-surface)}
.shortcut-name{font-size:15px;font-weight:600}
.shortcut-desc{font-size:12px;color:var(--sub)}
.run-btn{margin-left:auto;background:var(--acc);color:var(--md-on-primary);border:none;padding:8px 20px;border-radius:var(--rp);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--md-font);transition:transform var(--md-duration-fast-effects,150ms) var(--md-easing-spring-fast-effects, cubic-bezier(0.31,0.94,0.34,1))}
.run-btn:active{transform:scale(.95)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--sv);color:var(--m);padding:12px 24px;border-radius:var(--rp);font-size:14px;z-index:100;opacity:0;transition:opacity var(--md-duration-short,200ms) var(--md-easing-emphasized-accelerate, cubic-bezier(0.3,0,0.8,0.15)),transform var(--md-duration-short,200ms) var(--md-easing-emphasized-decelerate, cubic-bezier(0.05,0.7,0.1,1));box-shadow:var(--md-shadow-2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:600px){.app{max-width:500px;margin:0 auto}}
/* v11.05 #313 V8 批：窄屏真适配（≤360px）——卡片内距收窄 + 图标降档 + 头部字号降档（布局实质差异，非空查询） */
@media(max-width:360px){
  .shortcut-card{padding:12px;margin-bottom:10px;gap:10px}
  .shortcut-icon{width:38px;height:38px;font-size:19px}
  .header{font-size:17px}
}
/* v11.05 #245 批 2 基础档：列表进入（曲线取自运动令牌） */
@keyframes sc-list-in{from{opacity:0;transform:translateY(8px)}}


    /* V4 状态层（#306 批 2）：按压态令牌（#262 批 1 photos 先例同款），悬停/静态零变化 */
    .run-btn:active { background: var(--md-state-pressed, rgba(255,255,255,0.12)); }

</style>
</head>
<body>
<div class="header">快捷指令</div>
<div class="app">
  <div class="section-title"><svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-align:-0.15em;fill:currentColor"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg> 收藏的快捷指令</div>
  <div class="shortcut-card" data-run="weather" role="button" tabindex="0" aria-label="快捷指令：打开天气——查看当前天气">
    <div class="shortcut-icon ti-primary"><svg viewBox="0 0 24 24" style="width:20px;height:20px;display:block"><circle cx="7.5" cy="7.5" r="3.2"/><path d="M19.35 12.04C18.67 8.59 15.64 6 12 6c-2.89 0-5.4 1.64-6.65 4.04C2.34 10.36 0 12.91 0 16c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" transform="translate(0 -2.5)"/></svg></div>

    <div class="shortcut-icon ti-tertiary"><svg viewBox="0 0 24 24" style="width:20px;height:20px;display:block"><path d="M15 1H9v2h6V1zm-2 13h-2V8h2v6zm6.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></div>
    <div><div class="shortcut-name">5分钟计时器</div><div class="shortcut-desc">打开时钟并立即开始计时</div></div>
    <button class="run-btn">运行</button>
  </div>
  <div class="shortcut-card" data-run="translate-clipboard" role="button" tabindex="0" aria-label="快捷指令：翻译剪贴板——读取剪贴板文本并自动翻译">
    <div class="shortcut-icon ti-tonal"><svg viewBox="0 0 24 24" style="width:20px;height:20px;display:block"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg></div>
    <div><div class="shortcut-name">翻译剪贴板</div><div class="shortcut-desc">读取剪贴板文本并自动翻译</div></div>
    <button class="run-btn">运行</button>
  </div>
  <div class="shortcut-card" data-run="msg" role="button" tabindex="0" aria-label="快捷指令：发送消息——快速发消息给联系人">
    <div class="shortcut-icon ti-secondary"><svg viewBox="0 0 24 24" style="width:20px;height:20px;display:block"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
    <div><div class="shortcut-name">发送消息</div><div class="shortcut-desc">快速发消息给联系人</div></div>
    <button class="run-btn">运行</button>
  </div>
  <div class="shortcut-card" data-run="note" role="button" tabindex="0" aria-label="快捷指令：新建备忘——打开备忘录并新建便签">
    <div class="shortcut-icon ti-accent"><svg viewBox="0 0 24 24" style="width:20px;height:20px;display:block"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12h-2v-2h2v2zm0-4h-2V6h2v4z"/></svg></div>
    <div><div class="shortcut-name">新建备忘</div><div class="shortcut-desc">打开备忘录并新建便签</div></div>
    <button class="run-btn">运行</button>
  </div>
  <div class="section-title"><svg viewBox="0 0 24 24" style="width:1em;height:1em;vertical-align:-0.15em;fill:currentColor"><path d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14z"/></svg> 建议的快捷指令</div>
  <div class="shortcut-card" data-run="home" role="button" tabindex="0" aria-label="快捷指令：回家路线——导航回家">
    <div class="shortcut-icon ti-neutral"><svg viewBox="0 0 24 24" style="width:20px;height:20px;display:block"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
    <div><div class="shortcut-name">回家路线</div><div class="shortcut-desc">导航回家</div></div>
    <button class="run-btn">运行</button>
  </div>
  <div class="shortcut-card" data-run="music" role="button" tabindex="0" aria-label="快捷指令：播放音乐——继续播放上次歌曲">
    <div class="shortcut-icon ti-primary"><svg viewBox="0 0 24 24" style="width:20px;height:20px;display:block"><path d="M12 3v11.05c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
    <div><div class="shortcut-name">播放音乐</div><div class="shortcut-desc">继续播放上次歌曲</div></div>
    <button class="run-btn">运行</button>
  </div>
  <div class="shortcut-card" data-run="reminder" role="button" tabindex="0" aria-label="快捷指令：添加提醒——新建一条待办任务">
    <div class="shortcut-icon ti-tonal"><svg viewBox="0 0 24 24" style="width:20px;height:20px;display:block"><path d="M12 22a2.3 2.3 0 0 0 2.3-2.3H9.7A2.3 2.3 0 0 0 12 22zm7.6-5.3v-1l-1.7-1.7V9.9c0-3-1.9-5.5-4.7-6.2v-.7a1.5 1.5 0 0 0-3 0v.7C7.4 4.4 5.6 6.9 5.6 9.9v4.1l-1.7 1.7v1z"/></svg></div>
    <div><div class="shortcut-name">添加提醒</div><div class="shortcut-desc">新建一条待办任务</div></div>
    <button class="run-btn">运行</button>
  </div>
  <div class="shortcut-card" data-run="cal-note" role="button" tabindex="0" aria-label="快捷指令：记今日笔记——打开日历定位到今天编辑">
    <div class="shortcut-icon ti-tertiary"><svg viewBox="0 0 24 24" style="width:20px;height:20px;display:block"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V9h14zM7 11h3v3H7zm5 0h5v1.5h-5zm0 3h5v1.5h-5z"/></svg></div>
    <div><div class="shortcut-name">记今日笔记</div><div class="shortcut-desc">打开日历定位到今天编辑</div></div>
    <button class="run-btn">运行</button>
  </div>
  <div class="shortcut-card" data-run="scan" role="button" tabindex="0" aria-label="快捷指令：扫描文档——使用相机扫描文件">
    <div class="shortcut-icon ti-neutral"><svg viewBox="0 0 24 24" style="width:20px;height:20px;display:block"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg></div>
    <div><div class="shortcut-name">扫描文档</div><div class="shortcut-desc">使用相机扫描文件</div></div>
    <button class="run-btn">运行</button>
  </div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>
<script src="./core.js"></script> <!-- #286 续 ref-only 第九批：SHORTCUT_LINKS 深链真源表 + USAGE_KEY + fmtLastRun 单源 core，真身先于主脚本同步加载 -->
<script>
// v7.26：主题（色相+明暗）由宿主三通道直写（注入样式/html inline/postMessage），
// 本页消费共享令牌层即可，无需自建监听。

// ==================== v7.19 应用互联：快捷指令全部接真实系统深链 ====================
// 旧版 8 卡片仅弹 toast 假动作 —— 现全部经 __system SDK（桌面注入，见 main.js）
// 调用 openApp（打开即动作，事件先入总线队列、挂载后补投）与 clipboard（真数据流）。
// 无桌面环境（独立打开本页）时优雅降级为提示，不再假装成功。
var toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(function(){toastEl.classList.remove('show')},2000);
}
function sysOpen(name, appId, event, payload, okMsg){
  var S=window.__system;
  if(!S||typeof S.openApp!=='function'){toast(name+'：桌面服务不可用');return;}
  S.openApp(appId, event?{event:event,payload:payload||{}}:undefined);
  toast(name+'：'+(okMsg||'已执行'));
}
var L = window.__shortcutsCore.SHORTCUT_LINKS; // #286 续第九批：深链契约单源走桥
var RUNNERS={
  'weather': function(el){ var l=L.weather; sysOpen(el.dataset.name||l.label, l.appId, l.event, l.payload, l.okMsg); },
  'timer': function(el){ var l=L.timer; sysOpen(el.dataset.name||l.label, l.appId, l.event, l.payload, l.okMsg); },
  'translate-clipboard': function(el){
    var S=window.__system, l=L['translate-clipboard'], name=el.dataset.name||l.label;
    if(!S||!S.clipboard||!S.openApp){toast(name+'：桌面服务不可用');return;}
    S.clipboard.read().then(function(item){
      var t=(item&&item.kind==='text')?String(item.text||'').trim():'';
      if(!t){toast(name+'：剪贴板没有可翻译的文本');return;}
      S.openApp(l.appId,{event:l.event,payload:{text:t.slice(0,2000)}});
      toast(name+'：'+l.okMsg);
    }).catch(function(){toast(name+'：剪贴板读取失败');});
  },
  'msg': function(el){ var l=L.msg; sysOpen(el.dataset.name||l.label, l.appId, l.event, l.payload, l.okMsg); },
  'note': function(el){ var l=L.note; sysOpen(el.dataset.name||l.label, l.appId, l.event, l.payload, l.okMsg); },
  'home': function(el){ var l=L.home; sysOpen(el.dataset.name||l.label, l.appId, l.event, l.payload, l.okMsg); },
  // v7.24：真·续播（music/play 事件—— 有曲则恢复播放、空列表/播放中无动作，不再是单纯打开）
  'music': function(el){ var l=L.music; sysOpen(el.dataset.name||l.label, l.appId, l.event, l.payload, l.okMsg); },
  // v7.24：新二卡 —— 提醒事项新建弹窗 / 日历今日笔记定位（打开即动作深链）
  'reminder': function(el){ var l=L.reminder; sysOpen(el.dataset.name||l.label, l.appId, l.event, l.payload, l.okMsg); },
  'cal-note': function(el){ var l=L['cal-note']; sysOpen(el.dataset.name||l.label, l.appId, l.event, l.payload, l.okMsg); },
  'scan': function(el){ var l=L.scan; sysOpen(el.dataset.name||l.label, l.appId, l.event, l.payload, l.okMsg); }
};
// ==================== v7.44 持久化：运行次数与上次运行时间 ====================
// 每次运行写入 localStorage（md3_shortcuts_usage_v1）；启动时在卡片描述行内
// 追加轻量「上次 · xx前」提示（无记录不显示，零布局扰动），重开应用不归零。
var USAGE_KEY = window.__shortcutsCore.USAGE_KEY; // #286 续第九批：用量键单源走桥
function loadUsage(){
  try { return JSON.parse(localStorage.getItem(USAGE_KEY) || '{}') || {}; } catch(e){ return {}; }
}
function saveUsage(u){
  try { localStorage.setItem(USAGE_KEY, JSON.stringify(u)); } catch(e){}
}
function fmtLastRun(ts){
  return window.__shortcutsCore.fmtLastRun(ts); // #286 续第九批：四档格式化单源委托 core 真身
}
function renderUsageHints(){
  var usage = loadUsage();
  document.querySelectorAll('.shortcut-card').forEach(function(card){
    var key = card.getAttribute('data-run');
    var rec = usage[key];
    var desc = card.querySelector('.shortcut-desc');
    if (!desc) return;
    var old = desc.querySelector('.shortcut-last');
    if (old) old.remove();
    if (rec && rec.lastRun) {
      var span = document.createElement('span');
      span.className = 'shortcut-last';
      span.style.cssText = 'display:block;margin-top:2px;font-size:10px;opacity:0.6;';
      span.textContent = '上次 ' + fmtLastRun(rec.lastRun) + (rec.count ? ' · 已运行 ' + rec.count + ' 次' : '');
      desc.appendChild(span);
    }
  });
}
document.querySelector('.app').addEventListener('click',function(e){
  var card=e.target.closest('.shortcut-card');
  if(!card)return;
  var key=card.getAttribute('data-run');
  var runner=RUNNERS[key];
  if(runner){
    var usage=loadUsage();
    var rec=usage[key]||{count:0};
    rec.lastRun=Date.now();
    rec.count=(rec.count||0)+1;
    usage[key]=rec;
    saveUsage(usage);
    renderUsageHints();
    runner(card);
  }
});
renderUsageHints();
</script>
</body>
</html>
