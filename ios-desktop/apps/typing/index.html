<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="../freeze-shim.js"></script>
<script src="../_shared/sanitize.js"></script> <!-- #240：__mdEscape 单一转义真源 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>打字练习 · 键指如飞</title>
  <link rel="stylesheet" href="../_shared/md3-tokens.css">
  <link rel="stylesheet" href="../_shared/idle-slider.css">
<style>
  /* ==================== v9.46 #181 第一批整改：#179 六条准入自证 ====================
     ① 全量 var(--md-*) 令牌（fallback 仅作令牌缺失兜底，music/markdown 同范式；
        --bad 警示红独立语义色，随暗色主题定值，不随 --md-h 旋转——markdown 同款保留）。
     ② @media 760px 两断点（手机/平板两套布局）。
     ③ 平板真分栏：左=练习区（bar/stats/drill），右=输入与自定义题源侧栏（#side），
        手机态 #side{display:contents} 保持原流式布局零变化。
     ④ SDK 接入：成绩历史落 VFS /documents/typing-records.json（__system.fs，IndexedDB 桥）
        + 新纪录 __system.notify（Heads-up + 通知中心）。
     ⑤ 形态语言：题面字号怠速柄滑条（细竖条怠速/hover 胶囊展开，markdown 同款）
        + 顶栏 chip 整排按压联动（pressRipple：邻项按距离衰减让位+圆角形变，
        tile-bounce.js Bounceable 数学同构轻量版，ζ=1 临界阻尼观感）。
        播放条波浪（⑤第 2 条）不适用：本应用无播放链路，无播放条可挂。 */
  :root {
    --bg: var(--md-surface, #101418);
    --panel: color-mix(in srgb, var(--md-surface-container, #1c2126) 88%, transparent);
    --text: var(--md-on-surface, #e2e2e9);
    --text-sub: var(--md-on-surface-variant, #9a9fa6);
    --accent: hsl(var(--md-h, 215) 70% 60%);
    --chip: var(--md-surface-container-high, #262b31);
    --bad: hsl(4 70% 62%);
    --outline: var(--md-outline-variant, #3c434b);        /* ① 语义层级补充：边框/分隔面 */
    --panel-highest: var(--md-surface-container-highest, #31363c); /* ① 语义层级补充：滑条未填充轨/高亮面 */
    --scrim: var(--md-scrim, hsl(220 14% 4% / 1));       /* ① 语义层级补充：模态遮罩 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--md-font, system-ui, -apple-system, 'Noto Sans SC', sans-serif); color: var(--text);
         display: flex; flex-direction: column; }

  /* 顶部工具条（模式 chips） */
  #bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 6px;
  }
  .chip {
    border: none; cursor: pointer; color: var(--text);
    background: var(--chip); border-radius: var(--md-r-full, 999px); padding: 7px 14px;
    font-size: 12.5px; font-weight: 500; letter-spacing: 0.2px;
    transition: transform var(--md-duration-short, 0.15s) ease, background var(--md-duration-short, 0.15s) ease;
  }
  .chip:hover { background: var(--md-state-hover); }
  .chip:active { transform: scale(0.94); background: var(--md-state-pressed); }
  .chip.on { background: var(--accent); color: var(--md-on-primary, #06222c); font-weight: 600; }
  .chip.best { background: var(--chip); color: var(--text-sub); cursor: default; }
  #title { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; margin-right: auto; }

  /* 统计条 */
  #stats {
    display: flex; gap: 14px; padding: 4px 16px 8px; font-size: 12.5px; color: var(--text-sub);
  }
  #stats b { color: var(--text); font-variant-numeric: tabular-nums; }

  /* 题面区 */
  #drill {
    flex: 1; overflow-y: auto; padding: 14px 18px 20px;
    font-family: var(--md-font-num, ui-monospace, 'SF Mono', Menlo, Consolas, monospace);
    font-size: 21px; line-height: 1.75; letter-spacing: 0.5px;
    border-radius: var(--md-r-lg, 16px); margin: 0 10px; background: var(--panel);
    cursor: text; -webkit-tap-highlight-color: transparent;
  }
  #drill .c { white-space: pre-wrap; }
  #drill .s-pend { color: var(--text-sub); opacity: 0.75; }
  #drill .s-ok { color: var(--accent); }
  #drill .s-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 18%, transparent); border-radius: var(--md-r-xs, 3px); }
  #drill .s-extra { color: var(--bad); text-decoration: underline wavy; }
  #drill .cur { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: var(--md-r-xs, 3px);
                animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { outline-color: transparent; } }

  /* 自由模式题源编辑 */
  #freeBox { display: none; padding: 10px 12px; }
  #freeBox.show { display: block; }
  #freeText {
    width: 100%; height: 84px; resize: none; border: 1px solid var(--outline); border-radius: var(--md-r-lg, 12px);
    background: var(--panel); color: var(--text); padding: 10px 12px; font-size: 14px;
    font-family: inherit;
  }
  #freeGo { margin-top: 8px; }

  /* 输入条 */
  #inputBar { padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
  #inp {
    width: 100%; border: none; border-radius: var(--md-r-lg, 12px); outline: none;
    background: var(--panel); color: var(--text);
    padding: 12px 14px; font-size: 15px; font-family: inherit;
  }
  #inp:focus { outline: 2px solid var(--accent); }
  #hint { padding: 6px 16px 0; font-size: 11.5px; color: var(--text-sub); }

  /* 成绩面板 */
  #panel {
    position: fixed; inset: 0; z-index: 9; display: none;
    align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--scrim) 55%, transparent); /* 遮罩用 --md-scrim 令牌（markdown 同款中性暗，随主题不至于死黑） */
  }
  #panel.show { display: flex; }
  #card {
    width: min(86%, 340px); background: var(--panel); border: 1px solid var(--outline); border-radius: var(--md-r-xl, 24px);
    padding: 22px 20px 18px; text-align: center; backdrop-filter: blur(14px);
  }

  /* ==================== ⑤ 怠速柄滑条（A17 Expressive slider idle-handle，markdown 同款） ==================== */
  #fontWrap { display: flex; align-items: center; gap: 7px; }
  #fontWrap .lab { font-size: 11px; color: var(--text-sub); white-space: nowrap; }
  #fontVal { font-size: 11.5px; color: var(--text); font-variant-numeric: tabular-nums; min-width: 30px; }
  /* v10.59 #227 滑块单源化：几何/轨道/拇指/focus/disabled 视觉规范已收编
     _shared/idle-slider.css（单一组件源，audit D 门禁禁止本地滑块伪元素）；
     此处仅保留布局与应用主题令牌映射 */
  .mdslider { width: 104px; --md-primary: var(--accent); --md-surface-container-highest: var(--panel-highest); --md-background: var(--bg); }

  /* 顶栏 chip 整排按压联动（⑤第 3 条）：JS 按压时叠加位移/圆角/缩放，抬指归零 */
  #bar .chip { transition: transform var(--md-duration-short, 0.18s) cubic-bezier(.2,0,0,1), border-radius var(--md-duration-short, 0.18s) cubic-bezier(.2,0,0,1), background var(--md-duration-short, 0.15s) ease; }

  /* ==================== ②③ 响应式：760px 断点，平板左练习右输入真分栏 ==================== */
  #side { display: contents; }
  @media (min-width: 760px) {
    body {
      display: grid;
      grid-template-columns: 1fr 330px;
      grid-template-rows: auto auto 1fr auto;
      grid-template-areas:
        "bar   bar"
        "stats stats"
        "drill side";
    }
    #bar { grid-area: bar; }
    #stats { grid-area: stats; }
    #drill { grid-area: drill; margin: 0 0 0 10px; }
    #side {
      display: flex; flex-direction: column; gap: 6px;
      grid-area: side; padding: 0 10px 4px 4px; min-height: 0;
    }
    #freeBox { display: none; flex: 1; overflow-y: auto; padding: 0 0 4px; }
    #freeBox.show { display: flex; flex-direction: column; }
    #inputBar { padding: 4px 0 0; }
  }
  @media (max-width: 759.98px) {
    /* 手机态：单栏流式（#side display:contents 保持原 DOM 视觉零变化） */
  }
  #card h2 { font-size: 17px; margin-bottom: 4px; }
  #grade { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 14px; }
  .metric { display: flex; justify-content: space-between; padding: 7px 4px; font-size: 14px; }
  .metric span { color: var(--text-sub); }
  .metric b { font-variant-numeric: tabular-nums; }
  #newBest { font-size: 12px; color: var(--accent); margin-top: 6px; display: none; }
  #card .row { display: flex; gap: 10px; margin-top: 16px; }
  #card .row .chip { flex: 1; text-align: center; }
</style>
</head>
<body>
  <div id="bar">
    <span id="title">打字练习</span>
    <button class="chip on" id="mWord" aria-pressed="true">单词</button>
    <button class="chip" id="mSent" aria-pressed="false">句子</button>
    <button class="chip" id="mCn" aria-pressed="false">中文</button>
    <button class="chip" id="mPassage" aria-pressed="false">文章</button>
    <button class="chip" id="mSymbol" aria-pressed="false">符号</button>
    <button class="chip" id="mRare" aria-pressed="false">生僻字</button>
    <button class="chip" id="mFree" aria-pressed="false">自由</button>
    <button class="chip best" id="chipBest" aria-label="历史最佳成绩">最佳 --</button>
    <button class="chip" id="chipReset" aria-label="清空历史记录">重置</button>
    <span id="fontWrap"><span class="lab">题面字号</span>
      <input type="range" id="fontSlider" class="mdslider" min="15" max="30" step="1" value="21" aria-label="题面字号">
      <span id="fontVal">21px</span>
    </span>
  </div>
  <div id="stats">
    <span>WPM <b id="sWpm">0</b></span>
    <span>准确率 <b id="sAcc">100%</b></span>
    <span>进度 <b id="sProg">0%</b></span>
    <span>用时 <b id="sTime">0s</b></span>
  </div>
  <div id="side">
    <div id="freeBox">
      <textarea id="freeText" aria-label="自定义练习内容" placeholder="粘贴或输入自定义练习内容（英文/中文均可），点击「开始练习」"></textarea>
      <button class="chip" id="freeGo">开始练习</button>
    </div>
    <div id="hint">键位提示：准确优先，错字会计入准确率；打完自动出成绩；中文/生僻字模式请用输入法，拼音组词期间不计入统计。</div>
    <div id="inputBar">
      <input id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="练习输入"
             spellcheck="false" inputmode="text" placeholder="在此输入…（点题面区可聚焦）">
    </div>
  </div>
  <div id="drill"></div>

  <div id="panel" role="dialog" aria-modal="true" aria-label="本组成绩">
    <div id="card">
      <h2>本组成绩</h2>
      <div id="grade">入门</div>
      <div class="metric"><span>WPM（净）</span><b id="rWpm">0</b></div>
      <div class="metric"><span>准确率</span><b id="rAcc">0%</b></div>
      <div class="metric"><span>用时</span><b id="rTime">0s</b></div>
      <div class="metric"><span>正确 / 错误</span><b id="rKeys">0 / 0</b></div>
      <div id="newBest">★ 新纪录！</div>
      <div class="row">
        <button class="chip" id="nextBtn">再来一组</button>
        <button class="chip" id="closeBtn">关闭</button>
      </div>
    </div>
  </div>

  <script src="../../js/word-core.js"></script>
  <script src="core.js"></script>
<script>
(function () {
  'use strict';
  var core = window.__typingCore;
  var $ = function (id) { return document.getElementById(id); };
  var drill = $('drill'), inp = $('inp');
  var BEST_KEY = 'typing.best.v1';

  var mode = 'word';            // word | sentence | cn | passage | symbol | rare | free
  var target = '';              // 当前题面
  var typed = '';               // 已输入
  var startedAt = 0;            // 首键时间戳
  var timer = null;
  var wordSeed = 1;             // 词组轮换（确定性）
  var sentIdx = 0;              // 句子轮换
  var bankIdx = { cn: 0, passage: 0, symbol: 0, rare: 0 }; // 二期题源轮换
  var composing = false;        // IME 组词期（拼音预输入不入统计，v9.07）
  var last = null;              // 最近一次成绩（e2e 桥）
  var fsLastOk = null;          // VFS 最近一次写入结果（e2e 桥；null=未触发）

  // ---------- 词库：#28 word-core 555 词直载，缺载走兜底 ----------
  function wordBank() {
    var b = (window.__wordCore && window.__wordCore.WORD_BANK) || [];
    return b.length ? b : core.FALLBACK_WORDS;
  }
  function buildTarget() {
    if (mode === 'word') {
      return core.pickWords(wordBank(), 12, wordSeed).join(' ');
    }
    if (mode === 'sentence') {
      return core.SENTENCES[sentIdx % core.SENTENCES.length];
    }
    if (mode === 'cn') {
      return core.CN_PHRASES[bankIdx.cn % core.CN_PHRASES.length];
    }
    if (mode === 'passage') {
      return core.CN_PASSAGES[bankIdx.passage % core.CN_PASSAGES.length];
    }
    if (mode === 'symbol') {
      return core.SYMBOL_MIX[bankIdx.symbol % core.SYMBOL_MIX.length];
    }
    if (mode === 'rare') {
      return core.RARE_GROUPS[bankIdx.rare % core.RARE_GROUPS.length];
    }
    return ($('freeText').value || '').replace(/\s+$/,'');
  }

  // ---------- 渲染 ----------
  function render() {
    var arr = core.compareChars(target, typed);
    var html = '', i;
    var yLen = Array.from(typed).length;              // 光标按码点口径（v9.07）
    var cur = Math.min(yLen, arr.length - 1);
    for (i = 0; i < arr.length; i++) {
      var cls = 'c s-' + arr[i].status + (i === cur && !last ? ' cur' : '');
      var ch = arr[i].ch === ' ' ? '␣' : arr[i].ch;
      html += '<span class="' + cls + '">' + esc(ch) + '</span>';
    }
    drill.innerHTML = html;
    var st = core.stats(target, typed, now());
    $('sWpm').textContent = st.wpm;
    $('sAcc').textContent = st.acc + '%';
    $('sProg').textContent = Math.round(st.progress * 100) + '%';
    $('sTime').textContent = Math.round(now() / 1000) + 's';
  }
  function esc(s) { return window.__mdEscape(s); } // #240：本地 charmap 退役，单一转义真源在 _shared/sanitize.js
  function now() { return startedAt ? (Date.now() - startedAt) : 0; }

  function tick() {
    if (!last && startedAt) render();
  }

  // ---------- 成绩留存（④SDK：VFS /documents/typing-records.json，__system.fs IndexedDB 桥） ----------
  var VFS_PATH = '/documents/typing-records.json';
  function fsAvailable() { return !!(window.__system && window.__system.fs); }
  function fsSyncRecords(rec) {
    if (!fsAvailable()) { fsLastOk = false; return; }
    try {
      var p = (typeof window.__system.fs.readText === 'function')
        ? window.__system.fs.readText(VFS_PATH)
        : window.__system.fs.read(VFS_PATH).then(function (r) { return (r && r.text) || ''; });
      Promise.resolve(p).then(function (txt) {
        var arr = [];
        try { arr = JSON.parse(txt) || []; } catch (e) { arr = []; }
        if (!Array.isArray(arr)) arr = [];
        arr.push({ mode: rec.mode, wpm: rec.wpm, acc: rec.acc, at: Date.now() });
        if (arr.length > 50) arr = arr.slice(-50);
        return window.__system.fs.write(VFS_PATH, JSON.stringify(arr), { mime: 'application/json' });
      }).then(function (r) { fsLastOk = !!r; }).catch(function () { fsLastOk = false; });
    } catch (e) { fsLastOk = false; }
  }
  function notifyHost(msg) {
    try { if (window.__system && window.__system.notify) window.__system.notify({ title: '打字练习', body: msg }); } catch (e) {}
  }

  // ---------- 成绩与最佳 ----------
  function bests() {
    try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveBest(m, rec) {
    var all = bests();
    var old = all[m];
    var isRec = !old || (rec.acc >= 95 && rec.wpm > old.wpm);
    if (isRec) { all[m] = { wpm: rec.wpm, acc: rec.acc, at: Date.now() };
      try { localStorage.setItem(BEST_KEY, JSON.stringify(all)); } catch (e) {} }
    renderBest();
    return isRec;
  }
  function renderBest() {
    var b = bests()[mode];
    $('chipBest').textContent = '最佳 ' + (b ? b.wpm + ' wpm' : '--');
  }

  // ---------- 会话控制 ----------
  function startSession(keepTyped) {
    target = buildTarget();
    if (!target) { target = core.SENTENCES[0]; }
    if (!keepTyped) typed = '';
    startedAt = 0;
    last = null;
    if (timer) { clearInterval(timer); timer = null; }
    $('panel').classList.remove('show');
    render();
  }
  function finish() {
    if (timer) { clearInterval(timer); timer = null; }
    var st = core.stats(target, typed, now());
    var g = core.grade(st.wpm, st.acc);
    var isRec = saveBest(mode, st);
    last = { mode: mode, score: st.wpm, wpm: st.wpm, acc: st.acc, grade: g,
             seconds: Math.round(now() / 1000), best: bests()[mode] };
    fsSyncRecords({ mode: mode, wpm: st.wpm, acc: st.acc });
    if (isRec) notifyHost('新纪录：WPM ' + st.wpm + '（准确率 ' + st.acc + '%，' + g + '）');
    $('rWpm').textContent = st.wpm;
    $('rAcc').textContent = st.acc + '%';
    $('rTime').textContent = Math.round(now() / 1000) + 's';
    $('rKeys').textContent = st.correct + ' / ' + st.wrong;
    $('grade').textContent = g;
    $('newBest').style.display = isRec ? 'block' : 'none';
    $('panel').classList.add('show');
    render();
  }

  // ---------- 输入接线（v9.07：IME 组词期保护，compositionend 才入统计） ----------
  function processInput() {
    if (last) { inp.value = ''; return; }           // 成绩面板期冻结
    typed = inp.value;
    if (typed && !startedAt) {
      startedAt = Date.now();
      timer = setInterval(tick, 250);
    }
    render();
    var st = core.stats(target, typed, now());
    if (st.done) finish();
  }
  inp.addEventListener('compositionstart', function () { composing = true; });
  inp.addEventListener('compositionend', function () {
    composing = false;
    processInput();
  });
  inp.addEventListener('input', function () {
    if (composing) { return; }                       // 拼音预输入不计
    processInput();
  });
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); }   // 题面不含换行，Enter 不产生 extra
  });
  drill.addEventListener('pointerdown', function () { inp.focus(); });

  // ---------- 模式切换 ----------
  var MODE_CHIP = { word: 'mWord', sentence: 'mSent', cn: 'mCn',
    passage: 'mPassage', symbol: 'mSymbol', rare: 'mRare', free: 'mFree' };
  function setMode(m) {
    mode = m;
    Object.keys(MODE_CHIP).forEach(function (k) { $(MODE_CHIP[k]).classList.remove('on'); $(MODE_CHIP[k]).setAttribute('aria-pressed', String(k === m)); });
    $(MODE_CHIP[m]).classList.add('on');
    $('freeBox').classList.toggle('show', m === 'free');
    inp.value = '';
    if (m === 'free' && !$('freeText').value) { drill.innerHTML = '<span class="c s-pend">在下方输入自定义内容后开始练习…</span>'; return; }
    startSession();
  }
  $('mWord').addEventListener('click', function () { setMode('word'); });
  $('mSent').addEventListener('click', function () { setMode('sentence'); });
  $('mCn').addEventListener('click', function () { setMode('cn'); });
  $('mPassage').addEventListener('click', function () { setMode('passage'); });
  $('mSymbol').addEventListener('click', function () { setMode('symbol'); });
  $('mRare').addEventListener('click', function () { setMode('rare'); });
  $('mFree').addEventListener('click', function () { setMode('free'); });
  $('freeGo').addEventListener('click', function () { setMode('free'); inp.focus(); });
  $('nextBtn').addEventListener('click', function () {
    if (mode === 'word') wordSeed++;
    else if (mode === 'sentence') sentIdx++;
    else if (bankIdx[mode] != null) bankIdx[mode]++;
    inp.value = '';
    startSession();
    inp.focus();
  });
  $('closeBtn').addEventListener('click', function () { $('panel').classList.remove('show'); });
  $('chipReset').addEventListener('click', function () {
    try { localStorage.removeItem(BEST_KEY); } catch (e) {}
    renderBest();
  });

  // ---------- ⑤ 题面字号怠速柄滑条（markdown 同款 --p 同步；持久化 localStorage） ----------
  var FONT_KEY = 'typing.fontsize.v1';
  var fontSlider = $('fontSlider');
  function applyFont() {
    var v = parseInt(fontSlider.value, 10);
    drill.style.fontSize = v + 'px';
    fontSlider.style.setProperty('--p', ((v - 15) / 15 * 100) + '%');
    $('fontVal').textContent = v + 'px';
    try { localStorage.setItem(FONT_KEY, String(v)); } catch (e) {}
  }
  fontSlider.addEventListener('input', applyFont);
  try { var fv = parseInt(localStorage.getItem(FONT_KEY), 10); if (fv >= 15 && fv <= 30) fontSlider.value = fv; } catch (e) {}
  applyFont();

  // ---------- ⑤ 顶栏 chip 整排按压联动（pressRipple：按压者压缩+圆角增大，
  // 邻项按距离衰减让位——tile-bounce.js Bounceable 数学同构轻量版，ζ=1 观感） ----------
  var chips = Array.prototype.slice.call(document.querySelectorAll('#bar .chip'));
  function pressRipple(originIdx) {
    chips.forEach(function (k, i) {
      var d = Math.abs(i - originIdx);
      var f = d === 0 ? 1 : Math.max(0, 1 - d * 0.45);
      var sc = d === 0 ? 0.88 : 1 - 0.05 * f;
      var shift = d === 0 ? 0 : (i < originIdx ? 1 : -1) * 2 * f;
      k.style.transform = 'translateX(' + shift.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ')';
      k.style.borderRadius = (999 - (d === 0 ? 60 : 24) * f) + 'px';
      k.style.zIndex = d === 0 ? '1' : '';
    });
  }
  function releaseRipple() {
    chips.forEach(function (k) { k.style.transform = ''; k.style.borderRadius = ''; k.style.zIndex = ''; });
  }
  chips.forEach(function (k, i) {
    k.addEventListener('pointerdown', function () { pressRipple(i); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { k.addEventListener(ev, releaseRipple); });
  });
  document.addEventListener('pointerup', releaseRipple);

  renderBest();
  startSession();

  // ---------- 只读 e2e 桥（零写入面） ----------
  window.__typingUI = {
    get mode() { return mode; },
    get target() { return target; },
    get typed() { return typed; },
    get last() { return last; },
    get best() { return (bests()[mode] || {}).wpm || 0; },
    get bankIdx() { return bankIdx; },
    get composing() { return composing; },
    get fontSize() { return parseInt(document.getElementById('fontSlider').value, 10); },
    get fsSynced() { return fsLastOk; },
    stats: function () { return core.stats(target, typed, now()); },
    grade: function () { return core.grade(last ? last.wpm : 0, last ? last.acc : 0); },
    setTyped: function (v) { inp.value = String(v); inp.dispatchEvent(new Event('input')); }
  };
})();
</script>
  <script src="../_shared/idle-slider.js"></script>
</body>
