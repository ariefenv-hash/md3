<!DOCTYPE html>
<html lang="zh-CN" data-theme-mode="dark">
<head><script src="../freeze-shim.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>每日单词 · WORD CARD</title>
    <link rel="stylesheet" href="../_shared/md3-tokens.css">
    <script src="../../js/word-core.js"></script>
<style>
        /* ==================== v11.12 #154 多词书 + i18n ====================
           v8.39 #28 单词卡继承：断网全功能（词库 + Web Speech 双声发音，零音频
           文件零网络）、卡片翻面果冻手感、三键评分。#154 增量：词书注册表
           （CET-4 内置 / CET-6·考研分册 JSON 懒加载）、进度按词书命名空间隔离、
           音标展示、界面 zh/en 双语切换（word-core WD_I18N 单一真源）。 */
        :root {
            --md-h: 215; /* 色相令牌由宿主主题引擎动态注入（无宿主时回落默认 215） */
            --wd-stage: var(--md-surface);
            --wd-card: var(--md-surface-container-high, var(--md-surface-container));
            --wd-text: var(--md-on-surface);
            --wd-dim: var(--md-on-surface-variant);
            --wd-chip: var(--md-secondary-container);
            --wd-chip-text: var(--md-on-secondary-container);
            --wd-accent: var(--md-primary);
            --wd-err-bg: var(--md-error-container);
            --wd-err-text: var(--md-on-error-container);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { height: 100%; }
        body { margin: 0; overflow: hidden; background: var(--wd-stage); color: var(--wd-text);
               font-family: var(--md-font, var(--md-text-font, system-ui, sans-serif)); }
        .wd-app { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 16px 18px 18px; gap: 12px; }
        /* ---------- 顶栏：标题 + 统计 ---------- */
        .wd-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
        .wd-title { font-size: 19px; font-weight: 700; letter-spacing: .3px; }
        .wd-stats { font-size: 12px; color: var(--wd-dim); text-align: right; line-height: 1.5; }
        .wd-stats b { color: var(--wd-accent); font-weight: 700; }
        .wd-bar { height: 4px; border-radius: 2px; background: var(--md-surface-container-highest, rgba(128,128,128,.25)); overflow: hidden; }
        .wd-bar > i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--wd-accent);
                      transition: width 320ms cubic-bezier(.2,.8,.2,1); }
        /* ---------- 工具行：词书切换 + 界面语言（#154） ---------- */
        .wd-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
        .wd-toolbar-label { font-size: 11px; color: var(--wd-dim); flex-shrink: 0; }
        .wd-book { border: 1px solid var(--md-outline-variant, transparent); background: transparent;
                   color: var(--wd-dim); font-size: 11px; padding: 4px 9px; border-radius: 999px; cursor: pointer;
                   font-family: inherit; white-space: nowrap; }
        .wd-book.on { background: var(--wd-chip); color: var(--wd-chip-text); border-color: transparent; font-weight: 700; }
        .wd-book:disabled { opacity: .5; cursor: default; }
        .wd-lang { margin-left: auto; flex-shrink: 0; }
        /* ---------- 卡片：3D 翻面（果冻回弹手感） ---------- */
        .wd-cardzone { flex: 1; min-height: 0; perspective: 1200px; display: flex; }
        .wd-card { position: relative; flex: 1; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .wd-inner { position: absolute; inset: 0; transform-style: preserve-3d;
                    transition: transform 420ms var(--md-easing-spring-legacy, cubic-bezier(.34,1.56,.64,1)); }
        .wd-card.flipped .wd-inner { transform: rotateY(180deg); }
        .wd-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
                   border-radius: var(--md-r-xl, 24px); background: var(--wd-card);
                   display: flex; flex-direction: column; align-items: center; justify-content: center;
                   gap: 10px; padding: 22px 20px; box-shadow: 0 6px 22px rgba(0,0,0,.16); }
        .wd-face.back { transform: rotateY(180deg); }
        .wd-word { font-size: clamp(30px, 8.4vw, 42px); font-weight: 800; letter-spacing: .4px; line-height: 1.1; text-align: center; }
        .wd-uk { font-size: 13px; color: var(--wd-dim); letter-spacing: .3px; min-height: 16px; }
        .wd-pos { font-size: 13px; color: var(--wd-dim); font-style: italic; }
        .wd-meaning { font-size: clamp(19px, 5.2vw, 25px); font-weight: 700; text-align: center; line-height: 1.4; }
        .wd-reminder { font-size: 12px; color: var(--wd-dim); }
        .wd-hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center;
                   font-size: 11px; color: var(--wd-dim); opacity: .75; }
        /* ---------- 发音行：🔊 图标钮 + 双声 chip ---------- */
        .wd-speakrow { display: flex; align-items: center; gap: 8px; }
        .wd-speak { width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; /* v11.12 #294 处置 3：命中区 42×42→44×44 直升 */
                    background: var(--wd-accent); color: var(--md-on-primary, #fff);
                    display: flex; align-items: center; justify-content: center;
                    transition: transform 130ms var(--md-easing-spring-legacy, cubic-bezier(.34,1.56,.64,1)); }
        .wd-speak:active { transform: scale(.88); }
        .wd-speak svg { width: 21px; height: 21px; }
        .wd-chip { border: 1px solid var(--md-outline-variant, transparent); background: transparent;
                   color: var(--wd-dim); font-size: 11px; padding: 4px 9px; border-radius: 999px; cursor: pointer;
                   font-family: inherit; }
        .wd-chip.on { background: var(--wd-chip); color: var(--wd-chip-text); border-color: transparent; font-weight: 700; }
        /* ---------- 三键：认识 / 模糊 / 不认识（#28 原文） ---------- */
        .wd-actions { display: flex; gap: 10px; }
        .wd-btn { flex: 1; height: 48px; border-radius: var(--md-r-full, 999px); border: none; cursor: pointer;
                  font-size: 15px; font-weight: 700; font-family: inherit;
                  transition: transform 130ms var(--md-easing-spring-legacy, cubic-bezier(.34,1.56,.64,1)), filter 130ms; }
        .wd-btn:active { transform: scale(.94); filter: brightness(1.08); }
        .wd-know { background: var(--wd-accent); color: var(--md-on-primary, #fff); }
        .wd-fuzzy { background: var(--wd-chip); color: var(--wd-chip-text); }
        .wd-no { background: var(--wd-err-bg); color: var(--wd-err-text); }
        /* ---------- 完成态 ---------- */
        .wd-done { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
                   justify-content: center; gap: 12px; padding: 24px; text-align: center; }
        .wd-app[data-wd-state="done"] .wd-done { display: flex; }
        .wd-app[data-wd-state="done"] .wd-cardzone,
        .wd-app[data-wd-state="done"] .wd-actions { display: none; }
        .wd-done-title { font-size: 24px; font-weight: 800; }
        .wd-done-sub { font-size: 13px; color: var(--wd-dim); line-height: 1.8; }
        .wd-done-sub b { color: var(--wd-accent); }
        /* 新卡入场（rx-pop 同款手感） */
        @keyframes wd-pop { 0% { transform: scale(.92); opacity: .4; } 62% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
        .wd-card.enter .wd-face.front { animation: wd-pop 240ms var(--md-easing-spring-legacy, cubic-bezier(.34,1.56,.64,1)); }
        /* ---------- #261 批 1：平板 760 真布局分栏（对齐 tp-wide 双栏范式，非手机版放大） ----------
           左栏 = 卡片区 + 三键作答（主作业面）；右栏 = 标题/统计 + 词书工具 + 进度条（导航面）。
           grid-template-columns 为实质布局差异（#230 验收用例 3：空媒体查询不算）；手机态纵向流零变化。 */
        @media (min-width: 760px) {
            .wd-app { display: grid; grid-template-columns: minmax(0, 1fr) 300px;
                      grid-template-rows: auto auto 1fr auto; column-gap: 22px; row-gap: 12px;
                      padding: 22px 26px 24px; }
            .wd-cardzone { grid-column: 1; grid-row: 1 / 4; }
            .wd-actions  { grid-column: 1; grid-row: 4; max-width: 520px; }
            .wd-head     { grid-column: 2; grid-row: 1; flex-direction: column; align-items: flex-start; gap: 2px; }
            .wd-toolbar  { grid-column: 2; grid-row: 2; flex-wrap: wrap; row-gap: 6px; }
            .wd-bar      { grid-column: 2; grid-row: 3; align-self: start; }
        }
        @media (prefers-color-scheme: light) { html:not([data-theme-mode="dark"]) {
            --wd-stage: var(--md-surface);
        } }


    /* V4 状态层（#306 批 2）：按压态令牌（#262 批 1 photos 先例同款），悬停/静态零变化 */
    .wd-btn:active { background: var(--md-state-pressed, rgba(255,255,255,0.12)); }
    .wd-speak:active { background: var(--md-state-pressed, rgba(255,255,255,0.12)); }

</style>
</head>
<body>
    <div class="wd-app" data-wd-state="queue">
        <div class="wd-head">
            <div class="wd-title" id="wdTitle">每日单词</div>
            <div class="wd-stats" id="wdStats">载入中…</div>
        </div>
        <div class="wd-toolbar">
            <span class="wd-toolbar-label" id="wdBookLabel">词书</span>
            <button class="wd-book on" id="wdBookCet4" data-book="cet4">CET-4</button>
            <button class="wd-book" id="wdBookCet6" data-book="cet6">CET-6</button>
            <button class="wd-book" id="wdBookKaoyan" data-book="kaoyan">考研</button>
            <button class="wd-book wd-lang" id="wdUiLang" aria-label="切换界面语言">EN</button>
        </div>
        <div class="wd-bar"><i id="wdBar"></i></div>
        <div class="wd-cardzone">
            <div class="wd-card" id="wdCard" data-flipped="0">
                <div class="wd-inner">
                    <div class="wd-face front">
                        <div class="wd-pos" id="wdPos"></div>
                        <div class="wd-word" id="wdWord"></div>
                        <div class="wd-uk" id="wdUk"></div>
                        <div class="wd-speakrow">
                            <button class="wd-speak" id="wdSpeak" aria-label="发音">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </button>
                            <button class="wd-chip" id="wdLangUS" data-lang="en-US">美音</button>
                            <button class="wd-chip" id="wdLangGB" data-lang="en-GB">英音</button>
                        </div>
                        <div class="wd-hint" id="wdHint">点卡片看释义</div>
                    </div>
                    <div class="wd-face back">
                        <div class="wd-word" id="wdWordBack" style="font-size:clamp(16px,4.6vw,20px);opacity:.6;"></div>
                        <div class="wd-meaning" id="wdMeaning"></div>
                        <div class="wd-reminder" id="wdBackRem">记住了吗？在下方作答</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="wd-actions">
            <button class="wd-btn wd-no" id="wdNo" data-wd-grade="unknown">不认识</button>
            <button class="wd-btn wd-fuzzy" id="wdFuzzy" data-wd-grade="fuzzy">模糊</button>
            <button class="wd-btn wd-know" id="wdKnow" data-wd-grade="know">认识</button>
        </div>
        <div class="wd-done">
            <div class="wd-done-title" id="wdDoneTitle">今日任务完成</div>
            <div class="wd-done-sub" id="wdDoneSub"></div>
        </div>
    </div>
<script>
(function () {
    'use strict';
    var core = window.__wordCore;
    var root = document.querySelector('.wd-app');
    if (!core || !root) return; // word-core 缺载防御：绝不白屏崩链

    var store = null;
    try { store = window.localStorage; } catch (e) {}

    // ---------- #154 界面语言（zh/en，持久化 word_ui_lang_v1） ----------
    var LS_UI_LANG = 'word_ui_lang_v1';
    var LS_BOOK = 'word_book_v1';
    var uiLang = 'zh';
    try { uiLang = store.getItem(LS_UI_LANG) === 'en' ? 'en' : 'zh'; } catch (e) {}
    function L() { return core.WD_I18N[uiLang] || core.WD_I18N.zh; }
    function fill(tpl, map) {
        return String(tpl).replace(/\{(\w+)\}/g, function (_, k) {
            return (map && map[k] !== undefined) ? map[k] : '';
        });
    }

    // ---------- #154 词书状态（进度按词书命名空间隔离，键 = core.progressKeyFor） ----------
    var activeBook = 'cet4';
    try {
        var saved = store.getItem(LS_BOOK);
        if (saved && core.bookById(saved)) activeBook = saved;
    } catch (e) {}

    var bank = core.WORD_BANK;   // 当前词书词条（cet4 内置 / 其余分册懒加载）
    var byWord = {};
    var progress = null;
    var queue = [];
    var idx = 0;
    var requeued = {};           // 会话内 unknown 重现计次（每词至多补现 2 次，防死循环）
    var lang = 'en-US';
    var bookCache = { cet4: core.WORD_BANK }; // 词书内存缓存（懒加载一次，切换零延迟）

    var todayKey = core.dayKeyOf(new Date());

    var elCard = document.getElementById('wdCard');
    var elWord = document.getElementById('wdWord');
    var elWordBack = document.getElementById('wdWordBack');
    var elUk = document.getElementById('wdUk');
    var elPos = document.getElementById('wdPos');
    var elMeaning = document.getElementById('wdMeaning');
    var elStats = document.getElementById('wdStats');
    var elBar = document.getElementById('wdBar');
    var elDoneSub = document.getElementById('wdDoneSub');

    function save() {
        try { store.setItem(core.progressKeyFor(activeBook), JSON.stringify(progress)); } catch (e) {}
    }

    // ---------- i18n 静态面（动态面在 renderStats/render 内取 L()） ----------
    function applyI18n() {
        var t = L();
        document.getElementById('wdTitle').textContent = t.title;
        document.getElementById('wdBookLabel').textContent = t.book;
        document.getElementById('wdHint').textContent = t.hint;
        document.getElementById('wdBackRem').textContent = t.backReminder;
        document.getElementById('wdDoneTitle').textContent = t.doneTitle;
        document.getElementById('wdSpeak').setAttribute('aria-label', t.speak);
        document.getElementById('wdLangUS').textContent = t.usPron;
        document.getElementById('wdLangGB').textContent = t.ukPron;
        document.getElementById('wdNo').textContent = t.btnUnknown;
        document.getElementById('wdFuzzy').textContent = t.btnFuzzy;
        document.getElementById('wdKnow').textContent = t.btnKnow;
        document.getElementById('wdUiLang').textContent = uiLang === 'zh' ? 'EN' : '中文';
    }

    // Web Speech 双声发音（#28 执行要点：零音频文件；任何异常静默）
    function speak(text) {
        try {
            if (!('speechSynthesis' in window) || !window.speechSynthesis) return;
            var u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            u.rate = 0.92;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(u);
        } catch (e) {}
    }

    function flipTo(back) {
        elCard.classList.toggle('flipped', back);
        elCard.dataset.flipped = back ? '1' : '0';
    }

    function renderStats() {
        var s = core.statsOf(progress, todayKey);
        var remain = Math.max(0, queue.length - idx);
        var t = L();
        elStats.innerHTML = fill(t.statsQueue, { n: remain }) + '<br>' + fill(t.statsLearned, { n: s.learned, m: s.streak });
        var totalToday = Math.max(1, queue.length);
        elBar.style.width = Math.min(100, Math.round((idx / totalToday) * 100)) + '%';
    }

    function render() {
        renderStats();
        if (idx >= queue.length) {
            var s = core.statsOf(progress, todayKey);
            var t = L();
            root.dataset.wdState = 'done';
            elDoneSub.innerHTML = fill(t.doneSub, {
                new: s.todayNew, rev: s.todayReviews, learned: s.learned,
                total: bank.length, mastered: s.mastered, streak: s.streak,
            });
            save();
            // #261 批 1 C 面：完成今日任务 → 系统通知（Heads-up + 通知中心，typing 新纪录同款语义；
            // 可选守卫 + try/catch —— 旧桌面不可用时行为与旧版完全一致）
            try {
                if (window.__system && window.__system.notify) {
                    window.__system.notify({ appId: 'word', appName: L().title,
                                             title: L().doneTitle,
                                             desc: fill(t.doneSub, { new: s.todayNew, rev: s.todayReviews,
                                                     learned: s.learned, total: bank.length,
                                                     mastered: s.mastered, streak: s.streak }).replace(/<[^>]+>/g, ' ') });
                }
            } catch (e) {}
            return;
        }
        root.dataset.wdState = 'queue';
        var w = byWord[queue[idx]];
        if (!w) { idx++; render(); return; } // 词库防漂移防御
        flipTo(false);
        elWord.textContent = w.word;
        elWordBack.textContent = w.word;
        elUk.textContent = w.uk ? '/' + w.uk + '/' : '';
        elUk.style.display = w.uk ? '' : 'none';
        elPos.textContent = w.pos;
        elMeaning.textContent = w.meaning;
        elCard.classList.remove('enter');
        void elCard.offsetWidth; // 重启动画
        elCard.classList.add('enter');
    }

    function grade(g) {
        if (idx >= queue.length) return;
        var w = queue[idx];
        core.applyGrade(progress, w, g, todayKey);
        save();
        // #261 批 1 C 面：评分事件广播（总线共享数据源，#178 判据：只广播不改存储；
        // 可选守卫 + try/catch —— 旧桌面 __system 不可用时行为与旧版完全一致）
        try {
            if (window.__system && window.__system.emit) {
                var s0 = core.statsOf(progress, todayKey);
                window.__system.emit('word/graded', { book: activeBook, word: w, grade: g,
                                                       learned: s0.learned, streak: s0.streak });
            }
        } catch (e) {}
        // 不认识 → 会话内末尾补现（至多 2 次，防死循环）
        if (g === 'unknown' && (requeued[w] || 0) < 2) {
            requeued[w] = (requeued[w] || 0) + 1;
            queue.push(w);
        }
        idx++;
        render();
    }

    // ---------- #154 词书装载（cet4 内置零网络；cet6/kaoyan 分册 JSON 懒加载） ----------
    function armBook(bankData) {
        bank = bankData;
        byWord = {};
        bank.forEach(function (e) { byWord[e.word] = e; });
        progress = core.normalizeProgress(store ? store.getItem(core.progressKeyFor(activeBook)) : null);
        queue = core.buildQueue(bank, progress, todayKey);
        idx = 0;
        requeued = {};
        render();
    }

    function loadBook(id) {
        if (bookCache[id]) { armBook(bookCache[id]); return; }
        // 懒加载中：按钮禁用防连点；失败降级提示（绝不清空当前会话状态）
        setBookButtons(id, true);
        fetch('books/' + id + '.json', { cache: 'force-cache' }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }).then(function (data) {
            var loaded = core.normalizeBank(data && data.words);
            bookCache[id] = loaded;
            setBookButtons(id, false);
            if (activeBook !== id) return; // 载入期间用户已切走：只入缓存不渲染
            armBook(loaded);
        }).catch(function () {
            setBookButtons(id, false);
            if (activeBook !== id) return;
            elStats.innerHTML = L().loadFail;
        });
    }

    function setBookButtons(id, loading) {
        ['cet4', 'cet6', 'kaoyan'].forEach(function (b) {
            var el = document.querySelector('.wd-book[data-book="' + b + '"]');
            if (!el) return;
            el.classList.toggle('on', b === id);
            if (b === id) el.disabled = !!loading;
        });
    }

    function setBook(id) {
        if (!core.bookById(id) || id === activeBook) return;
        activeBook = id;
        try { store.setItem(LS_BOOK, id); } catch (e) {}
        flipTo(false);
        loadBook(id);
    }

    // ---------- 事件挂接 ----------
    elCard.addEventListener('click', function () {
        flipTo(elCard.dataset.flipped !== '1');
    });
    document.getElementById('wdSpeak').addEventListener('click', function (e) {
        e.stopPropagation();
        if (idx < queue.length) speak(byWord[queue[idx]].word);
    });
    var us = document.getElementById('wdLangUS'), gb = document.getElementById('wdLangGB');
    function setLang(l) {
        lang = l;
        us.classList.toggle('on', l === 'en-US');
        gb.classList.toggle('on', l === 'en-GB');
    }
    us.addEventListener('click', function (e) { e.stopPropagation(); setLang('en-US'); speak(byWord[queue[idx]] ? byWord[queue[idx]].word : ''); });
    gb.addEventListener('click', function (e) { e.stopPropagation(); setLang('en-GB'); speak(byWord[queue[idx]] ? byWord[queue[idx]].word : ''); });
    setLang('en-US');
    document.getElementById('wdKnow').addEventListener('click', function () { grade('know'); });
    document.getElementById('wdFuzzy').addEventListener('click', function () { grade('fuzzy'); });
    document.getElementById('wdNo').addEventListener('click', function () { grade('unknown'); });

    // ---------- #261 批 1 D 面：三键评分行整排按压联动（pressRipple：邻项按距离衰减让位 + 圆角形变，
    // tile-bounce.js Bounceable 数学同构轻量版，stt 语言行/gravity/typing 顶栏同款范式） ----------
    var elActions = document.querySelector('.wd-actions');
    var _wdPressIdx = -1;
    function _wdPressReset() {
        if (!elActions) return;
        elActions.querySelectorAll('.wd-btn').forEach(function (k) { k.style.transform = ''; k.style.borderRadius = ''; });
        _wdPressIdx = -1;
    }
    if (elActions) {
        elActions.addEventListener('pointerdown', function (e) {
            var btns = Array.prototype.slice.call(elActions.querySelectorAll('.wd-btn'));
            _wdPressIdx = btns.indexOf(e.target.closest('.wd-btn'));
            if (_wdPressIdx < 0) return;
            btns.forEach(function (k, j) {
                var d = Math.abs(j - _wdPressIdx);
                var f = d === 0 ? 1 : Math.max(0, 1 - d * 0.45);
                var sc = d === 0 ? 0.9 : 1 - 0.04 * f;
                var shift = d === 0 ? 0 : (j < _wdPressIdx ? 1 : -1) * 2 * f;
                k.style.transform = 'translateX(' + shift + 'px) scale(' + sc + ')';
                if (d === 0) k.style.borderRadius = '14px';
            });
        });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
            elActions.addEventListener(ev, _wdPressReset);
        });
    }
    document.getElementById('wdBookCet4').addEventListener('click', function () { setBook('cet4'); });
    document.getElementById('wdBookCet6').addEventListener('click', function () { setBook('cet6'); });
    document.getElementById('wdBookKaoyan').addEventListener('click', function () { setBook('kaoyan'); });
    document.getElementById('wdUiLang').addEventListener('click', function () {
        uiLang = uiLang === 'zh' ? 'en' : 'zh';
        try { store.setItem(LS_UI_LANG, uiLang); } catch (e) {}
        applyI18n();
        render();
    });

    // ---------- 启动：i18n 静态面 + 激活词书（持久化恢复，默认 cet4 存量键） ----------
    applyI18n();
    setBookButtons(activeBook, false);
    loadBook(activeBook);
})();
</script>
</body>
</html>
