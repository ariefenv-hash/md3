<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>{{APP_TITLE}}</title>
<!--
  {{APP_ID}} — 由 npm run new-app 脚手架生成
  ══════════════════════════════════════════════════════════
  这是一个 iframe 子应用页面（与 apps/ 下其余子应用同构，共享件两行接入）：

  · 在桌面内运行时，桌面 main.js 会向本 iframe 注入 SDK：
      window.__system = {
        emit(event, payload, target),        // 应用总线：定向 / 广播
        notify({appId, title, desc, icon}),  // 系统通知（heads-up + 通知中心）
        requestPermission(name),             // 权限系统（相机/麦克风/位置/通知/剪贴板）
        fs:   { write, readText, list, del, ... },   // VFS 虚拟文件系统桥
        clipboard: { write, read },                  // 全局剪贴板桥
      }
  · 直连浏览器打开（不经桌面）时 __system 为 undefined，页面须可独立运行。
  · aria 语义纪律（v10.10 #105 二期升格）：图标钮一律 aria-label；动态状态区
    （toast/日志）一律 role="status" + aria-live；div 可点面一律 role="button"
    + tabindex="0"；存量 title 平移为「aria-label + title 双写」不摘除。
  · v10.38 #228/#227/#230 升格：本模板须过 8 项评分卡（audit-app-quality.mjs 全量
    扫描，模板同审）—— 已补 ②760px 真分栏 / A 令牌密度 / D 带手柄滑条（组件接入）
    / E 无障碍 / F 动效 / G 持久化骨架；滑块伪元素禁止本地定义（D 门禁硬 fail）。
  · v10.53 #246/#244建议②：状态层令牌（--md-state-hover/pressed，全库 0/41 破零
    示范）+ 字体契约（--md-font）默认内建 —— 生成应用天然带状态层与字体契约基线。
  ══════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="../_shared/md3-tokens.css">
<link rel="stylesheet" href="../_shared/idle-slider.css">
<!-- #240：净化基建默认引入——插值变量过 window.__mdEscape，富文本过 window.__mdSanitize -->
<script src="../_shared/sanitize.js"></script>
<script src="../_shared/a11y.js"></script> <!-- #241：键盘可达性自动增强（新应用天然达标①⑤准入） -->
<style>
  /* 应用主题覆盖（挂 ../_shared/md3-tokens.css 规范令牌层之上；:root 内只放主题差异值） */
  :root {
    --md-primary: #7DF8DB;
    --md-surface: #101418;
    --md-surface-container: #1A2026;
    --md-on-surface: #E2E7EA;
    --md-outline-variant: rgba(255, 255, 255, 0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--md-surface); background-image: var(--md-scrim, none);
    color: var(--md-on-surface);
    font-family: var(--md-font, "Noto Sans SC", system-ui, -apple-system, sans-serif);
    display: flex; flex-direction: column;
    user-select: none;
  }
  header {
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    font-size: 20px; font-weight: 600;
    border-bottom: 1px solid var(--md-outline-variant); color: var(--md-on-surface);
  }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .card {
    background: var(--md-surface-container);
    border-radius: var(--md-r-lg, 18px); padding: 18px;
    margin-bottom: 14px; font-size: 14px; line-height: 1.7;
  }
  .md3-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--md-primary); color: var(--md-on-primary, #06231A);
    border: none; border-radius: var(--md-r-full, 100px);
    padding: 10px 22px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .md3-btn:active { transform: scale(0.96); background: color-mix(in srgb, var(--md-primary) 82%, var(--md-on-primary)); }
  .md3-btn.tonal { background: var(--md-primary-container, rgba(125, 248, 219, 0.14)); color: var(--md-on-primary-container, var(--md-primary)); }
  .md3-btn { transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.15s, background 0.15s; }
  /* v10.53 #246：状态层令牌示范（MD3 hover 8% / pressed 12% 标准浓度，随明暗主题自动反相） */
  .md3-btn:hover { box-shadow: var(--md-elevation-2, 0 2px 6px rgba(0, 0, 0, 0.3));
                   background: color-mix(in srgb, var(--md-primary) 88%, var(--md-on-primary)); }
  .md3-btn:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
  .demo-slider-row { color: var(--md-on-surface); }
  .card { transition: background 0.2s; border: 1px solid var(--md-outline-variant); }
  .card:hover { background: color-mix(in srgb, var(--md-state-hover) 100%, var(--md-surface-container)); }
  .demo-slider-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .demo-slider-row .lab { font-size: 12px; color: var(--md-on-surface-variant, var(--md-on-surface)); }
  @keyframes md-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  main { animation: md-fade-in 0.24s cubic-bezier(0.2, 0, 0, 1); }

  /* #243 V7 空状态示范：MD3 空态 = 图标 + 主文案 + 辅助文案（弱化色，不抢主体）。
     列表/详情类应用在数据为空时复用本块（class=empty-state），替换文案与图标即可。 */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 24px 16px; text-align: center;
    border: 1px dashed var(--md-outline-variant);
    border-radius: var(--md-r-lg, 18px);
    color: var(--md-on-surface-variant, var(--md-on-surface));
  }
  .empty-state .es-icon { font-size: 26px; opacity: .8; line-height: 1; }
  .empty-state .es-main { font-size: 13.5px; font-weight: 600; color: var(--md-on-surface); }
  .empty-state .es-sub { font-size: 12px; }

  /* ② 平板真分栏（≥760px）：卡片双列网格 —— 手机单列，平板信息密度翻倍（#230 B 语义门槛） */
  @media (min-width: 760px) {
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
    .card { margin-bottom: 0; }
    .card-full { grid-column: 1 / -1; }
    header { font-size: 24px; padding-left: 32px; padding-right: 32px; }
    main { padding: 24px 32px; }
  }
</style>
</head>
<body>
  <header>{{APP_TITLE}}</header>
  <main>
    <div class="card">
      这是脚手架生成的子应用。<b>{{APP_ID}}</b> 与桌面通过 <code>window.__system</code> SDK
      通信（总线 / 通知 / 权限 / 文件系统 / 剪贴板），脱离桌面直开亦可独立运行。
    </div>
    <div class="card" id="log" role="status" aria-live="polite">SDK 状态：检测中…</div>
    <button class="md3-btn" id="btnHello">发一条系统通知</button>
    <button class="md3-btn tonal" id="btnBus" style="margin-left:8px;">向总线广播事件</button>
    <div class="card card-full">
      <!-- ⑤ 带手柄滑条：视觉规范在 ../_shared/idle-slider.css（组件接入，禁本地伪元素） -->
      <div class="demo-slider-row">
        <span class="lab" id="demoLab">示例参数</span>
        <input type="range" id="demoSlider" class="mdslider" min="0" max="100" step="1" value="40"
               aria-labelledby="demoLab">
        <span class="lab" id="demoVal" aria-live="off">40</span>
      </div>
    </div>
    <!-- #243 V7 空状态示范（empty-state）：列表/详情类应用数据为空时复用本块，替换文案与图标 -->
    <div class="card card-full">
      <div class="empty-state" role="status">
        <span class="es-icon" aria-hidden="true">▢</span>
        <span class="es-main">暂无内容</span>
        <span class="es-sub">空状态示范位——接入真实数据后替换文案与图标</span>
      </div>
    </div>
  </main>

<script>
(function () {
  'use strict';
  // 桌面注入的 SDK（直开时为 null，页面保持可独立运行）
  var sdk = window.__system || null;

  var log = document.getElementById('log');
  function say(msg) { log.textContent = 'SDK 状态：' + msg; }

  if (sdk) {
    say('已接入桌面（总线 / 通知 / 权限 / fs / 剪贴板 可用）');
  } else {
    say('独立运行（未经桌面注入，__system 不可用）');
  }

  document.getElementById('btnHello').addEventListener('click', function () {
    if (!sdk || !sdk.notify) { say('当前环境无通知通道'); return; }
    sdk.notify({ appId: '{{APP_ID}}', title: '{{APP_TITLE}}', desc: '来自 {{APP_ID}} 的测试通知' });
  });

  document.getElementById('btnBus').addEventListener('click', function () {
    if (!sdk || !sdk.emit) { say('当前环境无总线通道'); return; }
    // 广播示例：任何监听 '{{APP_ID}}/ping' 的应用都会收到
    sdk.emit('{{APP_ID}}/ping', { from: '{{APP_ID}}', at: Date.now() });
    say('已广播 {{APP_ID}}/ping');
  });
})();
</script>
<script src="../_shared/idle-slider.js"></script>
<script>
(function () {
  'use strict';
  // G 持久化骨架 + D 组件 --p 契约（v10.38 #228/#230）：滑条值落 localStorage，
  // 恢复时经 __idleSlider.sync 同步轨道填充
  var KEY = '{{APP_ID}}/demo-slider';
  var el = document.getElementById('demoSlider');
  var out = document.getElementById('demoVal');
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* 独立开隐私态等场景静默降级 */ }
  if (saved !== null && el) el.value = saved;
  function paint() {
    if (!el) return;
    out.textContent = el.value;
    window.__idleSlider && window.__idleSlider.sync(el);
    try { localStorage.setItem(KEY, el.value); } catch (e) { /* 同上 */ }
  }
  if (el) el.addEventListener('input', paint);
  paint();
})();
</script>
</body>
</html>
